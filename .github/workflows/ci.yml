name: checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Синтаксис Python 3.9
        # В прошивках на Debian 11 стоит Python 3.9. Код, который туда не
        # поедет (match, | в аннотациях), должен падать здесь, а не на
        # контроллере в чужом доме.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = 0
          for path in sorted(pathlib.Path('.').rglob('*.py')):
              if '.git' in path.parts:
                  continue
              try:
                  ast.parse(path.read_text(encoding='utf-8'),
                            filename=str(path), feature_version=(3, 9))
              except SyntaxError as exc:
                  print('НЕ 3.9: %s:%s: %s' % (path, exc.lineno, exc.msg))
                  bad += 1
              else:
                  print('ok 3.9: %s' % path)
          sys.exit(1 if bad else 0)
          PY

      - name: Шаблон Jinja2 разбирается
        run: |
          pip install jinja2 pyyaml
          python - <<'PY'
          import pathlib, sys
          from jinja2 import Environment, FileSystemLoader
          dirs = [d for d in ('templates', '.') if pathlib.Path(d).is_dir()]
          env = Environment(loader=FileSystemLoader(dirs), autoescape=True,
                            trim_blocks=True, lstrip_blocks=True)
          bad = 0
          for path in sorted(pathlib.Path('.').rglob('*.j2')):
              try:
                  env.parse(path.read_text(encoding='utf-8'))
                  print('ok: %s' % path)
              except Exception as exc:
                  print('ОШИБКА %s: %s' % (path, exc))
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Пример конфига — валидный YAML
        run: |
          python - <<'PY'
          import sys, yaml
          data = yaml.safe_load(open('config.example.yaml', encoding='utf-8'))
          panels = (data or {}).get('panels') or {}
          if not panels:
              print('в config.example.yaml нет ни одной панели')
              sys.exit(1)
          print('панелей: %d' % len(panels))
          PY

      - name: Рендер всех панелей во всех темах
        # tests/render_check.py: каждая панель tests/fixtures/showcase.yaml в
        # каждой встроенной теме собирается, разбирается как XML, плоская
        # подстановка не оставляет var(). Отпечатки вида (golden.json) здесь
        # только для сведения: другая версия Jinja2 может расставить пробелы
        # иначе.
        run: |
          pip install flask paho-mqtt
          python tests/render_check.py --soft

      - name: Каждый адрес демона отвечает
        run: python tests/routes_check.py

      - name: Скрипты страницы - ES5 и порядок файлов
        run: |
          npm install --no-save --silent acorn@8
          node tests/js_check.js

      - name: Шелл-скрипты
        # -S warning: ошибки и предупреждения роняют сборку, придирки уровня
        # info и style - нет. Иначе CI краснеет из-за «используйте find вместо
        # ls», а на реальные проблемы перестают смотреть.
        #
        # SC2086 (кавычки) и SC1091 (source) в этих скриптах намеренны.
        # LC_ALL нужен из-за русских комментариев: без UTF-8 локали
        # shellcheck спотыкается на выводе.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          LC_ALL=C.UTF-8 shellcheck -s sh -S warning -e SC2086,SC1091 ./*.sh

      - name: Личные данные не уехали в репозиторий
        run: sh check-secrets.sh

  browser:
    # Страница в настоящем браузере: окна, пульты, шестерёнка, обновление
    # (tests/browser_check.js сам поднимает тестовый сервер).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Зависимости
        run: |
          pip install flask paho-mqtt pyyaml jinja2
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
      - name: Браузерные проверки
        run: node tests/browser_check.js
