# Панель внутри штатного веб-интерфейса: http://<контроллер>/panel/
#
# КУДА КЛАСТЬ:
#     /etc/nginx/includes/default.wb.d/panel.conf
#
# Это официальная точка расширения Wiren Board - так написано в
# /etc/nginx/sites-available/default. Каталог не принадлежит пакету
# wb-mqtt-homeui, поэтому обновление прошивки его не затирает.
#
#     nginx -t && systemctl reload nginx

# Без косой черты на конце адрес не попадает в location ниже и уходит в
# веб-интерфейс. Отправляем на правильный адрес.
location = /panel { return 301 /panel/; }

# ^~ обязателен: у веб-интерфейса есть location с регулярным выражением на
# статические файлы, а регулярные выражения в nginx приоритетнее обычного
# префикса. Без ^~ /panel/main.html уходил бы в статику вебморды и давал 404.
location ^~ /panel/ {
    # --- доступ ------------------------------------------------------------
    # satisfy any: достаточно ЛИБО адреса из списка, ЛИБО пароля.
    #
    # 127.0.0.1 - это Wiren Board Cloud: агент проксирует запросы изнутри
    # контроллера, поэтому снаружи они приходят с локального адреса.
    # Разрешаем, потому что облако УЖЕ спросило пароль при входе. Второй
    # пароль на той же сессии ничего не добавляет, только мешает.
    #
    # Панель при этом остаётся не строже штатного веб-интерфейса: он через
    # облако доступен ровно так же.
    #
    # Свою подсеть посмотрите командой:  ip -4 addr show
    satisfy any;
    allow 127.0.0.1;          # Wiren Board Cloud
    allow ::1;
    allow 192.168.0.0/16;     # домашняя сеть
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny  all;

    # Пароль остаётся как страховка: он сработает, если кто-то пробросит
    # порт 80 наружу напрямую, минуя облако.

    # Отдельный файл паролей - НЕ тот, которым закрыт веб-интерфейс.
    # Создать:
    #     printf "panel:$(openssl passwd -apr1)\n" > /etc/nginx/panel.passwd
    #     chmod 640 /etc/nginx/panel.passwd
    #     chown root:www-data /etc/nginx/panel.passwd
    #
    # Проверить, что nginx его читает:
    #     sudo -u www-data cat /etc/nginx/panel.passwd
    auth_basic "Панель";
    auth_basic_user_file /etc/nginx/panel.passwd;

    # --- собственно панель ---------------------------------------------------
    proxy_pass http://127.0.0.1:8088/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ETag должен доходить до браузера нетронутым, иначе планшет будет
    # перекачивать картинку каждый раз вместо ответа 304
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_pass_header ETag;
    proxy_buffering off;
}
