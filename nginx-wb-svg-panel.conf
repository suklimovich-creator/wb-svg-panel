# /etc/nginx/sites-available/wb-svg-panel
#
# Отдельный server на порту 8080, чтобы не трогать штатный конфиг
# веб-интерфейса Wiren Board на порту 80 — он перезаписывается
# при обновлении пакета wb-mqtt-homeui.
#
# Включить:
#   ln -s /etc/nginx/sites-available/wb-svg-panel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Панели будут доступны как:
#   http://<контроллер>:8080/main.svg     — картинка
#   http://<контроллер>:8080/main.html    — обёртка с автообновлением (для планшета)
#   http://<контроллер>:8080/channels     — список всех каналов контроллера

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    access_log off;

    location / {
        # Список доступа лежит вне репозитория: подсети у каждого свои, и
        # держать их в общем конфиге незачем. Файл создаёт close-8080.sh.
        # Звёздочка в конце - не опечатка: с ней nginx не падает, когда
        # файла нет, а без неё пустой include это ошибка запуска.
        include /etc/nginx/includes/wb-svg-panel-acl.conf*;

        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;

        # ETag от демона должен доходить до браузера в неизменном виде,
        # иначе сломается 304 и планшет будет перекачивать SVG каждые 10 секунд.
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_pass_header ETag;

        # Панель обновляется часто — промежуточное кэширование только мешает.
        proxy_buffering off;
    }

    # Если панель смотрит куда-то за пределы доверенной сети — раскомментируйте.
    # Пароль: htpasswd -c /etc/nginx/.htpasswd panel
    #
    # location / {
    #     auth_basic "Panel";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://127.0.0.1:8088;
    # }
}
