# Отдельный сервер на порту 8080 - простой вариант, не зависящий от
# обновлений пакета wb-mqtt-homeui.
#
#   ln -s /etc/nginx/sites-available/wb-svg-panel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Минусы против варианта с /panel/ на порту 80:
#   * свой порт, на который ругается встроенная проверка безопасности;
#   * не наследует HTTPS и не проксируется через Wiren Board Cloud.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    access_log off;

    location / {
        # Тот же логин и пароль, что у веб-интерфейса контроллера.
        # Раскомментируйте, если пароль на вебморду уже настроен
        # (файл /etc/nginx/passwd существует):
        #
        # include /etc/nginx/sites-available/global_auth;

        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_pass_header ETag;
        proxy_buffering off;
    }
}
