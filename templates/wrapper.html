      if(state === 'auto' && q){ jobs.push(pub(q, '1')); f.setAttribute('data-state', 'quiet'); }
      else {
        if(state === 'quiet' && q) jobs.push(pub(q, '0'));
        if(topic) jobs.push(pub(topic, 'auto'));
        f.setAttribute('data-state', 'auto');
      }
    }
    Promise.all(jobs).catch(function(e){ flash('Не удалось: ' + e.message); });
    schedule(900);
  }

  /* ---- жалюзи ---- */
  function dialIndex(g, p){
    var angs = g.getAttribute('data-angs').split(',').map(parseFloat);
    var a = Math.atan2(p.y - num(g,'y'), p.x - num(g,'x')) * 180 / Math.PI, best = 0, bd = 1e9;
    for(var i = 0; i < angs.length; i++){
      var d = Math.abs(((a - angs[i]) % 360 + 540) % 360 - 180);
      if(d < bd){ bd = d; best = i; }
    }
    return best;
  }
  function showDial(g, idx, auto){
    g.setAttribute('class', 'acs-dial' + (auto ? ' auto' : ''));
    var arr = g.querySelectorAll('.acs-arrow');
    for(var i = 0; i < arr.length; i++)
    { arr[i].setAttribute('class', 'acs-arrow' + (auto || i === idx ? ' on' : ''));
      arr[i].setAttribute('stroke-width', g.getAttribute(!auto && i === idx ? 'data-awon' : 'data-aw')); }
    if(!auto){
      var angs = g.getAttribute('data-angs').split(',').map(parseFloat), a = angs[idx] * Math.PI / 180;
      var x = num(g,'x'), y = num(g,'y'), p1 = num(g,'p1'), p2 = num(g,'p2'), ptr = g.querySelector('.acs-ptr');
      ptr.setAttribute('x1', (x + Math.cos(a) * p1).toFixed(1)); ptr.setAttribute('y1', (y + Math.sin(a) * p1).toFixed(1));
      ptr.setAttribute('x2', (x + Math.cos(a) * p2).toFixed(1)); ptr.setAttribute('y2', (y + Math.sin(a) * p2).toFixed(1));
      g.setAttribute('data-active', String(idx));
    }
  }
  function sendDial(g, value){
    var topic = node.getAttribute(g.getAttribute('data-z') === 'vdial' ? 'data-ac-swing' : 'data-ac-swing-h');
    if(topic) pub(topic, value).catch(function(e){ flash('Не удалось: ' + e.message); });
    schedule(1500);
  }

  /* выбор в шторке колеса линиями: скорость (с «тихо») или жалюзи */
  function pickSet(set, value){
    var jobs = [];
    if(set === 'fan'){
      var topic = node.getAttribute('data-ac-fan'), q = node.getAttribute('data-ac-quiet');
      var quietNow = G.getAttribute('data-fanstate') === 'quiet';
      if(value === 'quiet'){ if(q) jobs.push(pub(q, '1')); }
      else {
        if(quietNow && q) jobs.push(pub(q, '0'));
        if(topic) jobs.push(pub(topic, value));
      }
    } else {
      var t = node.getAttribute(set === 'vdial' ? 'data-ac-swing' : 'data-ac-swing-h');
      if(t) jobs.push(pub(t, value));
    }
    Promise.all(jobs).catch(function(e){ flash('Не удалось: ' + e.message); });
    schedule(700);
  }

  /* скорость по кругу (колесо линиями): 1 - 2 - 3 - авто - тихо. Кружок и
     подпись меняются сразу, картинка с сервера догоняет. */
  var FAN_CYCLE = ['low', 'medium', 'high', 'auto', 'quiet'];
  var FAN_WORD = {low: 'скорость 1', medium: 'скорость 2', high: 'скорость 3', auto: 'авто', quiet: 'тихо'};
  var FAN_LEVEL = {low: 1, medium: 2, high: 3, auto: 3, quiet: 1};
  function cycleFan(el){
    var now = G.getAttribute('data-fanstate'), i = FAN_CYCLE.indexOf(now);
    var next = FAN_CYCLE[(i + 1) % FAN_CYCLE.length];
    var blades = el.querySelectorAll('path.acw-blade'), grp = el.querySelector('.acl');
    for(var k = 0; k < blades.length; k++)
      blades[k].setAttribute('class', 'acl-b acw-blade' + (k < FAN_LEVEL[next] ? ' act' : ''));
    if(grp) grp.setAttribute('class', 'acl' + (next === 'auto' ? ' swing' : ''));
    var cap = el.querySelector('.acp-val');
    if(cap) cap.textContent = FAN_WORD[next];
    pickSet('fan', next);
    G.setAttribute('data-fanstate', next);
  }

  /* ---- жесты ---- */
  function begin(e){
    if(!G) return;
    busy = true;
    var p = local(e), zEl = closest(e.target, '[data-z]');
    gest = {zone: zEl ? zEl.getAttribute('data-z') : '', el: zEl, x0: p.x, y0: p.y, p: p,
            moved: false, t0: pos, a0: angle(p), idx: -1};
    if(gest.zone === 'vdial-hub' || gest.zone === 'hdial-hub') gest.dial = closest(zEl.parentNode, '[data-z]');
  }
  function move(e){
    if(!gest || !G) return;
    var p = local(e);
    if(!(p.x || p.y)) return;
    gest.p = p;
    if(Math.sqrt(Math.pow(p.x - gest.x0, 2) + Math.pow(p.y - gest.y0, 2)) > 6 * Math.max(1, D.fs / 2)) gest.moved = true;
    if(!gest.moved) return;
    var z = gest.zone;
    if(z === 'wheel' && !D.notarget){
      var d = angle(p) - gest.a0;
      while(d > 180) d -= 360;
      while(d < -180) d += 360;
      pos = Math.max(D.lo, Math.min(D.hi, gest.t0 - d / D.dpd));
      temp = Math.max(D.lo, Math.min(D.hi, Math.round(pos / stepV) * stepV));
      draw();
    } else if(D.arc){
      return;
    } else if(z === 'fan'){
      var ring = fanRing(gest.el, p);
      if(ring){ gest.ring = ring; showFan(gest.el, ring); }
    } else if(z === 'vdial' || z === 'hdial'){
      gest.idx = dialIndex(gest.el, p);
      showDial(gest.el, gest.idx, false);
    }
  }
  function done(){
    busy = false;
    var g = gest; gest = null;
    if(!g || !G) return;
    var ch = G.querySelector('.acs-ch.open') || G.querySelector('.acs-ch[data-sheet="mode"]') || G.querySelector('.acs-ch');
    var chOpen = ch && /open/.test(ch.getAttribute('class'));
    if(g.moved){
      if(g.zone === 'wheel' && !D.notarget){ pos = temp; draw(); if(Math.abs(temp - g.t0) > 0.001) sendTarget(); }
      else if(g.zone === 'fan' && g.ring) setFan(g.el, g.ring);
      else if((g.zone === 'vdial' || g.zone === 'hdial') && g.idx >= 0)
        sendDial(g.el, g.el.getAttribute('data-values').split(',')[g.idx]);
      return;
    }
    // касание без сдвига
    if(chOpen && g.zone !== 'pick'){ ch.setAttribute('class', 'acs-ch'); return; }
    var z = g.zone, p = g.p;
    if(z === 'back'){ closeOv(); return; }
    if(z === 'power'){
      var topic = node.getAttribute('data-topic');
      if(topic) pub(topic, D.on ? node.getAttribute('data-off') : node.getAttribute('data-on'))
        .catch(function(e){ flash('Не удалось: ' + e.message); });
      schedule(700); return;
    }
    if(z === 'mode'){ if(ch) ch.setAttribute('class', 'acs-ch open'); return; }
    if(D.arc && z === 'fan'){ cycleFan(g.el); return; }
    if(D.arc && (z === 'vdial' || z === 'hdial')){
      var sh = G.querySelector('.acs-ch[data-sheet="' + z + '"]');
      if(sh) sh.setAttribute('class', 'acs-ch open');
      return;
    }
    if(z === 'pick'){
      if(ch) ch.setAttribute('class', 'acs-ch');
      var set = g.el.getAttribute('data-set');
      if(set){ pickSet(set, g.el.getAttribute('data-value')); return; }
      var mt = node.getAttribute('data-ac-mode');
      if(mt) pub(mt, g.el.getAttribute('data-mode')).catch(function(e){ flash('Не удалось: ' + e.message); });
      schedule(700); return;
    }
    if(z === 'fan'){ setFan(g.el, fanRing(g.el, p)); return; }
    if(z === 'vdial-hub' || z === 'hdial-hub'){
      var dg = g.dial, auto = /auto/.test(dg.getAttribute('class')), vals = dg.getAttribute('data-values').split(',');
      var idx = parseInt(dg.getAttribute('data-active'), 10);
      if(isNaN(idx) || idx < 0) idx = 2;
      showDial(dg, idx, !auto);
      sendDial(dg, auto ? vals[idx] : 'auto');
      return;
    }
    if(z === 'vdial' || z === 'hdial'){
      var i2 = dialIndex(g.el, p); showDial(g.el, i2, false);
      sendDial(g.el, g.el.getAttribute('data-values').split(',')[i2]); return;
    }
    if(z === 'wheel' && !D.notarget){
      // тап по шкале у обода - уставка доезжает до этого деления
      var dist = Math.sqrt(Math.pow(p.x - D.cx, 2) + Math.pow(p.y - D.cy, 2));
      if(Math.abs(dist - D.r) < 26 * D.fs){
        var dd = angle(p) - D.asp;
        while(dd > 180) dd -= 360;
        while(dd < -180) dd += 360;
        var t = Math.max(D.lo, Math.min(D.hi, Math.round((pos + dd / D.dpd) / stepV) * stepV));
        if(Math.abs(t - pos) > 0.001) animateTo(t);
      }
    }
  }
}

/* ---------- пульт фанкойла: дуга-улыбка ---------- */
function padArc(node){
  var lo = parseFloat(node.getAttribute('data-ac-lo')||'16');
  var hi = parseFloat(node.getAttribute('data-ac-hi')||'30');
  var step = parseFloat(node.getAttribute('data-ac-step')||'1');
  // pos - непрерывное положение шкалы, temp - значение, которое отправим.
  // Раньше шкала перерисовывалась от округлённого значения, из-за чего
  // засечки всегда попадали в те же места и колесо казалось неподвижным.
  var temp = parseFloat(node.getAttribute('data-ac-now'));
  if(isNaN(temp)) temp = Math.round((lo+hi)/2);
  var pos = temp;

  var title = el('div','ttl', node.getAttribute('data-title') || 'Кондиционер');
  var cur = node.getAttribute('data-ac-cur');
  // Крупно сверху - ФАКТИЧЕСКАЯ температура: уставку и так видно на шкале,
  // дублировать её незачем.
  var big = el('div','wbig');
  big.innerHTML = (cur || '--').replace('°','') + '<span class="wdeg">°C</span>';
  var sub = el('div','hint','в комнате · уставку задайте колесом');

  var W = Math.min(window.innerWidth - 30, 470), H = 190;
  var wrap = el('div'); wrap.id = 'wheel';
  wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
  wrap.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">'
    + '<path class="warc2" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>'
    + '<path class="wnotch" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/>'
    + '<g class="wticks"></g>'
    + '<path class="warc" fill="none" stroke="#B08BE8" stroke-width="3"/>'
    + '</svg>';
  // ВАЖНО: узлы ещё не в документе, поэтому ищем внутри wrap.
  // Через document.getElementById здесь приходит null, и пульт падал молча.
  var gTicks = wrap.querySelector('.wticks');
  var pArc   = wrap.querySelector('.warc');
  var pArc2  = wrap.querySelector('.warc2');
  var pNotch = wrap.querySelector('.wnotch');

  /* Дуга «улыбкой»: центр окружности НАД картинкой, поэтому середина шкалы
     внизу, а края поднимаются - как в приложении. Раньше центр был снизу и
     дуга выгибалась в другую сторону. */
  var PXDEG = W / 5, R = W * 1.7, CX = W / 2, BOTTOM = H - 34, CY = BOTTOM - R;
  function pt(delta, radius){
    var a = (delta * PXDEG) / R;
    var r = radius === undefined ? R : radius;
    return [CX + r * Math.sin(a), CY + r * Math.cos(a), a];
  }
  function arcPath(radius, half){
    var p0 = pt(-half, radius), p1 = pt(half, radius);
    return 'M ' + p0[0].toFixed(1) + ',' + p0[1].toFixed(1)
         + ' A ' + radius.toFixed(0) + ',' + radius.toFixed(0)
         + ' 0 0 0 ' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1);
  }
  function draw(){
    var s = '', v, from = Math.ceil((pos - 3.2) * 5) / 5;
    for(v = from; v <= pos + 3.2; v += 0.2){
      if(v < lo - 0.001 || v > hi + 0.001) continue;
      var p = pt(v - pos), whole = Math.abs(v - Math.round(v)) < 0.05;
      var len = whole ? 12 : 7;
      // засечки смотрят наружу от центра окружности, то есть вниз
      var x2 = p[0] + Math.sin(p[2]) * len, y2 = p[1] + Math.cos(p[2]) * len;
      s += '<line x1="' + p[0].toFixed(1) + '" y1="' + p[1].toFixed(1)
         + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1)
         + '" stroke="#fff" stroke-width="' + (whole ? 1.7 : 1)
         + '" opacity="' + (whole ? .7 : .3) + '"/>';
      if(whole){
        // подписи с внутренней стороны дуги, то есть выше неё
        var lx = p[0] - Math.sin(p[2]) * 20, ly = p[1] - Math.cos(p[2]) * 20;
        var near = Math.abs(v - temp) < 0.05;
        s += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1)
           + '" text-anchor="middle" font-size="' + (near ? 19 : 16)
           + '" fill="rgba(255,255,255,' + (near ? .92 : .45) + ')">'
           + Math.round(v) + '°</text>';
      }
    }
    gTicks.innerHTML = s;
    pArc.setAttribute('d', arcPath(R, 3.2));
    pArc2.setAttribute('d', arcPath(R - 74, 2.6));
    var n = pt(0, R - 74);
    pNotch.setAttribute('d', 'M ' + (n[0] - 8) + ',' + (n[1] - 9)
                           + ' L ' + n[0] + ',' + (n[1] + 1)
                           + ' L ' + (n[0] + 8) + ',' + (n[1] - 9));
  }
  draw();

  var startX = null, startPos = pos;
  function begin(ev){
    startX = evPoint(ev).clientX; startPos = pos;
  }
  function at(ev){
    if(startX === null) begin(ev);
    pos = startPos - (evPoint(ev).clientX - startX) / PXDEG;  // влево - теплее
    pos = Math.max(lo, Math.min(hi, pos));
    temp = Math.max(lo, Math.min(hi, Math.round(pos / step) * step));
    draw();
  }
  function send(){
    startX = null;
    pos = temp;                       // защёлкиваем шкалу на выбранном делении
    draw();
    var t = node.getAttribute('data-ac-target');
    if(t) pub(t, temp).catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  drag(wrap, at, send, begin);

  var parts = [title, big, wrap, sub].concat(acControls(node));
  openOv(parts);
}

/* Ряд кнопок «выбери одно». Вынесен из padAC наружу: те же ряды нужны
   полноэкранному виду, а там своего пульта нет. */
function acChooser(node, list, attr, nowValue, changed){
  var row = el('div','acrow');
  list.forEach(function(item){
    // третий элемент - значок вместо подписи (жалюзи), подпись уходит в title
    var b = el('div', 'acbtn' + (item[2] ? ' ic' : '') + (item[0] === nowValue ? ' on' : ''),
               item[2] ? '' : item[1]);
    if(item[2]){ b.innerHTML = item[2]; b.title = item[1]; }
    b.onclick = function(){
      var topic = node.getAttribute(attr);
      if(!topic) return;
      pub(topic, item[0]).then(function(){
        var all = row.querySelectorAll('.acbtn');
        for(var i = 0; i < all.length; i++) all[i].classList.remove('on');
        b.classList.add('on');
        if(changed) changed(item[0]);
      }).catch(function(e){ flash('Не удалось: ' + e.message); });
    };
    row.appendChild(b);
  });
  return row;
}

/* Набор кнопок: "значение|подпись;…" из атрибута плитки, иначе зашитый
   здесь. У фанкойла режимы и скорости числовые и свои у каждого прибора,
   да и у сплита осушение с авто есть далеко не всегда. */
function acChoices(node, attr, fallback){
  var raw = node.getAttribute(attr), out = [];
  if(!raw) return fallback;
  raw.split(';').forEach(function(item){
    var p = item.split('|');
    if(p[0] !== '') out.push([p[0], p.length > 1 ? p[1] : p[0]]);
  });
  return out.length ? out : fallback;
}

/* Управление прибором: режимы, скорость вентилятора, лопасти, питание.
   Один набор на два места - пульт и полный экран. У фанкойла короткое
   нажатие раскрывает плитку, и если бы органы управления жили только в
   пульте, до скорости вентилятора пришлось бы добираться вслепую. */
/* Значок жалюзи для кнопки: веер из пяти лопастей. pos - какая светится
   (0..4), -1 - качание: тогда светятся все и под ними двойная стрелка. */
var LV_DEG = [-34, -17, 0, 17, 34];
function lvIcon(axis, pos){
  var s = '<svg viewBox="0 0 32 26" width="36" height="29" fill="none" stroke="currentColor" stroke-linecap="round">';
  var cx = 16, cy = 13, L = 5.2, i;
  for(i = 0; i < 5; i++){
    var a = LV_DEG[i] * Math.PI / 180, act = pos < 0 || pos === i;
    var x1, y1, x2, y2;
    if(axis === 'h'){
      var bx = cx + (i - 2) * 3.6, by = cy - 4.4, dx = Math.sin(a) * L, dy = Math.cos(a) * L;
      x1 = bx - dx * .2; y1 = by - dy; x2 = bx + dx; y2 = by + dy * .8;
    } else {
      var bx2 = cx - 3.4, by2 = cy + (i - 2) * 3.6, ex = Math.cos(a) * L, ey = Math.sin(a) * L;
      x1 = bx2 - ex; y1 = by2 - ey * .8; x2 = bx2 + ex * .8; y2 = by2 + ey * .2;
    }
    s += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1)
       + '" y2="' + y2.toFixed(1) + '" stroke-width="' + (act && pos >= 0 ? 2.8 : 1.7)
       + '" opacity="' + (act ? 1 : .3) + '"/>';
  }
  if(pos < 0){
    s += axis === 'h'
      ? '<path d="M 8,20 Q 16,25 24,20 M 8,20 l 3,-1 M 8,20 l 1,3 M 24,20 l -3,-1 M 24,20 l -1,3" stroke-width="1.6"/>'
      : '<path d="M 24,5 Q 29,13 24,21 M 24,5 l -.6,3 M 24,5 l 2.6,1.6 M 24,21 l -.6,-3 M 24,21 l 2.6,-1.6" stroke-width="1.6"/>';
  }
  return s + '</svg>';
}

function acControls(node, changed){
  var parts = [];
  parts.push(el('div','hint','Режим'));
  parts.push(acChooser(node, acChoices(node, 'data-ac-modes',
             [['cool','Холод'],['heat','Тепло'],['dry','Сушка'],
              ['fan_only','Обдув'],['auto','Авто']]),
             'data-ac-mode', node.getAttribute('data-ac-mode-now'), changed));
  parts.push(el('div','hint','Скорость вентилятора'));
  parts.push(acChooser(node, acChoices(node, 'data-ac-fans',
             [['low','1'],['medium','2'],['high','3'],['auto','Авто']]),
             'data-ac-fan', node.getAttribute('data-ac-fan-now'), changed));
  if(node.getAttribute('data-ac-swing')){
    parts.push(el('div','hint','Жалюзи вверх-вниз'));
    // первая кнопка - качание, дальше пять положений сверху вниз
    parts.push(acChooser(node, [['auto','Качание', lvIcon('v', -1)],
                        ['upper','Верх', lvIcon('v', 0)], ['position_2','2', lvIcon('v', 1)],
                        ['position_3','3', lvIcon('v', 2)], ['position_4','4', lvIcon('v', 3)],
                        ['bottom','Низ', lvIcon('v', 4)], ['off','Выкл']],
                       'data-ac-swing', node.getAttribute('data-ac-swing-now'), changed));
  }
  if(node.getAttribute('data-ac-swing-h')){
    parts.push(el('div','hint','Жалюзи влево-вправо'));
    // кнопки идут слева направо, как реальные положения глазами
    // человека перед блоком: 7·6·1·5·4 (в 1.16.1 перевёрнуто)
    parts.push(acChooser(node, [['auto','Качание', lvIcon('h', -1)],
                        ['position_7','Лево', lvIcon('h', 0)], ['position_6','Лево-центр', lvIcon('h', 1)],
                        ['position_1','Центр', lvIcon('h', 2)], ['position_5','Центр-право', lvIcon('h', 3)],
                        ['position_4','Право', lvIcon('h', 4)]],
                       'data-ac-swing-h', node.getAttribute('data-ac-swing-h-now'), changed));
  }
  parts.push(powerRow(node).el);
  return parts;
}

/* ---------- пульт диммера: линейный ---------- */
function padLevel(node){
  if(node.getAttribute('data-look') === 'classic') return padLevelFlat(node);
  /* С 1.17: колесо, как на плитке, только крупно. Ведёшь вверх - ярче.
     Шаг относительный: колесо крутится за пальцем от того места, где
     было, а не прыгает в точку касания, - промахом не выкрутить на сто. */
  var W = Math.round(Math.min(window.innerWidth * 0.5, 200));
  var H = Math.round(Math.min(window.innerHeight * 0.5, 380));
  var box = el('div'); box.id = 'lvl'; box.className = 'roll';
  box.style.width = W + 'px'; box.style.height = H + 'px';
  var hint = el('div','hint','Крутите колесо вверх или вниз · кнопками − / + по проценту');
  // С 1.23: шапка как у кондиционера, под колесом «− число +».
  var power = powerRow(node, true);
  var head = padHead(node.getAttribute('data-title') || 'Яркость', power.el);
  power.onPaint = function(){ head.sub.textContent = power.on ? 'Включено' : 'Выключено'; };
  power.onPaint();
  var lvl = parseFloat(node.getAttribute('data-level') || '0'), PAL = ovPal();
  var NS = 'http://www.w3.org/2000/svg', KW = Math.round(W * 0.56), KH = H - 8;
  var KX = Math.round((W - KW - 22) / 2), KY = 4;
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  function mk(tag, a, parent){
    var e = document.createElementNS(NS, tag);
    for(var k in a) e.setAttribute(k, a[k]);
    (parent || svg).appendChild(e); return e;
  }
  mk('defs', {}).innerHTML = '<linearGradient id="lvcyl" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/>'
    + '<stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>';
  mk('rect', {x: KX - 5, y: KY - 4, width: KW + 10, height: KH + 8, rx: 7, fill: PAL.slot,
              stroke: PAL.faceEdge});
  mk('rect', {x: KX, y: KY, width: KW, height: KH, rx: 3, fill: PAL.drum});
  var ribs = mk('g', {});
  mk('rect', {x: KX, y: KY, width: KW, height: KH, rx: 3, fill: 'url(#lvcyl)'});
  var BX = KX + KW + 18;
  mk('rect', {x: BX, y: KY, width: 5, height: KH, rx: 2.5, fill: PAL.track});
  var bar = mk('rect', {x: BX, width: 5, rx: 2.5, fill: PAL.acc});
  box.appendChild(svg);
  var turn = lvl * 9;            // поворот колеса в шагах рёбер, копится за пальцем
  function place(){
    var step = 15 / KH, n = Math.ceil(1.6 / step) + 1, ph = turn % 1, out = '';
    if(ph < 0) ph += 1;
    for(var k = -n; k <= n; k++){
      var th = (k + ph) * step;
      if(Math.abs(th) > 1.52) continue;
      var y = KY + (Math.sin(th) * .5 + .5) * KH, w = Math.cos(th);
      out += '<line x1="' + (KX + 4) + '" x2="' + (KX + KW - 4) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1)
           + '" stroke="#000" stroke-width="' + (.8 + 3.2 * w).toFixed(2) + '" opacity="' + (.25 + .5 * w).toFixed(2) + '"/>'
           + '<line x1="' + (KX + 4) + '" x2="' + (KX + KW - 4) + '" y1="' + (y + 2 * w).toFixed(1) + '" y2="' + (y + 2 * w).toFixed(1)
           + '" stroke="#fff" stroke-width="' + (.8 * w).toFixed(2) + '" opacity="' + (.1 * w).toFixed(2) + '"/>';
    }
    ribs.innerHTML = out;
    bar.setAttribute('y', (KY + KH * (1 - lvl)).toFixed(1));
    bar.setAttribute('height', (KH * lvl).toFixed(1));
  }
  place();

  function send(){
    var bmax = parseFloat(node.getAttribute('data-bright-max') || '100');
    return power.ensureOn()
      .then(function(){ return pub(node.getAttribute('data-bright'), Math.round(lvl * bmax)); })
      .catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  var srow = el('div', 'vals'), sMinus = hbtn('', '', null), sPlus = hbtn('', '', null), sNum = el('div');
  sMinus.textContent = '−'; sPlus.textContent = '+';
  srow.appendChild(sMinus); srow.appendChild(sNum); srow.appendChild(sPlus);
  var step = {repaint: function(){ sNum.innerHTML = '<small>яркость</small>' + Math.round(lvl * 100) + ' %'; }};
  step.repaint();
  stepKeys(sMinus, sPlus, {
    read:  function(){ return Math.round(lvl * 100); },
    write: function(v){ turn += (v / 100 - lvl) * KH / 15; lvl = v / 100; place(); },
    send:  send,
    paint: step.repaint
  });
  openOv([head, box, srow, hint]);
  var y0 = 0, l0 = 0, t0 = 0;
  function begin(ev){ var p = evPoint(ev); y0 = p.clientY; l0 = lvl; t0 = turn; }
  function at(ev){
    var p = evPoint(ev);
    if(p.clientY === undefined) return;
    var dy = p.clientY - y0;
    // полный ход - полторы высоты колеса: точнее, чем «от низа до верха»
    lvl = Math.max(0, Math.min(1, l0 - dy / (KH * 1.5)));
    turn = t0 - dy / 15 * (H / KH);
    place(); step.repaint();
  }
  drag(box, at, send, begin);
}

/* Прежний пульт диммера (look: classic): полоса, заполнение снизу. */
function padLevelFlat(node){
  var box = el('div'); box.id='lvl';
  box.style.width = Math.round(Math.min(window.innerWidth*0.5, 220)) + 'px';
  box.style.height = Math.round(Math.min(window.innerHeight*0.5, 380)) + 'px';
  var fill = el('div','fill'), val = el('div','val');
  box.appendChild(fill); box.appendChild(val);
  var title = el('div','ttl', node.getAttribute('data-title') || 'Яркость');
  var hint = el('div','hint','Ведите вверх или вниз · стрелками по проценту');
  var power = powerRow(node);
  var lvl = parseFloat(node.getAttribute('data-level')||'0');
  function place(){ fill.style.height=(lvl*100)+'%'; val.textContent=Math.round(lvl*100)+' %'; }
  place();

  function send(){
    var bmax = parseFloat(node.getAttribute('data-bright-max')||'100');
    return power.ensureOn()
      .then(function(){ return pub(node.getAttribute('data-bright'), Math.round(lvl*bmax)); })
      .catch(function(e){ flash('Не удалось: '+e.message); });
  }

  var step = stepRow('Яркость', {
    unit: ' %',
    read:  function(){ return Math.round(lvl*100); },
    write: function(v){ lvl = v/100; place(); },
    send:  send
  });

  openOv([title, box, step, power.el, hint]);
  function at(ev){
    var r = box.getBoundingClientRect();
    var p = evPoint(ev);
    lvl = Math.max(0, Math.min(1, 1-(p.clientY-r.top)/r.height));
    place(); step.repaint();
  }
  drag(box, at, send);
}

/* Пульт шторы.
   Полоса задаёт положение, кнопки под ней - «закрыть / стоп / открыть».
   Пока палец ведёт, показываем то, что он выбрал; отпустил - отправляем
   одно значение. Промежуточные значения слать нельзя: у привода каждая
   команда это новая цель, и он дёргался бы за пальцем. */
function padCurtain(node, axis){
  /* Раскрытая штора - это та же плитка, только крупно: рисует её сервер тем
     же макросом, что и на панели. Своей вёрстки тут нет намеренно, иначе
     пришлось бы поддерживать два разных изображения одной вещи.
     Поверх картинки лежит прозрачный слой: ведём правую створку от центра
     к правому краю, как саму штору руками.

     axis = 'y' - то же самое для рулонной и римской: полотно ходит вверх,
     и жест повторяет его, а не створки, которых у неё нет. Отдельного
     пульта для этого не заводим - расходятся только ось и подписи. */
  var vert = axis === 'y';
  var i = node.getAttribute('data-i');
  // не больше плитки 4×4: на ноутбуке окно во всю ширину было плакатом
  var w = Math.min(Math.round(window.innerWidth * 0.90), 722);
  var h = Math.min(Math.round(window.innerHeight * 0.62), 560);
  var url = 'tile/' + encodeURIComponent(NAME) + '/' + i + '.svg?w=' + w + '&h=' + h + themeQ();

  var card = el('div','card'); card.textContent = '…';
  var wrap = el('div'); wrap.id = 'crtwrap';
  var view = el('div'); view.id = 'crtview';
  if(vert) view.className = 'vert';
  var mark = el('div','mark');            // куда поедет
  var read = el('div','read');            // проценты крупно
  view.appendChild(mark); view.appendChild(read);
  wrap.appendChild(card); wrap.appendChild(view);

  var title = el('div','ttl', node.getAttribute('data-title') || 'Штора');
  var hint  = el('div','hint', vert ? 'Ведите нижний край полотна вверх и вниз'
                                    : 'Ведите правую створку от центра к краю');
  var pos   = parseFloat(node.getAttribute('data-pos')||'0');
  var shown = pos;
  /* Куда привод поехал по нашей команде. Держится на экране, пока он
     едет: у медленного привода факт по дороге не меняется вовсе, и без
     этой отметки после отпускания пальца не остаётся ничего - картинка
     та же, что была, как будто команда не ушла. */
  var goal = null;

  function paint(){
    // 0 - створка у центра (закрыто), 1 - у правого края (открыто);
    // у рулонной 0 - полотно внизу, 1 - у карниза
    var at = goal === null ? shown : goal;
    var svg = card.querySelector('svg');
    var rs = svg ? svg.getBoundingClientRect() : null;
    var rv = svg ? view.getBoundingClientRect() : null;
    if(vert){
      if(rs) mark.style.top = Math.round(rs.top - rv.top
                                         + (1 - at)*rs.height) + 'px';
      else   mark.style.top = ((1 - at)*100) + '%';
    } else if(rs){
      var left = rs.left - rv.left, mid = left + rs.width/2;
      mark.style.left = Math.round(mid + at*rs.width/2) + 'px';
    } else {
      mark.style.left = (50 + at*50) + '%';
    }
    read.textContent = Math.round(at*100) + ' %';
    var show = dragging || goal !== null;
    mark.style.display = read.style.display = show ? 'block' : 'none';
    mark.classList.toggle('going', !dragging && goal !== null);
  }
  var dragging = false;

  function load(){
    fetch(url + '&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(svg){
        if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
        card.innerHTML = svg;
      })
      .catch(function(e){ card.textContent = 'Не удалось: ' + e.message; });
  }
  load();

  var row = el('div','crow');
  function button(text, cls, fn){
    var b = el('span','cbtn'+(cls?' '+cls:''), text);
    b.onclick = fn; row.appendChild(b); return b;
  }

  /* Три перечитывания в первые шесть секунд - это мерка по GM64T, который
     доезжает за пару секунд. Привод помедленнее едет минуту, и к моменту
     последнего перечитывания ещё даже не тронулся: картинка застывала на
     старом положении до закрытия пульта.

     Поэтому после команды следим за плиткой на панели: у неё есть data-pos
     и data-moving. Меняется положение - перерисовываем картинку, встал
     привод - перестаём спрашивать. Панель при этом не трогаем: она под
     оверлеем и обновится сама, когда он закроется. */
  var key = node.getAttribute('data-topic');
  var poll = null, ticks = 0, seenMoving = false;
  function stopPoll(){
    if(poll){ clearInterval(poll); poll = null; }
    // Привод встал: дальше на экране правда, а не наша цель.
    if(goal !== null){ goal = null; shown = pos; paint(); }
  }
  function watch(){
    stopPoll(); ticks = 0; seenMoving = false;
    poll = setInterval(function(){
      // Предохранитель: привод мог не ответить вовсе, и таймер не должен
      // остаться тикать до конца сессии.
      if(++ticks > 40){ stopPoll(); return; }
      var q = Q();
      fetch(NAME + '.svg' + q + (q ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'})
        .then(function(r){ return r.ok ? r.text() : null; })
        .then(function(text){
          if(!text) return;
          var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
          var g = doc.querySelector('[data-topic="' + key + '"]');
          if(!g) return;
          var p = parseFloat(g.getAttribute('data-pos') || '0');
          if(Math.abs(p - pos) > 0.004){
            pos = p;
            if(!dragging && goal === null) shown = p;
            load();
          }
          // Между командой и первым «поехал» проходит несколько секунд:
          // у приводов за мостом это круг до устройства и обратно. Пока
          // движения не видели ни разу, даём три круга на раскачку.
          if(g.getAttribute('data-moving')) seenMoving = true;
          else if(seenMoving || ticks >= 7) stopPoll();
        })
        .catch(function(){});
    }, 3000);
  }
  ovCleanup = stopPoll;

  function send(value){
    var want = parseFloat(value);
    pub(node.getAttribute('data-topic'), value)
      .then(function(){
        if(!isNaN(want)){ goal = Math.max(0, Math.min(1, want / 100)); }
        setTimeout(load, 700); setTimeout(load, 2500);
        setTimeout(refresh, 800);
        watch(); paint();
      })
      .catch(function(e){ flash('Не удалось: '+e.message); });
  }
  button(vert ? 'Опустить' : 'Закрыть', '',
         function(){ send(node.getAttribute('data-off')); });
  /* Стоп есть не у всех приводов: у HomeKit-совместимых это отдельная
     характеристика, и топик задаётся в конфиге явно. Нет топика - нет кнопки:
     рисовать неработающую хуже, чем не рисовать вовсе. */
  var stopTopic = node.getAttribute('data-stop');
  if(stopTopic){
    button('Стоп', 'stop', function(){
      pub(stopTopic, node.getAttribute('data-stop-value') || '2')
        .then(function(){
          // Где именно он встанет, мы не знаем - показывать цель больше нечестно.
          goal = null; paint();
          setTimeout(load, 700); watch();
        })
        .catch(function(e){ flash('Не удалось: '+e.message); });
    });
  }
  button(vert ? 'Поднять' : 'Открыть', '',
         function(){ send(node.getAttribute('data-on')); });

  openOv([title, wrap, row, hint]);
  if(!ov.offsetHeight){ closeOv(); window.open(url, '_blank'); return; }

  function at(ev){
    // Считаем от самого рисунка: у карточки есть поля, и если брать её
    // границы, центр окна и центр жеста разъезжаются на ширину поля.
    var box = card.querySelector('svg') || view;
    var r = box.getBoundingClientRect();
    var p = evPoint(ev);
    if(vert){
      // верх картинки = поднято настежь, низ = опущено до конца
      shown = Math.max(0, Math.min(1, 1 - (p.clientY - r.top) / r.height));
    } else {
      // центр картинки = створки сомкнуты, правый край = открыто настежь
      shown = Math.max(0, Math.min(1, (p.clientX - (r.left + r.width/2)) / (r.width/2)));
    }
    paint();
  }
  function begin(ev){ dragging = true; at(ev); }
  function done(){
    dragging = false;
    // Промежуточные значения не шлём: для привода каждое - новая цель,
    // и он дёргался бы за пальцем.
    send(Math.round(shown*100));
  }
  drag(view, at, done, begin);
}

/* Перетаскивание: pointer-события есть не везде, поэтому с запасным
   вариантом на мышь и касания. */
function drag(node, move, done, begin){
  var active = false;
  function start(e){
    active = true;
    try { if(e.pointerId != null && node.setPointerCapture) node.setPointerCapture(e.pointerId); }
    catch(_) {}
    if(begin) begin(e); else move(e);
    if(e.preventDefault) e.preventDefault();
  }
  function go(e){ if(active){ move(e); if(e.preventDefault) e.preventDefault(); } }
  function end(e){
    if(!active) return;
    active = false;
    // move() может споткнуться на кривом событии - но отправить значение
    // мы обязаны в любом случае, иначе жест пропадает впустую
    try { move(e); } catch(_) {}
    done();
  }
  /* Отмена жеста - это НЕ движение. Раньше здесь вызывался move() с событием
     pointercancel, у которого координат нет, и значение прыгало в край.
     Браузер шлёт отмену, стоит пальцу чуть сместиться по вертикали. */
  function cancel(){ if(!active) return; active = false; done(); }
  if(window.PointerEvent){
    node.addEventListener('pointerdown', start);
    node.addEventListener('pointermove', go);
    node.addEventListener('pointerup', end);
    node.addEventListener('pointercancel', cancel);
  } else {
    node.addEventListener('mousedown', start);
    document.addEventListener('mousemove', go);
    document.addEventListener('mouseup', end);
    node.addEventListener('touchstart', start);
    node.addEventListener('touchmove', go);
    node.addEventListener('touchend', end);
    node.addEventListener('touchcancel', cancel);
  }
}

/* ---------- нажатия по плиткам ---------- */
function toggle(node){
  var value = node.getAttribute('data-state')==='1'
            ? node.getAttribute('data-off') : node.getAttribute('data-on');
  // У сцены состояния нет: правило сбрасывает канал раньше, чем панель
  // перерисуется, и подтвердить нажатие обновлением не получится. Поэтому
  // подсвечиваем сами - иначе кнопка кажется мёртвой и её жмут дважды.
  var scene = node.getAttribute('data-kind') === 'scene';
  var was = node.getAttribute('data-state') === '1';
  /* Рамка переключается сразу, не дожидаясь прибора: у реле ответ
     приходит за доли секунды, а у устройств за Sprut.hub - за две-три.
     Плитка притушена, пока прибор не подтвердил; подтверждение - это
     новая картинка плитки от сервера. Не подтвердил за HOLD_MS - плитку
     заменяет то, что сервер знает на самом деле, и рамка вернётся. */
  function flip(on){
    var rims = node.querySelectorAll('.plate,.rim');
    for (var k = 0; k < rims.length; k++) rims[k].classList.toggle('on', on);
    node.setAttribute('data-state', on ? '1' : '0');
  }
  if (!scene) { flip(!was); hold(node); }
  node.classList.add('busy');
  pub(node.getAttribute('data-topic'), value).then(function(){
    if(scene){
      node.classList.remove('busy');
      node.classList.add('fired');
      setTimeout(function(){ node.classList.remove('fired'); }, 700);
    }
    // Ответ прибора принесёт ждущий запрос. Старый сервер его не умеет -
    // тогда переспрашиваем сами, как раньше.
    if (!LIVE) { setTimeout(refresh, 400); setTimeout(refresh, 1200); }
  }).catch(function(e){
    flash('Не удалось: '+e.message);
    node.classList.remove('busy');
    if (!scene) flip(was);
  });
}

/* Узлы под селектор внутри root, включая сам root. После точечной замены
   плитки обработчики вешаются только на неё, а не на всю панель заново. */
function within(root, sel){
  var out = [];
  var m = root.matches || root.webkitMatchesSelector || root.msMatchesSelector;
  if (root !== host && m && m.call(root, sel)) out.push(root);
  var found = root.querySelectorAll(sel);
  for (var i = 0; i < found.length; i++) out.push(found[i]);
  return out;
}

function bind(root){
  root = root || host;
  // Заголовки разделов работают и без interactive: сворачивание ничего
  // не включает и не выключает, это способ смотреть.
  var heads = within(root, '[data-headtap]');
  for (var hh = 0; hh < heads.length; hh++) heads[hh].onclick = showChrome;
  var navs = within(root, '[data-nav]');
  for (var nv = 0; nv < navs.length; nv++) navs[nv].onclick = navTap;
  document.documentElement.classList.toggle('svgnav', !!host.querySelector('[data-nav]'));
  var folds = within(root, '[data-section]');
  for (var f = 0; f < folds.length; f++) {
    folds[f].onclick = function(){ if (tapOk()) toggleSection(this); };
  }
  // Вид разделов узнаём по разметке после каждой замены: точечная замена
  // тоже может принести другой ряд вкладок.
  SECT_MODE = host.querySelector('[data-tab="1"]') ? 'tabs'
            : host.querySelector('[data-accordion="1"]') ? 'accordion' : 'list';
  var had = HAS_SECTIONS;
  HAS_SECTIONS = host.querySelector('[data-section]') !== null || MODE !== '';
  if (had !== HAS_SECTIONS && !colsOpen) drawCols();

  if(!INTERACTIVE) return;
  var nodes = within(root, '[data-topic],[data-expand],[data-pad],[data-href],[data-chart]');
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    // Плитка, у которой есть и полный экран, и пульт (фанкойл), не может
    // обойтись простым onclick: короткое нажатие раскрывает, долгое
    // открывает пульт. Поэтому она идёт общим путём с жестами ниже.
    if(n.getAttribute('data-expand') && !n.getAttribute('data-pad')){
      n.onclick=function(){ if(tapOk()) expand(this); }; continue; }
    // Чип строки состояния: короткое нажатие открывает график канала.
    // Долгого жеста у него нет - переключать нечего.
    if(n.getAttribute('data-chart')){
      n.onclick=function(){ if(tapOk()) chartOv(this); }; continue; }
    // короткое нажатие переключает, долгое открывает пульт
    // Короткое нажатие переключает, долгое открывает пульт.
    // Раньше случайные включения ловились из-за двух вещей: жест не
    // отменялся при сдвиге пальца (прокрутка засчитывалась как нажатие) и
    // порог был коротковат. Теперь следим за смещением и держим 600 мс.
    var down = function(e){
      var self = this, p = evPoint(e);
      // Зоны плюс/минус - прозрачные прямоугольники внутри плитки.
      // Запоминаем, по какой попали: к моменту отпускания цель может
      // смениться, если палец сдвинулся.
      var zone = e.target && e.target.getAttribute
                 ? e.target.getAttribute('data-zone') : null;
      // Касание, остановившее прокрутку, или сразу после закрытия окна -
      // не нажатие: ни короткого, ни долгого из него не выйдет.
      var t0 = Date.now();
      press = {node:self, long:false, zone:zone, x:p.clientX, y:p.clientY,
        moved:!tapOk(t0), t0:t0,
        timer:setTimeout(function(){
          if(press && !press.moved && tapOk(press.t0)){
            press.long = true; openPad(self);
          }
        }, 600)};
    };
    var moved = function(e){
      if(!press) return;
      var p = evPoint(e);
      if(Math.abs(p.clientX - press.x) > 12 || Math.abs(p.clientY - press.y) > 12){
        press.moved = true;
        clearTimeout(press.timer);
      }
    };
    var up = function(){
      if(!press) return;
      clearTimeout(press.timer);
      var href = this.getAttribute('data-href');
      // Пока палец лежал, страницу прокрутили - листали, а не нажимали.
      if(!tapOk(press.t0)) press.moved = true;
      if(!press.long && !press.moved){
        if(href) { location.href = href + Q(); }
        // Колесо телевизора на плитке: стрелки, OK, «назад», «домой».
        else if(press.zone && press.zone.indexOf('tv:') === 0) tvKey(this, press.zone.slice(3));
        else if(press.zone) stepTarget(this, press.zone);
        // Термостат: по краям плитки шаг уставки, в центре - открыть пульт.
        // Режим короткое нажатие не трогает: случайно выключить отопление
        // касанием экрана нельзя, для этого есть кнопка на пульте.
        // Раскрытие стоит раньше переключения: у фанкойла есть и топик
        // питания (его берёт пульт), но выключать прибор промахом по
        // экрану нельзя - короткое нажатие только раскрывает плитку.
        else if(this.getAttribute('data-expand')) expand(this);
        else if(this.getAttribute('data-pad') === 'thermostat') openPad(this);
        // Камера: короткое нажатие открывает поток. Долгое ждать незачем -
        // переключать у неё нечего, и держать палец шесть десятых секунды
        // ради единственного действия было бы издевательством.
        else if(this.getAttribute('data-pad') === 'camera') openPad(this);
        // Телевизор: нажатие открывает пульт и ничего не переключает.
        // Случайное касание не должно выключать телевизор посреди фильма,
        // поэтому питание живёт только внутри пульта.
        else if(this.getAttribute('data-pad') === 'tv') openPad(this);
        // Список: нажатие открывает окно, на самой плитке отмечать нечего -
        // строка там в полтора десятка пикселей, промахнуться легко.
        else if(this.getAttribute('data-pad') === 'list') openPad(this);
        // Вода: протечка ничего не переключает, кран - тем более коротким
        // нажатием. Оба открывают окно; перекрыть воду - кнопкой в нём.
        else if(this.getAttribute('data-pad') === 'leak') openPad(this);
        else if(this.getAttribute('data-pad') === 'valve') openPad(this);
        // Расписание: смотреть, а не переключать - сразу окно.
        else if(this.getAttribute('data-pad') === 'agenda') openPad(this);
        else if(this.getAttribute('data-pad') === 'today') openPad(this);
        else if(this.getAttribute('data-topic')) toggle(this);
      }
      press = null;
    };
    var cancel = function(){ if(press){ clearTimeout(press.timer); press=null; } };
    if(window.PointerEvent){
      n.onpointerdown = down; n.onpointermove = moved;
      n.onpointerup = up; n.onpointercancel = cancel;
    } else {
      n.onmousedown = down; n.onmousemove = moved;
      n.onmouseup = up; n.onmouseleave = cancel;
      n.ontouchstart = down; n.ontouchmove = moved;
      n.ontouchend = up; n.ontouchcancel = cancel;
    }
    // долгое нажатие не должно выделять текст и звать меню браузера
    n.oncontextmenu = function(e){ if(e.preventDefault) e.preventDefault(); return false; };
  }
}
/* Шаг уставки. Значения считает сервер и кладёт в data-up и data-down:
   браузер не должен знать ни шага привода, ни его пределов. После записи
   ждём подтверждения от прибора - следующий шаг возьмётся уже из него. */
function stepTarget(node, zone){
  var value = node.getAttribute(zone === 'up' ? 'data-up' : 'data-down');
  if(value === null) return;
  node.classList.add('busy');
  pub(node.getAttribute('data-topic'), value)
    .then(function(){ setTimeout(refresh, 500); setTimeout(refresh, 2000); })
    .catch(function(e){ flash('Не удалось: ' + e.message); })
    .then(function(){ node.classList.remove('busy'); });
}

/* Переключение режима: греет или выключен.
   Отдельной функцией, потому что зовётся из двух мест - с плитки коротким
   нажатием по центру и с пульта кнопкой. */
function toggleMode(node, after){
  var topic = node.getAttribute('data-mode-topic');
  if(!topic){ flash('Режим не настроен: нет command_topic_mode'); return; }
  var on = node.getAttribute('data-enabled') === '1';
  var value = node.getAttribute(on ? 'data-mode-off' : 'data-mode-on');
  node.setAttribute('data-enabled', on ? '0' : '1');
  pub(topic, value)
    .then(function(){
      setTimeout(function(){ refresh(true); }, 500);
      if(after) setTimeout(after, 700);
    })
    .catch(function(e){
      node.setAttribute('data-enabled', on ? '1' : '0');
      flash('Не удалось: ' + e.message);
    });
}

/* Пульт термостата.
   Повторяет плитку: та же дуга, две риски, число в центре, режим снизу.
   Рисуется здесь, а не запрашивается картинкой у сервера, - дуга должна
   отзываться на палец сразу, без похода по сети.

   Заливка идёт ОТ риски текущей температуры ДО уставки: это ровно тот
   разрыв, который прибору предстоит закрыть. Вверх - оранжевая, вниз -
   синяя: одинаковая дуга не должна означать разные вещи. */
function padThermostat(node){
  var lo = parseFloat(node.getAttribute('data-scale-min') || '14');
  var hi = parseFloat(node.getAttribute('data-scale-max') || '30');
  var step = parseFloat(node.getAttribute('data-step') || '0.5');
  var tlo = parseFloat(node.getAttribute('data-min') || '10');
  var thi = parseFloat(node.getAttribute('data-max') || '38');
  var digits = (step % 1 === 0) ? 0 : 1;
  var value = parseFloat(node.getAttribute('data-target') || '20');
  var current = parseFloat(node.getAttribute('data-current') || 'NaN');
  var live = node.getAttribute('data-live') === '1';
  var timer = null, dragging = false, PAL = ovPal();

  var S = Math.min(window.innerWidth - 40, Math.round(window.innerHeight * 0.62), 460);
  var wrap = el('div'); wrap.id = 'tdial';
  wrap.style.width = S + 'px'; wrap.style.height = S + 'px';

  var START = parseFloat(node.getAttribute('data-dial-start') || '148');
  var SWEEP = parseFloat(node.getAttribute('data-dial-sweep') || '244');
  /* С 1.17 пульт рисует ту же ручку, что плитка (wbpanel/skeuo.py): дорожка
     от начала шкалы до уставки, шкала с делениями снаружи, зубчатая ручка
     с цифрой в центре. Центр - там же, где его ждёт жест (55 % высоты). */
  var CX = S / 2, CY = S * 0.55, RA = S * 0.33, RK = RA - S * 0.093;
  var TW = Math.max(6, S * 0.025), LAB = Math.max(11, S * 0.034);
  var NS = 'http://www.w3.org/2000/svg';
  function pt(deg, radius){
    var a = deg * Math.PI / 180;
    return [CX + radius * Math.cos(a), CY + radius * Math.sin(a)];
  }
  function arc(fromDeg, toDeg, radius){
    if(Math.abs(toDeg - fromDeg) < 0.3) return '';
    var a = pt(fromDeg, radius), b = pt(toDeg, radius);
    var large = Math.abs(toDeg - fromDeg) > 180 ? 1 : 0;
    return 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + 'A' + radius + ' ' + radius + ' 0 ' + large + ' 1 ' +
           b[0].toFixed(1) + ' ' + b[1].toFixed(1);
  }
  function degOf(v){
    var f = (v - lo) / (hi - lo);
    return START + Math.max(0, Math.min(1, f)) * SWEEP;
  }
  function mk(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svgEl).appendChild(e); return e;
  }
  var svgEl = document.createElementNS(NS, 'svg');
  svgEl.setAttribute('viewBox', '0 0 ' + S + ' ' + S);
  svgEl.setAttribute('width', S); svgEl.setAttribute('height', S);
  wrap.appendChild(svgEl);
  var FM = FORM();
  mk('defs', {}).innerHTML = knobDefs('td', FM, PAL.lt);
  // шкала: деления через градус, подписи через четыре
  var t0 = Math.ceil(lo), every = (Math.floor(hi) - t0) <= 40 ? 4 : 8;
  for(var v = t0; v <= Math.floor(hi); v++){
    var major = (v - t0) % every === 0, a = degOf(v);
    var p1 = pt(a, RA + S * 0.025), p2 = pt(a, RA + S * (major ? 0.057 : 0.043));
    mk('line', {x1: p1[0].toFixed(1), y1: p1[1].toFixed(1), x2: p2[0].toFixed(1), y2: p2[1].toFixed(1),
                stroke: PAL.ink, 'stroke-opacity': major ? .8 : .4, 'stroke-width': major ? 2 : 1.2, 'stroke-linecap': 'round'});
    if(major){
      var lp = pt(a, RA + S * 0.096 + LAB * 0.2);
      var tl = mk('text', {x: lp[0].toFixed(1), y: (lp[1] + LAB * 0.36).toFixed(1), 'text-anchor': 'middle',
                           fill: PAL.dim, 'font-size': LAB, 'font-weight': 600});
      tl.textContent = v;
    }
  }
  var pBg = mk('path', {fill: 'none', stroke: PAL.track, 'stroke-width': TW, 'stroke-linecap': 'round',
                        d: arc(START, START + SWEEP, RA)});
  var pArc = mk('path', {fill: 'none', 'stroke-width': TW, 'stroke-linecap': 'round'});
  var lCurH = mk('line', {stroke: PAL.halo, 'stroke-width': Math.max(6, S * 0.025), 'stroke-linecap': 'round'});
  var lCur = mk('line', {stroke: PAL.ink, 'stroke-width': Math.max(3, S * 0.0114), 'stroke-linecap': 'round'});
  // ручка в форме темы: тени, край, фаска (с 1.35)
  mk('g', {}).innerHTML = knobSVG('td', CX, CY, RK, Math.max(0.8, 0.8 * S / 280), PAL.face, PAL.faceEdge, FM, S * 0.018);
  var lPtr = mk('line', {'stroke-width': Math.max(3, S * 0.013), 'stroke-linecap': 'round'});
  var cKnob = mk('circle', {r: Math.max(6, S * 0.023), stroke: PAL.knobEdge, 'stroke-width': Math.max(2, S * 0.007)});
  var tBig = mk('text', {'text-anchor': 'middle', 'class': 'tbig'});
  var tSub = mk('text', {'text-anchor': 'middle', 'class': 'tsub'});
  var tMode = mk('text', {'text-anchor': 'middle', 'class': 'tmode'});

  function line(e, v, inner, outer){
    var a = pt(degOf(v), inner), b = pt(degOf(v), outer);
    e.setAttribute('x1', a[0].toFixed(1)); e.setAttribute('y1', a[1].toFixed(1));
    e.setAttribute('x2', b[0].toFixed(1)); e.setAttribute('y2', b[1].toFixed(1));
  }
  function paint(){
    // греет - оранжевая, включён и не греет - синяя, выключен - серая
    var enabled = node.getAttribute('data-enabled') !== '0';
    var color = !enabled ? PAL.off : (live ? PAL.heat : PAL.cool);
    var to = degOf(value);
    pArc.setAttribute('d', arc(START, to, RA));
    pArc.setAttribute('stroke', color);
    if(!isNaN(current)){
      line(lCurH, current, RA - S * 0.025, RA + S * 0.061);
      line(lCur, current, RA - S * 0.025, RA + S * 0.061);
      lCur.style.display = lCurH.style.display = '';
    } else lCur.style.display = lCurH.style.display = 'none';
    line(lPtr, value, RK - S * 0.043, RK - S * 0.011);
    lPtr.setAttribute('stroke', color);
    var k = pt(to, RA);
    cKnob.setAttribute('cx', k[0].toFixed(1)); cKnob.setAttribute('cy', k[1].toFixed(1));
    cKnob.setAttribute('fill', enabled ? PAL.knob : PAL.offKnob);

    tBig.setAttribute('x', CX); tBig.setAttribute('y', CY + S * 0.035);
    tBig.textContent = value.toFixed(digits) + '°';
    tBig.setAttribute('opacity', enabled ? 1 : .55);
    tSub.setAttribute('x', CX); tSub.setAttribute('y', CY + S * 0.095);
    tSub.textContent = isNaN(current) ? '' : ('сейчас ' + current.toFixed(1) + '°');
    tMode.setAttribute('x', CX); tMode.setAttribute('y', S - S * 0.03);
    tMode.textContent = node.getAttribute('data-status') || '';
    tMode.style.fill = enabled ? color : PAL.dim;
  }
  /* Отправляем последнее значение, а не каждое движение пальца: головка
     иначе выстроит десяток команд в очередь. */
  function send(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      // Пока сценарий переваривает команду, серверная уставка ещё старая.
      // Держим свою цифру три секунды, дальше верим прибору.
      quietUntil = Date.now() + 3000;
      pub(node.getAttribute('data-topic'), value.toFixed(digits))
        .then(function(){ node.setAttribute('data-target', value.toFixed(digits));
                          setTimeout(function(){ refresh(true); }, 400);
                          setTimeout(function(){ refresh(true); sync(); }, 1500); })
        .catch(function(e){ flash('Не удалось: ' + e.message); });
    }, 350);
  }
  function shift(delta){
    value = Math.max(tlo, Math.min(thi, value + delta));
    paint(); send();
  }

  /* С 1.23: шапка как у кондиционера - «назад», название, питание (если
     задан канал режима); − и + у концов шкалы вместо ряда кнопок. */
  var power = null;
  if(node.getAttribute('data-mode-topic')){
    power = hbtn('hpw' + (node.getAttribute('data-enabled') === '1' ? ' on' : ''), hsvg(HICON.power), function(){
      toggleMode(node, function(){
        // Дальше состояние подтянет sync(): режим меняет прибор, и его
        // ответ может прийти позже нашего предположения.
        power.classList.toggle('on', node.getAttribute('data-enabled') === '1');
        paint();
      });
    });
  }
  var head = padHead(node.getAttribute('data-title') || 'Термостат', power);
  var box = el('div', 'stagebox');
  box.style.width = S + 'px'; box.style.height = S + 'px';
  box.appendChild(wrap);
  function corner(deg, text){
    var p = pt(deg, RA + S * 0.02);
    var b = hbtn('at', '', null); b.textContent = text;
    // чуть внутрь от конца дуги: снаружи там подписи 14 и 30
    var dx = (deg === START ? 1 : -1) * S * 0.055;
    b.style.left = (p[0] + dx).toFixed(1) + 'px'; b.style.top = (p[1] + S * 0.08).toFixed(1) + 'px';
    box.appendChild(b); return b;
  }
  var tMinus = corner(START, '−'), tPlus = corner(START + SWEEP, '+');
  stepKeys(tMinus, tPlus, {
    min: tlo, max: thi, step: step, delay: 350,
    read:  function(){ return value; },
    write: function(v){ value = Math.round(v / step) * step; quietUntil = Date.now() + 3000; },
    send:  function(){ send(); },
    paint: function(){ paint(); }
  });

  /* refresh() заменяет разметку панели целиком, и ссылка на плитку
     становится битой: обновления состояния до пульта не доходят вовсе.
     Поэтому после каждой перерисовки ищем плитку заново по её номеру и
     перечитываем то, что мог поменять сам прибор или сценарий. */
  var idx = node.getAttribute('data-i');
  var quietUntil = 0;
  function sync(){
    var fresh = host.querySelector('[data-pad="thermostat"][data-i="' + idx + '"]');
    if(!fresh) return;
    node = fresh;
    var c = parseFloat(node.getAttribute('data-current') || 'NaN');
    if(!isNaN(c)) current = c;
    live = node.getAttribute('data-live') === '1';
    // Уставку с сервера подхватываем, только если сами недавно не писали:
    // сценарий отвечает не мгновенно, и своё же значение перетёрло бы
    // цифру обратно на старую.
    if(Date.now() > quietUntil && !dragging){
      var t = parseFloat(node.getAttribute('data-target') || 'NaN');
      if(!isNaN(t)) value = t;
    }
    if(power) power.classList.toggle('on', node.getAttribute('data-enabled') === '1');
    paint();
  }
  var ticker = setInterval(function(){
    // Панель под окном обновляет ждущий запрос, и прибор оттуда виден
    // сразу. Со старым сервером просим свежую картинку сами.
    if (!LIVE) refresh(true);
    sync();
  }, 1200);

  paint();
  openOv([head, box]);
  ovCleanup = function(){ clearInterval(ticker); };

  function at(ev){
    var r = wrap.getBoundingClientRect();
    var p = evPoint(ev);
    var cx = r.left + r.width * 0.5, cy = r.top + r.height * 0.55;
    var deg = Math.atan2(p.clientY - cy, p.clientX - cx) * 180 / Math.PI;
    var rel = deg - START;
    while(rel < 0) rel += 360;
    while(rel > 360) rel -= 360;
    if(rel > SWEEP){
      // Палец в нижнем разрыве дуги: прижимаем к ближнему концу, иначе
      // уставка прыгает с максимума на минимум.
      rel = (rel - SWEEP < 360 - rel) ? SWEEP : 0;
    }
    var raw = lo + (hi - lo) * (rel / SWEEP);
    value = Math.max(tlo, Math.min(thi, Math.round(raw / step) * step));
    paint();
  }
  function begin(ev){ dragging = true; at(ev); }
  function done(){ dragging = false; send(); }
  drag(wrap, at, done, begin);
}

/* ---------- камера ----------
   Поток MJPEG живёт в обычном <img>: браузер сам разбирает multipart и
   перерисовывает кадр за кадром. Никакого проигрывателя не нужно.

   Две тонкости, из-за которых тут больше кода, чем ожидаешь.

   Первая: сервер закрывает соединение через data-cam-life миллисекунд -
   иначе забытое окно держит поток waitress до тайм-аута TCP. Когда
   соединение закрылось, <img> не сообщает об этом ничем: он просто
   застывает на последнем кадре. Поэтому переподключаемся по таймеру
   сами, чуть раньше срока.

   Вторая: поток может не пойти вовсе - MJPEG выключен на камере,
   слотов не осталось, прошивка отвечает иначе. Тогда переходим на
   снимки: то же окно, та же картинка, просто дёргается. Показать
   человеку живой кадр важнее, чем настоять на способе. */
function padCamera(node){
  var stream = node.getAttribute('data-cam-live') === '1'
             ? node.getAttribute('data-cam') : '';
  var poll   = node.getAttribute('data-cam-poll');
  var life   = parseInt(node.getAttribute('data-cam-life') || '0', 10);
  var title  = (node.getAttribute('data-title') || '').replace(/\n/g, ' ');

  var card = el('div','card camwrap');
  var img  = document.createElement('img');
  img.className = 'cam';
  img.alt = '';
  card.appendChild(img);
  var ttl  = el('div','ttl', title);

  var alive = true, polling = false, timer = null, revive = null;

  function shot(){
    if(!alive) return;
    /* live=1 просит сервер не кешировать: на плитке кадр держится
       десять секунд намеренно, а здесь нужен свежий. */
    img.src = poll + '?live=1&t=' + Date.now();
  }
  function toPolling(){
    if(polling || !alive) return;
    polling = true;
    if(revive){ clearTimeout(revive); revive = null; }
    shot();
    timer = setInterval(shot, 700);
  }
  function connect(){
    if(!alive) return;
    img.src = stream + '?t=' + Date.now();
    if(life > 2000){
      revive = setTimeout(connect, life - 1500);
    }
  }

  /* Ошибка загрузки означает разное: у потока - что он не пошёл, у
     снимка - что камера прямо сейчас не ответила. В первом случае
     переключаемся, во втором просто ждём следующего кадра. */
  img.onerror = function(){
    if(!polling) toPolling();
  };

  openOv([ttl, card]);
  if(!ov.offsetHeight){ closeOv(); window.open(poll, '_blank'); return; }

  /* Пока панель обновляется в фоне, кадр камеры тянуть незачем: он и
     так перед глазами. Останавливаем на время просмотра. */
  ovCleanup = function(){
    alive = false;
    if(timer) clearInterval(timer);
    if(revive) clearTimeout(revive);
    /* Пустой src обрывает соединение с сервером немедленно. Без этого
       браузер держит его открытым ещё какое-то время, а на той стороне
       занят поток. */
    img.onerror = null;
    img.src = '';
  };

  if(stream) connect(); else toPolling();
}

/* ---------- пульт телевизора ---------- */
/* Кнопки не знают ни про Samsung, ни про коды клавиш: всё это живёт в
   мосте wb-tv. Пульт публикует единицу в контрол и на этом заканчивает
   свою работу - потому же он одинаково подойдёт телевизору другой марки.

   Значки рисуются встроенным SVG, а не символами юникода: «⏻» и эмодзи
   приглушения есть не во всех шрифтах, и на ноутбуке кнопка оказывалась
   пустой. */
var TVI = {
  power: '<path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>',
  up:    '<path d="M6 15l6-6 6 6"/>',
  down:  '<path d="M6 9l6 6 6-6"/>',
  left:  '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  /* Плей и пауза на одном значке: кнопка одна, и по ней должно быть
     видно, что она делает и то, и другое. Рисуется заливкой, поэтому
     полоски паузы - прямоугольники, а не линии: класс fill снимает
     обводку у всего значка разом. */
  playpause: '<path d="M3 5l8.5 7-8.5 7z"/>'
           + '<path d="M14.5 5h2.5v14h-2.5z"/><path d="M19.5 5h2.5v14h-2.5z"/>',
  rew:   '<path d="M11 6l-7 6 7 6z"/><path d="M20 6l-7 6 7 6z"/>',
  fwd:   '<path d="M13 6l7 6-7 6z"/><path d="M4 6l7 6-7 6z"/>',
  mute:  '<path d="M11 5L7 9H4v6h3l4 4z"/><path d="M16 9l5 6M21 9l-5 6"/>',
  input: '<path d="M4 6h16v10H4z"/><path d="M9 20h6"/>'
};

/* ---------- пульт телевизора (с 1.21) ----------
   Раскладка как у настоящего пульта (макет 15.10): сверху «назад», имя,
   вход и питание; колесо со стрелками и OK; «Назад» и «Меню» у нижних
   углов колеса; перемотка; громкость кнопками − / +, между ними без
   звука; приложения внизу. Карточка тёмная, в светлых темах светлая (1.22) - как пульт в
   руке. Стрелки и громкость при удержании повторяют нажатие. Прежний
   светлый пульт - look: classic. */
var TVX = {
  back: '<path d="M9 7L5 11l4 4"/><path d="M5 11h9a5 5 0 0 1 0 10h-3"/>',
  menu: '<path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/>',
  chev: '<path d="M15 5l-7 7 7 7"/>'
};
function tvGear(cx, cy, r, k){
  var tw = 7 * k, tth = 6 * k, n = Math.max(18, Math.round(2 * Math.PI * r / (16 * k)));
  var hw = tw / 2 / r, pts = [];
  function p(rad, a){ pts.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1)); }
  for(var i = 0; i < n; i++){
    var a0 = 2 * Math.PI * i / n;
    p(r, a0 - hw);
    for(var f = 0; f < 9; f++){
      var ff = Math.PI * f / 8, x = -tw / 2 * Math.cos(ff);
      var rad = (r - tth + tw / 2) - (tw / 2) * Math.sin(ff);
      p(rad, a0 + x / rad);
    }
    p(r, a0 + hw); p(r, a0 + Math.PI / n);
  }
  return 'M ' + pts.join(' L ') + ' Z';
}
function padTV(node){
  if(node.getAttribute('data-look') === 'classic') return padTVFlat(node);
  var base = node.getAttribute('data-tv-base');
  if(!base) return;
  var link = node.getAttribute('data-tv-link') === '1';
  var on = node.getAttribute('data-tv-on') === '1';
  var dimmed = [], PAL = ovPal(), FM = FORM();

  function press(control){
    pub(base + control + '/on', 1)
      .catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  function pressPower(){
    var want = on ? 0 : 1;
    pub(base + 'power/on', want).then(function(){
      on = !on; pw.classList.toggle('on', on);
      sub.textContent = on ? 'Включается…' : 'Выключается…';
      setTimeout(refresh, 800); setTimeout(refresh, 3000);
    }).catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  /* Нажатие с повтором: первое сразу, при удержании - через 450 мс и
     дальше каждые 160 мс. Для стрелок и громкости; OK, «Назад» и
     приложения не повторяются - дважды выбранное не отменить. */
  function hold(elm, fire, repeat){
    var t1 = null, t2 = null;
    function stop(){ clearTimeout(t1); clearInterval(t2); t1 = t2 = null; elm.classList.remove('down'); }
    function start(e){
      if(e && e.preventDefault) e.preventDefault();
      stop(); elm.classList.add('down'); fire(e);
      var again = typeof repeat === 'function' ? repeat() : repeat;
      if(again) t1 = setTimeout(function(){ t2 = setInterval(function(){ fire(e, true); }, 160); }, 450);
    }
    if(window.PointerEvent){
      elm.addEventListener('pointerdown', start);
      ['pointerup','pointercancel','pointerleave'].forEach(function(n){ elm.addEventListener(n, stop); });
    } else {
      elm.addEventListener('touchstart', start); elm.addEventListener('mousedown', start);
      ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(n){ elm.addEventListener(n, stop); });
    }
    return elm;
  }
  function svgIcon(path, fill){
    return '<svg viewBox="0 0 24 24" class="' + (fill ? 'fl' : '') + '">' + path + '</svg>';
  }
  function key(cls, control, icon, opts){
    opts = opts || {};
    var b = el('div', 'tx ' + cls);
    if(icon) b.innerHTML = icon;
    if(control === 'power') b.onclick = pressPower;
    else hold(b, function(){ press(control); }, opts.repeat);
    if(opts.needs !== false) dimmed.push(b);
    return b;
  }
  function labeled(b, text){
    var w = el('div', 'txl'); w.appendChild(b); w.appendChild(el('div', 'txlab', text)); return w;
  }
  function setLive(live){
    link = live;
    for(var k = 0; k < dimmed.length; k++) dimmed[k].classList.toggle('tvdim', !live);
  }

  var card = el('div', 'card tvx');

  /* шапка */
  var head = el('div', 'txhead');
  var close = el('div', 'tx sm', ''); close.innerHTML = svgIcon(TVX.chev);
  close.onclick = function(){ closeOv(); };
  head.appendChild(close);
  var name = el('div', 'txname');
  name.appendChild(el('div', 'txttl', node.getAttribute('data-tv-title') || 'Телевизор'));
  var app = node.getAttribute('data-tv-app') || '';
  var sub = el('div', 'txsub', (node.getAttribute('data-tv-state') || '') + (app ? ' · ' + app : '')
                               + (link ? '' : ' · доступно только включение'));
  name.appendChild(sub);
  head.appendChild(name);
  head.appendChild(key('sm', 'source', svgIcon(TVI.input)));
  var pw = key('sm txpw' + (on ? ' on' : ''), 'power', svgIcon(TVI.power), {needs: false});
  head.appendChild(pw);
  card.appendChild(head);

  /* колесо: стрелки по сторонам, OK в центре. Что нажато, решает точка
     касания: ближе к центру - OK, дальше - стрелка той четверти. */
  var R = 116, C = 130, OK = 44;
  var wb = el('div', 'txwheel');
  var arr = '', dirs = [['up', -90], ['right', 0], ['down', 90], ['left', 180]];
  dirs.forEach(function(d){
    var a = d[1] * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;
    var dd = R * 0.70, sz = 13;
    var tip = [C + ux * (dd + sz * .65), C + uy * (dd + sz * .65)];
    var b1 = [C + ux * (dd - sz * .5) + vx * sz, C + uy * (dd - sz * .5) + vy * sz];
    var b2 = [C + ux * (dd - sz * .5) - vx * sz, C + uy * (dd - sz * .5) - vy * sz];
    arr += '<path class="ar" data-k="' + d[0] + '" d="M' + tip.join(',') + ' L' + b1.join(',') + ' L' + b2.join(',') + ' Z"/>';
  });
  wb.innerHTML = '<svg viewBox="0 0 260 260" width="260" height="260">'
    + '<defs><radialGradient id="txface" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="' + PAL.wheelA + '"/>'
    + '<stop offset="1" stop-color="' + PAL.wheelB + '"/></radialGradient>' + knobDefs('tw', FM, PAL.lt)
    + '<radialGradient id="txsh"><stop offset=".72" stop-color="#000" stop-opacity="' + (PAL.lt ? .2 : .5) + '"/>'
    + '<stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>'
    + '<radialGradient id="txok" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="' + PAL.acc2 + '"/>'
    + '<stop offset="1" stop-color="' + PAL.acc + '"/></radialGradient></defs>'
    + knobSVG('tw', C, C, R, 1.25, 'url(#txface)', PAL.wheelEdge, FM, 4)
    + arr
    + '<circle cx="' + C + '" cy="' + (C + 2) + '" r="' + (OK * 1.2) + '" fill="url(#txsh)"/>'
    + '<circle class="okb" data-k="ok" cx="' + C + '" cy="' + C + '" r="' + OK + '" fill="url(#txok)"/>'
    + '<text x="' + C + '" y="' + (C + 8) + '" text-anchor="middle" class="okt">OK</text></svg>';
  var wsvg = wb.firstChild;
  dimmed.push(wsvg);
  function which(e){
    var pt = evPoint(e), r = wsvg.getBoundingClientRect();
    var x = (pt.clientX - r.left) * 260 / r.width - C, y = (pt.clientY - r.top) * 260 / r.height - C;
    var d = Math.sqrt(x * x + y * y);
    if(d <= OK + 4) return 'ok';
    if(d > R + 6) return null;
    var a = Math.atan2(y, x) * 180 / Math.PI;
    return a >= -135 && a < -45 ? 'up' : a >= -45 && a < 45 ? 'right' : a >= 45 && a < 135 ? 'down' : 'left';
  }
  var cur = null;
  hold(wsvg, function(e, again){
    if(!again) cur = which(e);
    if(!cur) return;
    var n = wsvg.querySelector('[data-k="' + cur + '"]');
    if(n){ n.classList.add('hit'); setTimeout(function(){ n.classList.remove('hit'); }, 140); }
    press(cur);
  }, function(){ return cur && cur !== 'ok'; });   // OK удержанием не повторяется
  var wrapW = el('div', 'txwrap');
  wrapW.appendChild(wb);
  var lb = labeled(key('', 'back', svgIcon(TVX.back)), 'Назад'); lb.className += ' l';
  var rb = labeled(key('', 'home', svgIcon(TVX.menu, true)), 'Меню'); rb.className += ' r';
  wrapW.appendChild(lb); wrapW.appendChild(rb);
  card.appendChild(wrapW);

  /* перемотка и плей-пауза */
  var media = el('div', 'txrow');
  media.appendChild(key('', 'rewind', svgIcon(TVI.rew, true)));
  media.appendChild(key('', 'play_pause', svgIcon(TVI.playpause, true)));
  media.appendChild(key('', 'forward', svgIcon(TVI.fwd, true)));
  card.appendChild(media);

  /* громкость: мы не знаем, сколько сейчас, поэтому только шаги */
  var vol = el('div', 'txvol');
  var vd = el('div', 'txv'); vd.innerHTML = '<b>−</b><span>тише</span>';
  var vu = el('div', 'txv'); vu.innerHTML = '<b>+</b><span>громче</span>';
  hold(vd, function(){ press('vol_down'); }, true);
  hold(vu, function(){ press('vol_up'); }, true);
  dimmed.push(vd); dimmed.push(vu);
  vol.appendChild(vd); vol.appendChild(key('sm', 'mute', svgIcon(TVI.mute))); vol.appendChild(vu);
  card.appendChild(vol);

  /* приложения */
  var appsRaw = node.getAttribute('data-tv-apps') || '';
  if(appsRaw){
    var grid = el('div', 'txapps');
    appsRaw.split(';').forEach(function(item){
      var parts = item.split('|');
      if(!parts[0]) return;
      var title = parts[1] || parts[0];
      var b = el('div', 'txapp' + (title === app ? ' now' : ''), title);
      b.onclick = (function(c, nd){ return function(){
        press(c);
        var all = grid.querySelectorAll('.txapp');
        for(var k = 0; k < all.length; k++) all[k].classList.remove('now');
        nd.classList.add('now');
      }; })(parts[0], b);
      dimmed.push(b);
      grid.appendChild(b);
    });
    card.appendChild(grid);
  }
  setLive(link);

  function sync(){
    var q = Q();
    fetch(NAME + '.svg' + q + (q ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(text){
        if(!text) return;
        var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
        var g = doc.querySelector('[data-tv-base="' + base + '"]');
        if(!g) return;
        on = g.getAttribute('data-tv-on') === '1';
        pw.classList.toggle('on', on);
        var st = g.getAttribute('data-tv-state') || '';
        var now = g.getAttribute('data-tv-app') || '';
        var live = g.getAttribute('data-tv-link') === '1';
        sub.textContent = st + (now ? ' · ' + now : '') + (live ? '' : ' · доступно только включение');
        if(live !== link) setLive(live);
        var chips = card.querySelectorAll('.txapp');
        for(var i = 0; i < chips.length; i++) chips[i].classList.toggle('now', chips[i].textContent === now);
      })
      .catch(function(){});
  }
  var timer = setInterval(sync, 2000);
  ovCleanup = function(){ clearInterval(timer); };
  openOv([card]);
}

/* Кнопка колеса на плитке (зона tv:<клавиша>): нажатие уходит прямо в
   мост, пульт не открывается. Нажатое на миг гаснет - иначе непонятно,
   дошло ли касание до плитки. */
function tvKey(node, control){
  var base = node.getAttribute('data-tv-base');
  if(!base) return;
  var parts = node.querySelectorAll('[data-k="' + control + '"]');
  for(var i = 0; i < parts.length; i++) parts[i].style.opacity = '.45';
  setTimeout(function(){ for(var i = 0; i < parts.length; i++) parts[i].style.opacity = ''; }, 180);
  pub(base + control + '/on', 1).catch(function(e){ flash('Не удалось: ' + e.message); });
}

function padTVFlat(node){
  var base = node.getAttribute('data-tv-base');
  if(!base) return;
  var link = node.getAttribute('data-tv-link') === '1';
  var on = node.getAttribute('data-tv-on') === '1';

  function press(control){
    pub(base + control + '/on', 1)
      .catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  /* Питание - переключатель, а не кнопка: единица означает «включить», и
     нажатие на включённом телевизоре не выключало его, а подтверждало
     текущее состояние. Шлём противоположное значение и запоминаем его,
     чтобы второе нажатие подряд сработало до обновления панели. */
  function pressPower(){
    var want = on ? 0 : 1;
    pub(base + 'power/on', want).then(function(){
      on = !on;
      sub.textContent = on ? 'Включается…' : 'Выключается…';
      setTimeout(refresh, 800); setTimeout(refresh, 3000);
    }).catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  /* Кнопка. icon - ключ из TVI, иначе показывается текст.

     Нажатие вешается всегда, даже когда канал управления недоступен.
     Раньше такие кнопки были мертвы намертво, и это било дважды: пока
     телевизор просыпается, пульт бесполезен, а состояние «ожил» до него
     не доходило вовсе - sync обновлял подпись и подсветку приложений, но
     обработчики оставались неприклеенными до конца сессии. Нажал питание,
     дождался включения - и пульт всё равно не работает.

     Теперь недоступность только показывается бледным, а решает
     telegram-мост: не дошло так не дошло, второе нажатие ничего не
     испортит. needs === false у питания: оно идёт через Wake-on-LAN и в
     канале управления не нуждается, поэтому не гаснет никогда. */
  var dimmed = [];
  function btn(cls, label, control, icon, needs){
    var b = el('div', cls);
    if(icon) b.innerHTML = '<svg viewBox="0 0 24 24">' + TVI[icon] + '</svg>';
    else b.textContent = label;
    b.onclick = control === 'power'
              ? pressPower
              : function(){ press(control); };
    if(needs !== false) dimmed.push(b);
    return b;
  }
  function setLive(live){
    link = live;
    for(var k = 0; k < dimmed.length; k++){
      dimmed[k].classList.toggle('tvdim', !live);
    }
  }
  function row(items){
    var r = el('div','tvrow');
    items.forEach(function(n){ r.appendChild(n); });
    return r;
  }
  function hole(){ return el('div','tvc hole'); }

  var card = el('div','card tvcard');

  /* шапка: название, состояние, вход и питание */
  var head = el('div','tvhead');
  var name = el('div','tvname');
  name.appendChild(el('div','tvttl', node.getAttribute('data-tv-title') || 'Телевизор'));
  var app = node.getAttribute('data-tv-app') || '';
  var sub = el('div','tvsub',
      (node.getAttribute('data-tv-state') || '')
      + (app ? ' · ' + app : '')
      + (link ? '' : ' · доступно только включение'));
  name.appendChild(sub);
  head.appendChild(name);
  head.appendChild(btn('tvc', 'Вход', 'source', 'input'));
  head.appendChild(btn('tvc pw', '', 'power', 'power', false));
  card.appendChild(head);

  /* приложения: по три в ряд, активное подсвечено по current_app */
  var appsRaw = node.getAttribute('data-tv-apps') || '';
  if(appsRaw){
    var grid = el('div','tvapps');
    appsRaw.split(';').forEach(function(item){
      var parts = item.split('|');
      if(!parts[0]) return;
      var title = parts[1] || parts[0];
      var b = el('div','tvapp' + (title === app ? ' now' : ''), title);
      b.onclick = (function(c, node){ return function(){
        press(c);
        /* Подсвечиваем нажатое сразу, не дожидаясь ответа. Мост
           переспрашивает телевизор на ближайшем круге опроса, и через
           пару секунд sync() либо подтвердит, либо снимет подсветку -
           если приложение почему-то не запустилось. */
        var all = grid.querySelectorAll('.tvapp');
        for(var k = 0; k < all.length; k++) all[k].classList.remove('now');
        node.classList.add('now');
      }; })(parts[0], b);
      dimmed.push(b);
      grid.appendChild(b);
    });
    card.appendChild(grid);
  }

  /* крестовина: OK крупнее стрелок, «Назад» и «Меню» у нижних углов */
  card.appendChild(row([hole(), btn('tvc','','up','up'), hole()]));
  card.appendChild(row([btn('tvc','','left','left'),
                        btn('tvc big ok','OK','ok'),
                        btn('tvc','','right','right')]));
  card.appendChild(row([btn('tvc','Назад','back'),
                        btn('tvc','','down','down'),
                        btn('tvc','Меню','home')]));

  /* медиа: перемотка в обе стороны, посередине плей-пауза одной кнопкой.
     Две кнопки тут были от бедности: у Samsung есть KEY_PLAY_BACK, она
     переключает воспроизведение сама, и на пульте от телевизора она
     тоже одна. Какую именно кнопку слать, решает конфиг моста - панель
     по-прежнему публикует единицу в контрол play_pause и ничего не знает
     про коды клавиш. */
  card.appendChild(row([btn('tvc','','rewind','rew'),
                        btn('tvc fill','','play_pause','playpause'),
                        btn('tvc','','forward','fwd')]));

  /* громкость: широкая пара, приглушение между */
  var vd = el('div','tvvol','VOL −'), vu = el('div','tvvol','VOL +');
  vd.onclick = function(){ press('vol_down'); };
  vu.onclick = function(){ press('vol_up'); };
  dimmed.push(vd); dimmed.push(vu);
  card.appendChild(row([vd, btn('tvc','','mute','mute'), vu]));
  setLive(link);

  /* Пока пульт открыт, автообновление панели стоит - иначе разметка
     менялась бы под пальцем. Но статус нужен именно сейчас, когда пульт
     перед глазами, поэтому опрашиваем сами, чаще и не трогая страницу.
     Таймер снимается через ovCleanup: иначе он тикал бы в пустоту. */
  function sync(){
    var q = Q();
    fetch(NAME + '.svg' + q + (q ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(text){
        if(!text) return;
        var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
        var g = doc.querySelector('[data-tv-base="' + base + '"]');
        if(!g) return;
        on = g.getAttribute('data-tv-on') === '1';
        var st = g.getAttribute('data-tv-state') || '';
        var now = g.getAttribute('data-tv-app') || '';
        var live = g.getAttribute('data-tv-link') === '1';
        sub.textContent = st + (now ? ' · ' + now : '')
                        + (live ? '' : ' · доступно только включение');
        // Телевизор просыпается секунд двадцать. Как только мост до него
        // достучался, пульт перестаёт быть бледным сам - без этого он
        // оставался в том виде, в каком открылся.
        if(live !== link) setLive(live);
        // Подсветка активного приложения: телевизор могли переключить и
        // обычным пультом, поэтому идём от того, что сообщил мост.
        var chips = card.querySelectorAll('.tvapp');
        for(var i = 0; i < chips.length; i++){
          chips[i].classList.toggle('now', chips[i].textContent === now);
        }
      })
      .catch(function(){});
  }
  var timer = setInterval(sync, 2000);
  ovCleanup = function(){ clearInterval(timer); };

  openOv([card]);
}

/* ---------- список ----------
   Окно рисует себя само, по ответу /api/list/<имя>. Каждое действие - это
   одна операция над одним пунктом, а не «вот новый список»: два телефона,
   отметившие по пункту почти одновременно, иначе затирали бы друг друга.
   Ответ на действие - список после него, переспрашивать не нужно.

   Пока окно открыто, список перечитывается раз в три секунды: его могли
   поменять с другого телефона, сценарием или быстрой командой. Строку
   ввода перерисовка не трогает - иначе набранное пропадало бы. */
function padList(node){
  var v = listView(node);
  if(!v) return;
  openOv([v.box]); v.start();
  ovCleanup = v.stop;
}
/* Содержимое окна списка - отдельно от окна: его же ставит над
   расписанием окно плитки «Сегодня» (1.43). */
function listView(node){
  var name = node.getAttribute('data-list');
  if(!name) return null;
  var url = 'api/list/' + encodeURIComponent(name);
  var box = el('div','lst sheet');
  var head = el('div','lhead'), ttl = el('div','lttl', node.getAttribute('data-title') || ''),
      cnt = el('div','lcnt');
  head.appendChild(ttl); head.appendChild(cnt);
  var add = el('div','ladd'), input = document.createElement('input'),
      go = el('div','lgo','Добавить');
  input.type = 'text'; input.maxLength = 200;
  input.placeholder = 'Новый пункт';
  input.setAttribute('enterkeyhint', 'done');
  add.appendChild(input); add.appendChild(go);
  var body = el('div'), foot = el('div','lfoot'), note = el('div','lnote'),
      warn = el('div','lwarn');
  box.appendChild(head); box.appendChild(warn); box.appendChild(add); box.appendChild(body);
  box.appendChild(foot); box.appendChild(note);

  var view = null, showDone = false, busy = false, timer = null, lastSig = '';

  function call(op){
    busy = true;
    return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
                       body: JSON.stringify(op)})
      .then(function(r){ return r.json().then(function(j){
        if(!r.ok) throw new Error(j.error || r.status); return j; }); })
      .then(function(j){ view = j; draw(); })
      .catch(function(e){ flash('Не удалось: ' + e.message); })
      .then(function(){ busy = false; });
  }
  function load(){
    if(busy) return;
    fetch(url + '?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if(!j || busy) return;
        // Ничего не поменялось - не перерисовываем: иначе раз в три
        // секунды сбрасывалось бы «Удалить?» и прыгала прокрутка.
        var sig = JSON.stringify([j.open, j.done, j.warning || '']);
        if(sig === lastSig) return;
        view = j; draw();
      })
      .catch(function(){});
  }
  function submit(){
    var text = input.value.replace(/^\s+|\s+$/g, '');
    if(!text) return;
