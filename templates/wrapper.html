    input.value = '';
    call({op:'add', text:text});
    // Клавиатура остаётся: пункты чаще добавляют подряд, чем по одному.
    input.focus();
  }
  go.onclick = submit;
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submit(); }
  });

  function btn(text, cls, fn){
    var b = el('div', 'lbtn' + (cls ? ' ' + cls : ''), text);
    b.onclick = fn; return b;
  }
  function row(item, k, total, done){
    var r = el('div', 'lrow' + (done ? ' done' : ''));
    var chk = el('div','lchk'); chk.appendChild(el('i'));
    chk.onclick = function(){ call({op: done ? 'undo' : 'done', id: item.id}); };
    var txt = el('div','ltxt', item.text);
    // Правка - по нажатию на текст. Окно ввода системное: на телефоне
    // оно же открывает клавиатуру, своё рисовать незачем.
    txt.onclick = function(){
      var t = window.prompt('Пункт', item.text);
      if(t !== null && t.replace(/\s+/g,'') && t !== item.text)
        call({op:'edit', id:item.id, text:t});
    };
    r.appendChild(chk); r.appendChild(txt);
    if(!done){
      r.appendChild(btn('\u25B2', k === 0 ? 'off' : '',
                        function(){ call({op:'move', id:item.id, to:'up'}); }));
      r.appendChild(btn('\u25BC', k === total - 1 ? 'off' : '',
                        function(){ call({op:'move', id:item.id, to:'down'}); }));
    }
    // Удаление со вторым нажатием: первое превращает крестик в «Удалить?»,
    // и через три секунды он возвращается сам. Отменить удаление потом
    // нечем, а промах по крестику рядом со стрелками - дело обычное.
    var del = btn('\u2715', '', null);
    var armed = null;
    del.onclick = function(){
      if(armed){ clearTimeout(armed); call({op:'delete', id:item.id}); return; }
      del.textContent = 'Удалить?'; del.classList.add('ask');
      armed = setTimeout(function(){
        armed = null; del.textContent = '\u2715'; del.classList.remove('ask');
      }, 3000);
    };
    r.appendChild(del);
    return r;
  }
  function draw(){
    if(!view) return;
    lastSig = JSON.stringify([view.open, view.done, view.warning || '']);
    // Демон не смог записать файл: список живёт в памяти до перезапуска.
    warn.textContent = view.warning
      ? 'Список не сохраняется на контроллере и пропадёт при перезапуске. '
        + 'Откройте «Проверка конфига». (' + view.warning + ')'
      : '';
    ttl.textContent = view.title || ttl.textContent;
    cnt.textContent = view.open.length ? String(view.open.length) : '';
    body.innerHTML = '';
    if(!view.open.length)
      body.appendChild(el('div','lempty', view.done.length ? 'Всё сделано' : 'Пусто'));
    view.open.forEach(function(item, k){ body.appendChild(row(item, k, view.open.length, false)); });
    if(showDone) view.done.forEach(function(item){ body.appendChild(row(item, 0, 0, true)); });
    foot.innerHTML = '';
    if(view.done.length){
      var t = el('span', '', (showDone ? 'Скрыть выполненные' : 'Показать выполненные')
                             + ' (' + view.done.length + ')');
      t.onclick = function(){ showDone = !showDone; draw(); };
      foot.appendChild(t);
      if(showDone){
        var c = el('span', '', 'Очистить выполненные');
        c.onclick = function(){ call({op:'clear'}); };
        foot.appendChild(c);
      }
    }
    note.textContent = view.done.length
      ? 'Выполненные удаляются сами через ' + fmtDays(view.keep_days) + ' после отметки.'
      : '';
  }
  function fmtDays(d){
    if(d < 1) return Math.round(d * 24) + ' ч';
    var n = Math.round(d), m10 = n % 10, m100 = n % 100;
    var w = (m10 === 1 && m100 !== 11) ? 'день'
          : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? 'дня' : 'дней';
    return n + ' ' + w;
  }

  return {box: box,
          start: function(){ load(); timer = setInterval(load, 3000); },
          stop: function(){ clearInterval(timer); }};
}

/* ---------- вода ----------
   Окна протечки и крана читают плитку на панели, а панель под окном
   обновляет ждущий запрос. Поэтому окно само видит, как прибор ответил:
   раз в секунду переискиваем плитку по номеру и перерисовываемся. */
function hhmm(ts){
  if(!ts) return '';
  var d = new Date(ts * 1000), now = new Date();
  var t = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  if(d.toDateString() !== now.toDateString())
    t = d.getDate() + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + t;
  return t;
}
function freshTile(node){
  var i = node.getAttribute('data-i');
  return host.querySelector('[data-i="' + i + '"][data-pad="' + node.getAttribute('data-pad') + '"]') || node;
}

function padLeak(node){
  var box = el('div','lst');
  var head = el('div','lhead'), ttl = el('div','lttl', node.getAttribute('data-title') || 'Протечки');
  head.appendChild(ttl); box.appendChild(head);
  var body = el('div'), foot = el('div');
  box.appendChild(body); box.appendChild(foot);
  var resetBusy = false;

  function draw(){
    node = freshTile(node);
    body.innerHTML = '';
    var raw = node.getAttribute('data-leak-rows') || '';
    raw.split(';').forEach(function(item){
      if(!item) return;
      var p = item.split('|');
      var on = p[1] === '1', unknown = p[1] === '?';
      var r = el('div', 'wrow' + (on ? ' wet' : ''));
      var pk = el('div'); pk.innerHTML = puckSvg(on); r.appendChild(pk.firstChild);
      r.appendChild(el('div','wname', p[0]));
      // Время - последнего сообщения датчика: у сработавшего это момент
      // срабатывания, у сухого - когда он последний раз отчитался.
      if(on && p[2] && p[2] !== '0') r.appendChild(el('div','wwhen','с ' + hhmm(+p[2])));
      r.appendChild(el('div','wst', unknown ? 'нет данных' : (on ? 'Вода' : 'Сухо')));
      body.appendChild(r);
      // Что этот датчик перекрывает - знает раздел water. Видно сразу,
      // какая вода пропала и почему.
      if(p[3]) body.appendChild(el('div','wclose',
        (on ? 'перекрыл: ' : 'перекрывает: ') + p[3]));
    });
    foot.innerHTML = '';
    var alarm = node.getAttribute('data-alarm') === '1';
    var reset = node.getAttribute('data-reset');
    if(alarm && reset){
      var b = el('div', 'wbtn reset' + (resetBusy ? ' off' : ''),
                 resetBusy ? 'Сбрасываю…' : 'Сбросить тревогу');
      b.onclick = function(){
        resetBusy = true; draw();
        // Модулей может быть несколько - у каждого свой сброс. Жмём все,
        // что относятся к показанным датчикам.
        var topics = reset.split('|');
        Promise.all(topics.map(function(t){ return pub(t, 1); }))
          .catch(function(e){ flash('Не удалось: ' + e.message); })
          .then(function(){ setTimeout(function(){ resetBusy = false; draw(); }, 2500); });
      };
      foot.appendChild(b);
      foot.appendChild(el('div','lnote',
        'Сброс снимает тревогу модуля. Пока датчик мокрый, она поднимется снова.'));
    } else if(alarm){
      foot.appendChild(el('div','lnote',
        'Тревога держится до сброса — на модуле или в его настройках.'));
    }
  }
  draw();
  var timer = setInterval(draw, 1000);
  openOv([box]);
  ovCleanup = function(){ clearInterval(timer); };
}

/* ---------- расписание ----------
   Сегодня и завтра целиком. Данные - в атрибуте плитки, его обновляет
   ждущий запрос; окно перерисовывается раз в 10 с, чтобы «сейчас»
   переезжало на следующее событие без переоткрытия. Перерисовываем, только
   если строки поменялись: иначе прокрутка длинного дня прыгала бы. */
function padAgenda(node){
  var v = agendaView(node);
  openOv([v.box]); v.start();
  ovCleanup = v.stop;
}
function agendaView(node){
  var box = el('div','lst agw');
  var body = el('div');
  box.appendChild(body);
  var last = null;
  function draw(){
    node = freshTile(node);
    var raw = node.getAttribute('data-agenda') || '';
    if (raw === last) return;
    last = raw;
    body.innerHTML = '';
    var any = false, cnt = 0;
    raw.split(';').forEach(function(item){
      if(!item) return;
      var p = item.split('|');
      if (p[0] === 'D') {
        if (any && !cnt) body.appendChild(el('div','agempty','Ничего не запланировано'));
        var h = el('div','lhead');
        var label = p[1] || '';
        // Листок календаря у сегодняшнего дня (1.42), как на плитке.
        if(!any){
          var now = new Date(), pg = el('div');
          pg.innerHTML = calPageSvg(now.getDate(), ['вс','пн','вт','ср','чт','пт','сб'][now.getDay()], 30);
          h.appendChild(pg.firstChild);
        }
        h.appendChild(el('div','lttl', label.charAt(0).toUpperCase() + label.slice(1)));
        body.appendChild(h);
        any = true; cnt = 0;
        return;
      }
      cnt += 1;
      var st = p[5] || 'next';
      var r = el('div', 'agrow ' + st);
      var dot = el('i'); dot.style.background = p[3] || '#3B8FD4';
      r.appendChild(dot);
      // «14:00–15:00» в узкой колонке переносился посередине: начало
      // крупно, конец мелко строкой ниже.
      var span = (p[1] || '').split('–');
      var tm = el('div','agtime', st === 'now' ? 'сейчас' : span[0]);
      if (st === 'now') tm.appendChild(el('div','agend', p[1]));
      else if (span[1]) tm.appendChild(el('div','agend', 'до ' + span[1]));
      r.appendChild(tm);
      var t = el('div','agtxt');
      t.appendChild(el('div','agname', p[2]));

function padValve(node){
  var box = el('div','lst');
  var head = el('div','lhead'), ttl = el('div','lttl', node.getAttribute('data-title') || 'Кран');
  head.appendChild(ttl); box.appendChild(head);
  var pic = el('div'), big = el('div','wbig'), sub = el('div','wsub'), act = el('div'), warn = el('div');
  box.appendChild(pic); box.appendChild(big); box.appendChild(sub); box.appendChild(act); box.appendChild(warn);
  var hot = node.getAttribute('data-water') === 'hot';
  // Куда просили перевести кран: пока прибор не ответил, пишем «…ется».
  var want = null, wantUntil = 0;

  function draw(){
    node = freshTile(node);
    var opened = node.getAttribute('data-state') === '1';
    var alarm = node.getAttribute('data-alarm') === '1';
    if(want !== null && (want === opened || Date.now() > wantUntil)) want = null;
    var picKey = (opened ? 1 : 0) + (hot ? 'h' : 'c');
    if(pic.getAttribute('data-k') !== picKey){
      pic.setAttribute('data-k', picKey);
      pic.innerHTML = faucetSvg(opened, hot ? '#D9433C' : '#3B8FD4', 120);
    }
    big.textContent = want === null ? (opened ? 'Открыт' : 'Перекрыт')

    var st = node.getAttribute('data-status') || '';
    var why = st.indexOf('Перекрыт: ') === 0 ? st.slice(10) : '';
    if(why === 'протечка') why = '';   // кто именно - не знаем
    sub.textContent = (hot ? 'Горячая вода' : 'Холодная вода')
                    + (!opened && why ? ' · перекрыл датчик: ' + why
                       : (!opened && alarm ? ' · перекрыт из-за протечки' : ''));
    act.innerHTML = '';
    // не «close»: так зовётся круглая «назад» окна (#ov .close, 1.35), и
    // кнопка уезжала к ней в угол
    var b = el('div', 'wbtn ' + (opened ? 'shut' : 'open') + (hot ? ' hot' : '')
                    + (want !== null ? ' off' : ''),

    b.onclick = function(){

function openPad(node){
  var pad = node.getAttribute('data-pad');
  if(pad==='xy') padXY(node);
  else if(pad==='thermostat') padThermostat(node);
  else if(pad==='level') padLevel(node);
  else if(pad==='curtain') padCurtain(node);
  else if(pad==='roller') padCurtain(node, 'y');
  else if(pad==='ac') padAC(node);
  else if(pad==='camera') padCamera(node);
  else if(pad==='tv') padTV(node);
  else if(pad==='list') padList(node);
  else if(pad==='leak') padLeak(node);
  else if(pad==='valve') padValve(node);

}

/* ---------- обновление ---------- */
/* Ответы приходят не в том порядке, в каком ушли запросы. Фоновое
   обновление и запрос после нажатия на заголовок идут параллельно, и если
   фоновое ушло до нажатия со старой свёрткой, а вернулось после, оно
   перерисовывало панель обратно. Поэтому у каждого запроса номер, и ответ
   старее показанного выбрасывается, а ответ на запрос с другой свёрткой
   или числом колонок - тоже. */
var reqSeq = 0, shownSeq = 0, pendingSvg = null, inflight = 0, lastReqAt = 0;

/* Последние картинки по состоянию свёртки: повторно раскрытый раздел
   показывается из памяти мгновенно, а свежие данные догоняют. Держим
   немного - это по одной на раздел гармошки плюс пара вариантов колонок. */
var svgCache = {}, cacheKeys = [], CACHE_MAX = 12;
function remember(q, svg){
  if (!svgCache[q]) {
    cacheKeys.push(q);
    if (cacheKeys.length > CACHE_MAX) delete svgCache[cacheKeys.shift()];
  }
  svgCache[q] = {svg: svg, at: Date.now()};
}

/* ---------- точечная замена ----------
   Новая картинка разбирается целиком, но в документ попадают только те
   плитки, что изменились. Остальные узлы остаются прежними - с их
   обработчиками, нажатием, которое сейчас идёт, и ссылками, которые
   держат пульты. Раньше innerHTML менял всю панель: полторы сотни
   килобайт разметки и обработчики заново на каждую плитку раз в десять
   секунд.

   Сравниваются дети главной группы: заголовки разделов, чипы, плитки,
   часы в шапке - каждый своей строкой. Стили, defs и размеры - отдельно:
   если поменялись они, раскладка другая, и панель заменяется целиком. */
var XP = window.DOMParser ? new DOMParser() : null;
var XS = window.XMLSerializer ? new XMLSerializer() : null;
var shownHead = null, shownParts = null;
/* Плитки с мгновенным откликом: индекс -> до какого времени не трогать.
   Пока прибор не ответил, сервер присылает плитку в прежнем виде, и без
   этого рамка мигнула бы обратно на первом же ответе. */
var holds = {}, HOLD_MS = 8000;

function kids(node){
  var out = [];
  for (var c = node.firstChild; c; c = c.nextSibling)
    if (c.nodeType === 1) out.push(c);
  return out;
}
function mainOf(svgEl){
  var k = kids(svgEl);
  return k.length ? k[k.length - 1] : null;
}
function headOf(svgEl){
  var k = kids(svgEl), s = '';
  for (var i = 0; i < k.length - 1; i++) s += XS.serializeToString(k[i]);
  var a = ['width', 'height', 'viewBox', 'class', 'style'];
  for (var j = 0; j < a.length; j++) s += '|' + (svgEl.getAttribute(a[j]) || '');
  return s;
}
function partsOf(g){
  var k = kids(g), out = [];
  for (var i = 0; i < k.length; i++) out.push(XS.serializeToString(k[i]));
  return out;
}
function parseSvg(svg){
  if (!XP || !XS) return null;
  var doc = XP.parseFromString(svg, 'image/svg+xml');
  if (!doc || !doc.documentElement || doc.getElementsByTagName('parsererror').length)
    return null;
  return doc.documentElement;
}
function hold(node){
  var g = host.querySelector('svg') ? mainOf(host.querySelector('svg')) : null;
  if (!g) return;
  var k = kids(g);
  for (var n = node; n && n !== g; n = n.parentNode) {
    var i = k.indexOf(n);
    if (i >= 0) { holds[i] = Date.now() + HOLD_MS; return; }
  }
}

/* Заменить только изменившееся. false - не вышло, нужна полная замена. */
function patch(root){
  var cur = host.querySelector('svg');
  if (!cur || !shownParts || !root) return false;
  var head = headOf(root);
  if (head !== shownHead) return false;
  var ng = mainOf(root), cg = mainOf(cur);
  if (!ng || !cg) return false;
  var nk = kids(ng), ck = kids(cg);
  if (nk.length !== ck.length || nk.length !== shownParts.length) return false;
  var now = Date.now();
  for (var i = 0; i < nk.length; i++) {
    var str = XS.serializeToString(nk[i]);
    // Не изменилась - не трогаем. Исключение - плитка с мгновенным
    // откликом, которую прибор так и не подтвердил: её возвращаем к
    // тому, что знает сервер.
    var expired = holds[i] && holds[i] <= now;
    if (str === shownParts[i] && !expired) continue;
    var fresh = document.importNode(nk[i], true);
    cg.replaceChild(fresh, ck[i]);
    shownParts[i] = str;
    delete holds[i];
    bind(fresh);
  }
  return true;
}

function full(svg, root){
  if (root) {
    shownHead = headOf(root);
    shownParts = partsOf(mainOf(root));
    holds = {};
    var node = document.importNode(root, true);
    while (host.firstChild) host.removeChild(host.firstChild);
    host.appendChild(node);
  } else {
    // Разобрать как XML не вышло - вставляем по-старому, без точечных
    // замен в дальнейшем, пока не придёт разбираемая картинка.
    shownHead = shownParts = null;
    host.innerHTML = svg;
  }
  bind();
}

function applySvg(svg, seq){
  if (seq < shownSeq) return;
  if (fingerHeld()) {
    if (!pendingSvg || seq > pendingSvg.seq) pendingSvg = {svg: svg, seq: seq};
    return;
  }
  shownSeq = seq; pendingSvg = null;
  var root = parseSvg(svg);
  if (!patch(root)) full(svg, root);
  pageBg(root);
  dockBar();
  glassScroll();
  if (!DEMO) setTimeout(navScale, 0);
  host.classList.remove('wait');
  err.style.display = 'none';
  if (AUTO_PAD) {
    var want = AUTO_PAD; AUTO_PAD = '';
    setTimeout(function(){
      var n = host.querySelector('[data-pad="' + want + '"]');
      if (n) openPad(n);
    }, 60);
  }
}
function flushPending(){
  if (!pendingSvg || fingerHeld()) return;
  var p = pendingSvg; pendingSvg = null;
  applySvg(p.svg, p.seq);
}

/* Версия состояния, которую видела страница. Её отдаёт сервер в
   X-Panel-Version, и ждущий запрос держится открытым, пока она не
   изменится. Нет заголовка - старый сервер, работаем опросом. */
var VER = null, LIVE = true;
function noteVersion(r){
  var app = r.headers && r.headers.get ? r.headers.get('X-Panel-App') : null;
  if (app && APP && app !== APP) {
    // под открытым окном не дёргаем - перезагрузимся, когда его закроют
    if (ov.classList.contains('open')) appReload = true; else location.reload();
  }
  var v = r.headers && r.headers.get ? r.headers.get('X-Panel-Version') : null;
  if (v === null || v === undefined || v === '') { LIVE = false; return; }
  VER = parseInt(v, 10);
}
function svgUrl(q, extra){
  return NAME + '.svg' + q + (q ? '&' : '?') + (extra || '') + 't=' + Date.now();
}

/* Разовый запрос: после нажатий, смены свёртки, закрытия окна.
   force нужен пультам: пока открыт оверлей, автообновление стоит, но
   пульт термостата сам следит за прибором и переспрашивает осознанно. */
function refresh(force){
  if(paused && !force) return;
  var q = Q(), seq = ++reqSeq, settled = false;
  function settle(){ if(!settled){ settled = true; inflight--; } }
  inflight++; lastReqAt = Date.now();
  fetch(svgUrl(q), {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      noteVersion(r);
      return r.text();
    })
    .then(function(svg){
      settle();
      if(svg.indexOf('<svg')<0) throw new Error('пустой ответ');
      remember(q, svg);
      // Пока запрос шёл, свёртку или колонки поменяли - картинка уже не та.
      if(q !== Q()) return;
      applySvg(svg, seq);
      // Первая загрузка: гармошку страница узнаёт только из разметки, и
      // первый запрос ушёл без раскрытого раздела. Переспрашиваем сразу.
      if(q !== Q()) refresh(true);
    })
    .catch(function(e){
      settle();
      // Притушенную панель не оставляем: свежего не будет, а старое
      // лучше, чем ничего.
      if(q === Q()) host.classList.remove('wait');
      if(host.querySelector('svg')) return;
      host.textContent = 'Не удалось загрузить панель: ' + e.message;
    });
}

/* ---------- ждущий запрос ----------
   Один запрос всегда открыт: сервер отвечает, как только на панели
   что-то поменялось, а без изменений - через refresh секунд, как раньше
   ходил таймер. Ответ - вся панель, но в документ попадают только
   изменившиеся плитки.

   Ответ пришёл подозрительно быстро - сервер не стал ждать (занято или
   изменения сыплются подряд). Тогда следующий запрос через секунду, а не
   сразу: иначе страница крутилась бы в цикле и грела контроллер. */
var pollTimer = null, pollAbort = null, pollBusy = false, pollFails = 0;
function schedule(ms){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, ms);
}
function poll(){
  if (pollBusy || STILL) return;
  if (document.hidden) return;          // продолжим, когда вкладку покажут
  if (!LIVE) { if (!paused) refresh(); schedule(EVERY); return; }
  pollBusy = true;
  var q = Q(), t0 = Date.now();
  var ctl = window.AbortController ? new AbortController() : null;
  pollAbort = ctl;
  var opts = {cache:'no-store'};
  if (ctl) opts.signal = ctl.signal;
  fetch(svgUrl(q, VER !== null ? 'since=' + VER + '&' : ''), opts)
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      noteVersion(r);
      // 204 - на сервере нет места для ждущих (открыто много экранов).
      // Картинка у нас и так текущая: спросим снова чуть позже.
      return r.status === 204 ? null : r.text();
    })
    .then(function(svg){
      pollBusy = false; pollAbort = null; pollFails = 0;
      if (svg === null) { schedule(q !== Q() ? 0 : 2000); return; }
      if (svg.indexOf('<svg') >= 0) {
        remember(q, svg);
        // Панель обновляется и под открытым окном: замена точечная и
        // ничего не ломает под пальцем, а пульты (термостат) читают
        // прибор прямо с неё.
        // Номер - на момент ответа, а не запроса: ждущий запрос уходит
        // раньше всех, а приносит самое свежее. С номером запроса его
        // ответ проигрывал бы разовому, ушедшему позже, и изменение
        // терялось бы до следующего таймаута.
        if (q === Q()) applySvg(svg, ++reqSeq);
      }
      if (q !== Q()) { schedule(0); return; }
      schedule(Date.now() - t0 < 300 ? 1000 : 0);
    })
    .catch(function(e){
      pollBusy = false; pollAbort = null;
      if (e && e.name === 'AbortError') { schedule(0); return; }
      pollFails += 1;
      // Контроллер перезагружается или сеть пропала: не долбим, а
      // отступаем, но не дольше обычного шага обновления.
      schedule(Math.min(EVERY, 1000 * pollFails));
    });
}
/* Свёртку или колонки поменяли - ждущий запрос несёт старый адрес.
   Обрываем его и открываем новый, иначе следующее изменение пришло бы
   только после его таймаута. */
function restartPoll(){
  if (pollAbort) { try { pollAbort.abort(); } catch(e) {} }
  else schedule(0);
}
/* Совместимость: прежний тик раз в EVERY. Теперь им служит ждущий
   запрос, а функция осталась для тех, кто её зовёт. */

  if (inflight > 0 && Date.now() - lastReqAt < 15000) return;

}
/* Экран не должен гаснуть.
   Сперва пробуем штатный способ, он есть в свежих браузерах. Если его нет -
   заводим беззвучное зацикленное видео: пока что-то воспроизводится, Android

  document.addEventListener('touchstart', function once(){
    v.play(); document.removeEventListener('touchstart', once);
  });
}
keepAwake();
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && !wakeLock) keepAwake();
  // Вкладку спрятали - ждущий запрос не держим, поток на контроллере
  // нужнее. Показали - сразу свежая картинка и снова ждём.
  if (document.hidden) {
    if (pollAbort) { try { pollAbort.abort(); } catch(e) {} }
    clearTimeout(pollTimer);
  } else {
    refresh(); schedule(300);
  }
});

/* Полный экран по двойному касанию - на случай, если страница открыта
   обычной вкладкой, а не с главного экрана. */
document.addEventListener('dblclick', function(){
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen ||
           el.webkitRequestFullScreen || el.mozRequestFullScreen;
  if (fn) fn.call(el);
});

drawCols();
refresh();
// Ждущий запрос - чуть позже первой картинки: она приходит без версии, а
// с версией он и ждёт по-настоящему.
schedule(800);
</script></body></html>
