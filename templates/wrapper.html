<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Запуск без рамки браузера после «Добавить на главный экран».
     mobile-web-app-capable понимают Android-браузеры, apple-* - iOS. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F0F11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>__NAME__</title>
<style>
 /* Страница обычная и прокручиваемая. Раньше тут была раскладка «под киоск»:
    flex по центру, height:100%, overflow:hidden. На телефоне панель влезала
    по высоте и всё выглядело нормально, а на ноутбуке широкий и низкий экран
    ужимал SVG до нуля - плитки просто исчезали. И прокрутки не было вовсе. */
 html,body{margin:0;background:#0F0F11;
           -webkit-tap-highlight-color:transparent;
           font:15px -apple-system,'Segoe UI',Inter,system-ui,sans-serif}
 body{padding:10px;box-sizing:border-box;min-height:100vh}
 /* Сверху полоса под кнопки «← Панели» и колонки. Раньше они висели прямо
    над шапкой панели и закрывали чипы справа - нажатие по чипу протечки
    уходило в выбор колонок. */
 #host{color:#fff;margin:0 auto;max-width:1400px;padding-top:44px}
 /* размер задаётся ШИРИНОЙ: высота подстроится по пропорции сама */
 #host svg{display:block;width:100%;height:auto}
 /* стекло (1.40): обои - неподвижный фон окна, их копия в картинке не нужна */
 #host svg .wall{display:none}
 #pagewall{position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;pointer-events:none}
 /* Длинное нажатие в мобильных браузерах выделяет текст и показывает
    системное меню - на пультах это мешало. Запрещаем на всей панели. */
 #host,#ov{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
           user-select:none;-webkit-touch-callout:none}
 [data-topic],[data-expand],[data-pad],[data-href],[data-chart],[data-section]{cursor:pointer}
 [data-topic].busy,[data-pad].busy{opacity:.45}
 /* Раздел раскрывается, а свежей картинки ещё нет: панель притушена,
    чтобы было видно, что нажатие принято. Без этого на медленном ответе
    нажимали второй раз - и попадали уже в следующий раздел. */
 #host svg{transition:opacity .15s}
 #host.wait svg{opacity:.55}
 /* Пока открыт оверлей и ещё мгновение после закрытия, панель касаний не
    принимает: иначе повторное касание или запоздалые события браузера
    уходят в плитку, оказавшуюся под пальцем. */
 #host.shield{pointer-events:none}
 /* Фон под оверлеем не прокручивается: жест внутри окна не должен
    уезжать в панель под ним. */
 html.ovlock,html.ovlock body{overflow:hidden}
 /* выбор числа колонок: значение запоминается и переносится между панелями */
 /* назад к списку панелей: маленькая, полупрозрачная, всегда на месте */
 #back{position:fixed;top:8px;left:8px;z-index:15;text-decoration:none;
       background:rgba(28,28,32,.72);border-radius:12px;color:#fff;
       padding:7px 12px;font-size:13px;opacity:.35}
 #back:hover,#back.touched{opacity:1}
 #cols{position:fixed;top:8px;right:8px;z-index:15;
       background:rgba(28,28,32,.72);border-radius:12px;padding:3px;
       font-size:13px;line-height:1;opacity:.35}
 #cols:hover,#cols.touched{opacity:1}
 #cols b{display:inline-block;padding:6px 9px;border-radius:9px;color:#fff;
         cursor:pointer;font-weight:600}
 #cols b.on{background:#E09B2D;color:#1B1B1F}
 /* Свёрнутый выбор - одна кнопка с текущим значением: на прокрученной
    панели под ней скрывается меньше. Раскрывается по нажатию. */
 #cols b.cur{background:none;color:#fff;padding:6px 10px}
 #err{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
      background:#C4553B;color:#fff;padding:7px 14px;border-radius:9px;
      font-size:13px;display:none;z-index:30}
 /* Порт 8080 - вход без пароля. Пока панель открыта через него, об этом
    должно быть видно: предупреждение в документации читают один раз, а
    плашку - каждый день, пока не уберёшь причину. */
 #warn8080{position:fixed;left:0;right:0;top:0;z-index:40;display:none;
           background:#8A5A1E;color:#FFE6BF;text-align:center;
           padding:6px 10px;font-size:13px;line-height:1.35}
 #warn8080 b{color:#fff}
 #warn8080 a{color:#FFE6BF;text-decoration:underline}
 /* Полоса вкладок у края окна (tabs, 1.36): копия из картинки, своя
    полоса в картинке невидима и держит место. Внизу - убираем поле
    страницы, сверху - кнопки уходят под полосу. */
 #tabdock{position:fixed;left:0;width:100%;display:block;z-index:14}
 html.dock-bottom #tabdock{bottom:0}
 html.dock-top #tabdock{top:0}
 html.dock-bottom body{padding-bottom:0}
 html.dock-top body{padding-top:0}
 /* Кнопки страницы во вкладках спрятаны - экран небольшой, а нужны они
    редко. Нажатие на шапку показывает их поверх неё на несколько секунд. */
 html.dock-top #host,html.dock-bottom #host{padding-top:0}
 html.dock-top #back,html.dock-top #cols,
 html.dock-bottom #back,html.dock-bottom #cols{opacity:0;pointer-events:none;transition:opacity .2s}
 html.dock-top #back,html.dock-top #cols{top:calc(var(--dock-h,52px) + 8px)}
 html.chrome-on #back,html.chrome-on #cols{opacity:1;pointer-events:auto;
                                            background:rgba(28,28,32,.96)}
 [data-headtap]{cursor:pointer}
 /* Кнопки страницы в шапке панели (1.44): круглая «назад» и шестерёнка
    рисуются в картинке, прежние кнопки сверху и полоса под ними не нужны. */
 html.svgnav #back,html.svgnav #cols{display:none}
 html.svgnav #host{padding-top:0}
 #host [data-nav]{cursor:pointer}
 #host [data-nav].down{opacity:.6}
 /* Меню шестерёнки: колонки, тема, вид разделов - кнопками в один экран. */
 #navmenu{position:fixed;z-index:20;right:12px;top:64px;width:320px;max-width:calc(100vw - 24px);
          box-sizing:border-box;padding:14px 14px 10px;border-radius:20px;display:none;
          background:rgba(30,30,34,.94);color:#F2F2F4;box-shadow:0 12px 36px rgba(0,0,0,.45);
          -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
          font-size:14px;line-height:1.2;max-height:calc(100vh - 80px);overflow-y:auto}
 #navmenu.open{display:block}
 #navmenu.lt{background:rgba(250,250,252,.95);color:#1C1C1E;box-shadow:0 12px 36px rgba(0,0,0,.18)}
 #navmenu .mh{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
              opacity:.55;margin:2px 4px 8px}
 #navmenu .mrow{display:flex;flex-wrap:wrap;margin:0 0 12px}
 #navmenu .mrow b{margin:0 6px 6px 0;padding:8px 12px;border-radius:12px;font-weight:600;cursor:pointer;
                  background:rgba(255,255,255,.08)}
 #navmenu.lt .mrow b{background:rgba(0,0,0,.06)}
 #navmenu .mrow b.on{background:var(--macc,#E09B2D);color:var(--macc-ink,#1B1B1F)}
 #navmenu .mrow.num b{min-width:20px;text-align:center;padding:8px 10px}
 #navmenu .mlink{display:block;margin:2px 4px 4px;color:inherit;opacity:.7;text-decoration:underline;cursor:pointer}
 #host [data-tabbar]{visibility:hidden}
 body.warned{padding-top:38px}
 body.warned #back,body.warned #cols{top:42px}
 /* оверлей: тот же язык, что и у плиток - тёмный фон, скруглённая карточка */
 /* inset и min() - свежий синтаксис, старые десктопные браузеры его не знают
    и оверлей получался нулевого размера: на телефоне работало, на ноутбуке нет.
    Пишем по-старому. */
 /* Класс видимости зовётся open, а не on. С on оверлей становился
    предком вставленного SVG и подхватывал правило .on .icon, написанное
    для значка включённого прибора: значок плитки, раскрытой на весь
    экран, окрашивался в оранжевый цвет активного устройства. */
 #ov{position:fixed;top:0;left:0;right:0;bottom:0;
     background:rgba(10,10,12,.86);display:none;z-index:2147483000;
     align-items:center;justify-content:center;flex-direction:column;
     padding:18px;box-sizing:border-box;overflow:auto;
     overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
 /* именно auto по бокам: раньше тут было "7px 0", и это правило перебивало
    margin:0 auto у самих пультов - они прижимались к левому краю */
 #ov.open > *{margin:7px auto}
 #ov.open{display:block;text-align:center}
 #ov .card{background:#F1F1F3;border-radius:22px;padding:14px;max-width:100%;
           display:inline-block;box-sizing:border-box;position:relative;z-index:1}
 /* Развёрнутая плитка рисует собственную подложку со скруглением, и
    поля карточки давали вторую рамку вокруг первой. Здесь карточка -
    просто контейнер во всю ширину. */
 /* Ширина по содержимому, а не 100%: иначе на широком экране карточка
    шире графика, тот прижимается к левому краю, а нажатие рядом с ним
    попадает в карточку и оверлей не закрывается - закрытие срабатывает
    только по фону. Центрирование делает флексбокс самого оверлея. */
 #ov .card.wide{background:none;border-radius:0;padding:0;
                display:inline-block;width:auto;max-width:100%}
 /* Место под карточкой: закрывают её нажатием мимо, и на телефоне
    промахнуться мимо узкой полоски слишком легко. */
 #ov .card.wide + .hint{padding:14px 0 64px}
 #ov svg{display:block;max-width:100%;height:auto}
 #ov .ttl{color:#fff;font-size:17px;font-weight:600}
 /* Камера во весь экран. Ширину задаём в процентах окна, высоту отдаём
    пропорции: кадр 16:9, и фиксированная высота его бы обрезала. */
 #ov .cam{display:block;width:100%;height:auto;border-radius:12px;
          background:#17171A;min-height:120px}
 #ov .camwrap{padding:8px}
 #ov .hint{color:rgba(255,255,255,.55);font-size:13px;text-align:center}
 /* переключатель в пульте: без него подвинуть яркость у выключенной лампы
    можно, а увидеть результат - нет */
 #ov .pw{display:inline-flex;align-items:center;padding:10px 18px;
         border-radius:14px;border:2px solid rgba(255,255,255,.3);
         color:#fff;font-size:15px;font-weight:600;cursor:pointer;user-select:none}
 #ov .pw.on{border-color:#E09B2D;color:#E09B2D}
 #ov .pw .led{width:12px;height:12px;border-radius:50%;margin-right:10px;
              background:rgba(255,255,255,.35)}
 #ov .pw.on .led{background:#E09B2D}
 #ov .close{position:fixed;top:12px;left:12px;z-index:5}
 /* окно без своей шапки: место под кнопку «назад» сверху */
 #ov:not(.hashead):not(.ownback):not(.full){padding-top:70px}
 /* пульт ленты: поле «холодный-тёплый» по X, яркость по Y */
 /* размер задаётся из скрипта: min() поддерживают не везде */
 #pad{position:relative;border-radius:20px;touch-action:none;
      overflow:hidden;margin:0 auto}
 #pad .grad{position:absolute;top:0;left:0;right:0;bottom:0}
 #pad .dim{position:absolute;top:0;left:0;right:0;bottom:0;
           background:linear-gradient(to bottom,rgba(10,10,12,0),rgba(10,10,12,.86))}
 #pad .dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;
           border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
 /* пульт диммера: линейный, заполнение снизу */
 #lvl{position:relative;border-radius:20px;touch-action:none;overflow:hidden;
      background:#2C2C31;margin:0 auto}
 #lvl .fill{position:absolute;left:0;right:0;bottom:0;background:#E0A050;opacity:.75}
 #lvl .val{position:absolute;left:0;right:0;bottom:14px;text-align:center;
           color:#fff;font-size:26px;font-weight:600}
 /* пульт диммера с 1.17: колесо в прорези, шкала рядом, число над ним */
 #sphstage{margin:0 auto;touch-action:none}
 #sphstage canvas{display:block;width:100%;height:100%}
 #lvl.roll{background:transparent;border-radius:0;overflow:visible}
 #lvl.roll svg{display:block;width:100%;height:100%}
 /* Шаг числом. Двумя процентами на ночь пальцем по полю не попасть: один
    процент это пара пикселей. Стрелки закрывают ровно этот случай, а
    крупное неяркое число отвечает на вопрос «сколько сейчас», не
    перетягивая внимание с самого поля. */
 #ov .step{display:flex;align-items:center;justify-content:center;gap:14px;
           margin:7px auto}
 #ov .step .lab{color:rgba(255,255,255,.55);font-size:13px;min-width:64px;
                text-align:right}
 #ov .step .num{color:rgba(255,255,255,.78);font-size:24px;font-weight:600;
                min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
 #ov .step .keys{display:flex;gap:8px}
 #ov .step button{width:46px;height:46px;border:0;border-radius:23px;
                  background:rgba(255,255,255,.13);color:#fff;font-size:24px;
                  line-height:46px;padding:0;cursor:pointer;touch-action:manipulation}
 #ov .step button:active{background:rgba(255,255,255,.26)}
 /* пульт шторы: сверху лежит прозрачный слой для жеста, под ним - та же
    картинка плитки, что и на панели, только крупно */
 /* inline-block: обёртка должна быть ровно по картинке, иначе центр жеста
    окажется в центре экрана, а не в центре окна со шторой */
 #crtwrap{position:relative;display:inline-block;margin:0 auto}
 /* z-index больше, чем у .card (там стоит 1): иначе картинка лежит поверх
    прозрачного слоя и забирает касания себе - жест просто не доходит */
 #crtview{position:absolute;left:0;right:0;top:0;bottom:0;touch-action:none;
          cursor:ew-resize;z-index:3}
 #crtview .mark{position:absolute;top:0;bottom:0;width:2px;display:none;
                background:rgba(255,255,255,.9);
                box-shadow:0 0 12px rgba(0,0,0,.7)}
 /* рулонная: полотно ходит вверх-вниз, значит и метка лежит поперёк */
 #crtview.vert{cursor:ns-resize}
 #crtview.vert .mark{top:0;bottom:auto;left:0;right:0;width:auto;height:2px}
 /* белая метка - там, где палец; оранжевая - куда привод едет сам */
 #crtview .mark.going{background:#E09B2D;box-shadow:0 0 12px rgba(0,0,0,.5)}
 #crtview .read{position:absolute;left:0;right:0;top:42%;display:none;
                text-align:center;color:#fff;font-size:42px;font-weight:600;
                text-shadow:0 2px 12px rgba(0,0,0,.8)}
 #ov .crow{display:block;margin:10px auto 0;text-align:center}
 #ov .cbtn{display:inline-block;margin:4px;padding:10px 18px;border-radius:12px;
           border:2px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);
           font-size:15px;font-weight:600;cursor:pointer}
 #ov .cbtn.stop{border-color:#C4553B;color:#FFD8CE}
 #ov .cbtn.on{border-color:#E09B2D;color:#FFD9A0}
 #tdial{margin:0 auto;touch-action:none;user-select:none}
 #tdial .tbig{fill:#fff;font-size:44px;font-weight:650;letter-spacing:-1px}
 #tdial .tsub{fill:rgba(255,255,255,.55);font-size:14px;font-weight:500}
 #tdial .tmode{fill:rgba(255,255,255,.65);font-size:17px;font-weight:600}
 /* пульт кондиционера */
 #wheel{margin:0 auto;user-select:none;touch-action:none}
 #ov .wbig{color:#fff;font-size:64px;font-weight:300;line-height:1;
           letter-spacing:-2px;margin:4px 0 0}
 #ov .wbig .wdeg{font-size:22px;font-weight:500;vertical-align:super;
                 margin-left:4px;letter-spacing:0}
 /* Ряд кнопок пульта - во всю ширину, кнопки равные: пять режимов или
    семь положений жалюзи влезают в телефон одной строкой, а не переносом. */
 #ov .acrow{display:flex;gap:6px;justify-content:center;margin:8px auto;
            max-width:440px;width:100%;box-sizing:border-box}
 /* Пульт телевизора. Кнопки круглые и крупные: пультом пользуются
    пальцем, и промах дороже места на экране. Цвета и размеры заданы
    здесь явно - классы оверлея рассчитаны на тёмный фон, и заголовок
    на белой карточке получался белым по белому. */
 /* Ширина задана жёстко: без неё карточка подстраивалась под самый
    широкий ряд, и на полном экране пульт прыгал при каждом обновлении
    статуса - строка «Включён · Кинопоиск» шире, чем «Выключен». */
 #ov .tvcard{width:340px;max-width:92vw;box-sizing:border-box}
 #ov .tvhead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
 #ov .tvname{overflow:hidden}
 #ov .tvttl,#ov .tvsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #ov .tvname{flex:1;min-width:0}

 #ov .tvttl{color:#1C1C1E;font-size:20px;font-weight:600;line-height:1.2}
 #ov .tvsub{color:#8E8E93;font-size:13px;margin-top:2px}
 #ov .tvrow{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0}
 /* flex:0 0 66px и box-sizing обязательны: без них кнопка в шапке
    растягивалась соседом и круг превращался в овал. */
 #ov .tvc{flex:0 0 66px;width:66px;height:66px;min-width:66px;min-height:66px;
       box-sizing:border-box;padding:0;border-radius:50%;background:#F2F2F7;
       border:1px solid #DCDCE1;display:flex;align-items:center;justify-content:center;
       font-size:14px;color:#1C1C1E;cursor:pointer;user-select:none;
       touch-action:manipulation;overflow:hidden}
 #ov .tvc.big{flex:0 0 88px;width:88px;height:88px;min-width:88px;min-height:88px}
 #ov .tvc:active{background:#E4E4EA}
 #ov .tvc.ok{background:#E08A2D;border-color:#E08A2D;color:#fff;
       font-size:18px;font-weight:600}
 #ov .tvc.pw{background:#D9433C;border-color:#D9433C}
 #ov .tvc.hole{background:none;border:none;pointer-events:none}
 #ov .tvc svg{width:26px;height:26px;fill:none;stroke:#1C1C1E;stroke-width:2.4;
       stroke-linecap:round;stroke-linejoin:round}
 #ov .tvc.pw svg{stroke:#fff}
 #ov .tvc.fill svg{fill:#1C1C1E;stroke:none}
 #ov .tvapps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
 #ov .tvapp{height:52px;border-radius:16px;background:#F2F2F7;border:1px solid #DCDCE1;
       display:flex;align-items:center;justify-content:center;font-size:14px;
       color:#1C1C1E;cursor:pointer;text-align:center;padding:0 6px;
       user-select:none;touch-action:manipulation}
 #ov .tvapp.now{background:#FDF3E6;border-color:#E08A2D;border-width:2px}
 #ov .tvvol{flex:1;height:66px;border-radius:22px;background:#F2F2F7;
       border:1px solid #DCDCE1;display:flex;align-items:center;justify-content:center;
       font-size:17px;font-weight:600;color:#1C1C1E;cursor:pointer;
       user-select:none;touch-action:manipulation}
 #ov .tvdim{opacity:.45}
 /* Пульт телевизора с 1.21: тёмный, в светлых темах - светлый (1.22).
    Кнопки - выпуклые кружки, без размытия; колесо рисуется SVG. */
 #ov .tvx{width:340px;max-width:94vw;box-sizing:border-box;background:#1D1E22;
       padding:14px 16px 18px;border-radius:26px;color:#F2F2F4;touch-action:manipulation}
 #ov .tvx .txhead{display:flex;align-items:center;gap:10px;margin:0 0 6px;text-align:left}

 #ov .pw.on{border-color:var(--acc);color:var(--acc)}

 /* ---- пульты в форме темы (1.35) ------------------------------------
    Классы на окне ставит openOv по форме темы: neu - неоморфизм (кнопки

 #ov.flat .hbtn,#ov.flat .tvx .tx,#ov.flat .tvx .txapp,#ov.flat .tvx .txvol,

       box-shadow:inset 3px 3px 7px var(--neu-d),inset -3px -3px 7px var(--neu-l)}
 #ov.neu .hbtn.down,#ov.neu .tvx .tx.down,#ov.neu .hbtn.on,#ov.lt.neu .hbtn.on,

 #ov.neu .tvx .tx.txpw.on svg,#ov.lt.neu .tvx .tx.txpw.on svg{stroke:var(--acc)}
</style></head><body>
<a id="back" href="./">← Панели</a>
<div id="cols"></div>
<div id="navmenu"></div>
<div id="host">загрузка…</div>
<div id="err"></div>
<div id="warn8080"></div>
<div id="ov"><div class="close hbtn" onclick="closeOv()"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div></div>

<script>
var NAME = __NAME_JS__, EVERY = __EVERY__000;
/* Версия демона, с которой отдана эта страница. Обновили панель на
   контроллере - картинка уже новая, а скрипты страницы старые: пульты
   рисовались новым сервером, а вели себя по-старому. Поэтому страница
   сверяет версию с каждым ответом и перезагружается сама. */
var APP = __APP_JS__, appReload = false;
/* Витрина тем (/themes, с 1.28): та же страница на выдуманной панели.
   still=1 - миниатюра: без ожидания изменений и без шагов истории;
   pad=<вид> - сразу открыть пульт этого вида (xy, level, ac…). */
var DEMO = NAME === '_demo';
var STILL = DEMO && /[?&]still=1/.test(location.search);
var AUTO_PAD = DEMO ? ((location.search.match(/[?&]pad=([\w-]+)/) || [])[1] || '') : '';
/* Тему и колонки витрины выбирает страница /themes вокруг неё. */
if (DEMO) {
  document.getElementById('back').style.display = 'none';
  document.getElementById('cols').style.display = 'none';
  document.getElementById('host').style.paddingTop = '10px';
}

/* Запасной вход на 8080 не закрыт паролем: кто попал в домашнюю сеть, тот
   управляет светом и шторами. Годится, чтобы попробовать, но не как
   постоянный режим - поэтому и написано «тестовый». */
(function(){
  if (location.port !== '8080') return;
  var w = document.getElementById('warn8080');
  if (!w) return;
  w.innerHTML = '<b>Тестовый режим:</b> открыто через порт 8080, без пароля. ' +
                'Постоянный адрес — <a href="/panel/' + NAME + '.html">/panel/</a>';
  w.style.display = 'block';
  document.body.className += ' warned';
})();

/* Число колонок.
   Берём из адреса, иначе из памяти браузера, иначе оставляем как в конфиге.
   Запоминаем, чтобы при переходе на другую панель раскладка не сбрасывалась:
   у горизонтальных экранов это каждый раз раздражало. */
var STORE = 'wb-panel-cols';
function readCols(){
  var m = location.search.match(/[?&]cols=(\d+)/);
  if (m) return m[1];
  try { return localStorage.getItem(STORE) || ''; } catch(e) { return ''; }
}
var COLS = readCols();

/* Тема - тоже выбор устройства: на стене в коридоре тёмная, на телефоне
   светлая. Пусто - как в конфиге. Уезжает на сервер параметром theme,
   ему же отдаётся картинка раскрытой плитки и графика. */
var THEME_STORE = 'wb-panel-theme';
/* Темы приходят с сервера (с 1.24): [{name, title, dark, bg}] из данных
   тем - и меню, и цвет полей, и светлый ли пульт. Своей копии списка в
   скрипте больше нет. */
var THEME_LIST = __THEMES_JS__;
var THEMES = [['', 'как в конфиге']], PAGE_BG = {}, DARK_THEME = {}, THEME_INFO = {}, PAGE_WALL = {};
THEME_LIST.forEach(function(t){
  THEMES.push([t.name, t.title]); PAGE_BG[t.name] = t.bg; DARK_THEME[t.name] = !!t.dark;
  PAGE_WALL[t.name] = t.wall || '';
  THEME_INFO[t.name] = t;
});
var THEME = (function(){
  var m = location.search.match(/[?&]theme=([\w-]+)/);
  if (m) return m[1];
  try { return localStorage.getItem(THEME_STORE) || ''; } catch(e) { return ''; }
})();
function saveTheme(v){
  THEME = v;
  if (DEMO) return;          // выбор на витрине - не выбор этого устройства
  try { v ? localStorage.setItem(THEME_STORE, v) : localStorage.removeItem(THEME_STORE); } catch(e) {}
}
function themeQ(){ return THEME ? '&theme=' + THEME : ''; }
/* Поля страницы вокруг панели - в цвет низа её фона: у светлых тем
   чёрная рамка вокруг выглядела чужой. Тему узнаём по классу корня. */
var pageBgNow = '';
function pageBg(root){
  root = root || host.querySelector('svg');
  var name = rootTheme(root);
  var bg = PAGE_BG[name], wall = PAGE_WALL[name] || '';
  if (!bg || bg + wall === pageBgNow) return;
  pageBgNow = bg + wall;
  document.documentElement.style.background = bg;
  // Стекло (1.40): обои - неподвижный слой под страницей. Фон body
  // прозрачный, иначе он лёг бы поверх слоя.
  var pw = document.getElementById('pagewall');
  if (wall) {
    if (!pw) { pw = document.createElement('div'); pw.id = 'pagewall'; document.body.insertBefore(pw, document.body.firstChild); }
    pw.style.background = wall;
    document.body.style.background = 'transparent';
  } else {
    if (pw) pw.parentNode.removeChild(pw);
    document.body.style.background = bg;
  }
  glassScroll();
}
/* Отсвет стекла (1.40) - свет сверху экрана. Градиент в координатах
   картинки сдвигается на величину прокрутки: обои стоят, плитки едут под
   светом. Один атрибут на кадр. */
var glassRaf = 0;
function glassScroll(){
  var g = host.querySelector('[data-glare]'), svg = host.querySelector('svg');
  if (!g || !svg) return;
  var W = +(svg.getAttribute('viewBox') || '0 0 0 0').split(' ')[2] || 1;
  var r = svg.getBoundingClientRect(), k = (r.width || W) / W;
  g.setAttribute('gradientTransform', 'translate(0 ' + (-r.top / k).toFixed(1) + ')');
  // Обои в картинке (линза под стеклом, 1.42) - ровно окно браузера: пятна
  // под плиткой совпадают с неподвижным фоном страницы.
  var wall = host.querySelector('[data-wall]');
  if (wall) {
    var vw = document.documentElement.clientWidth || window.innerWidth, vh = window.innerHeight;
    var x = (-r.left / k).toFixed(1), y = (-r.top / k).toFixed(1);
    var w = (vw / k).toFixed(1), h = (vh / k).toFixed(1), rs = wall.querySelectorAll('rect');
    for (var i = 0; i < rs.length; i++) {
      rs[i].setAttribute('x', x); rs[i].setAttribute('y', y);
      rs[i].setAttribute('width', w); rs[i].setAttribute('height', h);
    }
  }
}
window.addEventListener('scroll', function(){
  if (glassRaf) return;
  glassRaf = (window.requestAnimationFrame || setTimeout)(function(){ glassRaf = 0; glassScroll(); });
}, {passive: true});
window.addEventListener('resize', glassScroll);

/* Кнопка «назад». Если пришли с другой панели по плитке-ссылке, вернуться
   логичнее туда, а не в общий список: человек проваливался в комнату,
   а не начинал обход заново. Имя панели передаётся параметром from.

   Запоминаем в переменной, а не только в href: fixBack() перебивает адрес
   кнопки, когда меняется число колонок, - и без этого возврат молча
   превращался в переход к списку панелей. */
var BACK_TO = (function(){
  var m = location.search.match(/[?&]from=([\w.-]+)/);
  return m ? m[1] : '';
})();
function saveCols(v){
  COLS = v;
  if (DEMO) return;
  try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch(e) {}
}
/* Свёрнутые разделы. Список свой на каждом устройстве: на планшете в
   коридоре и на телефоне нужны разные комнаты. Хранится рядом с числом
   колонок и уезжает на сервер параметром - панель цельная картинка, и
   спрятать плитки на стороне браузера нельзя, останутся дыры. */
var FOLD_KEY = 'wb-panel-fold:' + NAME;
var FOLDED = (function(){
  try { return JSON.parse(localStorage.getItem(FOLD_KEY) || '[]') || []; }
  catch(e) { return []; }
})();
var OPENED = (function(){
  try { return localStorage.getItem(FOLD_KEY + ':open') || ''; }
  catch(e) { return ''; }
})();
/* Вид разделов: list, accordion, tabs. SECT_MODE - что нарисовал сервер
   (узнаём из разметки), MODE - выбор этого устройства в меню (с 1.36):
   планшету на стене вкладки, телефону гармошка. Пусто - как в конфиге. */
var SECT_MODE = 'list', HAS_SECTIONS = false;
var MODE = (function(){
  try { return localStorage.getItem(FOLD_KEY + ':mode') || ''; }
  catch(e) { return ''; }
})();
var MODES = [['', 'как в конфиге'], ['list', 'списком'],
             ['accordion', 'гармошкой'], ['tabs', 'вкладками']];
/* Полоса вкладок у края окна. В картинке она стоит над шапкой или под
   плитками, а страница прикалывает её копию к верху или низу экрана - при
   прокрутке длинной комнаты вкладки остаются под пальцем. Сама полоса в
   картинке невидима и держит под копию место. */
var DOCK = '';
function dockBar(){
  var bar = host.querySelector('[data-tabbar]');
  var dock = document.getElementById('tabdock');
  var cls = document.documentElement.classList;
  DOCK = bar ? bar.getAttribute('data-tabbar') : '';
  cls.toggle('dock-top', DOCK === 'top');
  cls.toggle('dock-bottom', DOCK === 'bottom');
  if (!bar) { if (dock) dock.parentNode.removeChild(dock); return; }
  var svg = host.querySelector('svg');
  var W = +(svg.getAttribute('viewBox') || '0 0 0 0').split(' ')[2];
  var y = +bar.getAttribute('data-bar-y'), h = +bar.getAttribute('data-bar-h');
  if (!dock) {
    dock = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    dock.id = 'tabdock';
    document.body.appendChild(dock);
  }
  dock.setAttribute('class', svg.getAttribute('class') || '');
  dock.setAttribute('style', svg.getAttribute('style') || '');
  dock.setAttribute('viewBox', '0 ' + y + ' ' + W + ' ' + h);
  dock.setAttribute('preserveAspectRatio', 'none');
  // Высота - в масштабе панели на странице: полоса той же толщины, что
  // была бы в картинке, а по ширине - от края до края окна.
  var k = (svg.getBoundingClientRect().width || W) / W;
  dock.style.height = Math.round(h * k) + 'px';
  var copy = bar.cloneNode(true);
  copy.removeAttribute('data-tabbar');
  // Пилюли растягивать нельзя: полоса шире панели на поля страницы.
  // Ряд пересчитываем по центру окна в единицах картинки.
  var scaleX = (document.documentElement.clientWidth || window.innerWidth) / (W * k);
  var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', 'translate(' + (W / 2) + ' 0) scale(' + (1 / scaleX) + ' 1) translate(' + (-W / 2) + ' 0)');
  var plates = copy.querySelectorAll('.tabbar,.tabbar-line');
  for (var i = 0; i < plates.length; i++) plates[i].parentNode.removeChild(plates[i]);
  for (var j = 0; j < plates.length; j++) copy.insertBefore(plates[j], copy.firstChild);
  var tabs = copy.querySelectorAll('[data-tab]');
  for (var t = 0; t < tabs.length; t++) g.appendChild(tabs[t]);
  copy.appendChild(g);
  while (dock.firstChild) dock.removeChild(dock.firstChild);
  dock.appendChild(copy);
  var btns = dock.querySelectorAll('[data-tab]');
  for (var n = 0; n < btns.length; n++)
    btns[n].onclick = function(){ if (tapOk()) toggleSection(this); };
  document.documentElement.style.setProperty('--dock-h', dock.style.height);
}
var chromeTimer = null;
function showChrome(){
  if (!tapOk()) return;
  var cls = document.documentElement.classList;
  cls.add('chrome-on');
  clearTimeout(chromeTimer);
  function hide(){
    // Пока открыт выбор колонок или темы - не прячем.
    if (colsOpen) { chromeTimer = setTimeout(hide, 2000); return; }
    cls.remove('chrome-on');
  }
  chromeTimer = setTimeout(hide, 6000);
}
function oneOpen(){ var m = MODE || SECT_MODE; return m === 'accordion' || m === 'tabs'; }

function saveFold(){
  try {
    localStorage.setItem(FOLD_KEY, JSON.stringify(FOLDED));
    localStorage.setItem(FOLD_KEY + ':open', OPENED);
    MODE ? localStorage.setItem(FOLD_KEY + ':mode', MODE)
         : localStorage.removeItem(FOLD_KEY + ':mode');
  } catch(e) {}
}

function toggleSection(node){
  var key = node.getAttribute('data-section');
  if (!key) return;
  if (node.getAttribute('data-tab')) {
    // Вкладка: открытая остаётся открытой - пустого экрана под рядом
    // вкладок не бывает.
    if (node.getAttribute('data-folded') !== '1') return;
    OPENED = key;
  } else if (SECT_MODE === 'accordion') {
    // В гармошке раскрыт ровно один раздел. Нажатие на свёрнутый
    // раскрывает его, на раскрытый - сворачивает всё: список одних
    // заголовков это самый быстрый способ дойти до нужной комнаты.
    // Сервер понимает "-" как «свёрнуты все».
    OPENED = node.getAttribute('data-folded') === '1' ? key : '-';
  } else {
    var i = FOLDED.indexOf(key);
    if (i < 0) FOLDED.push(key); else FOLDED.splice(i, 1);
  }
  saveFold();
  // Это состояние свёртки уже видели - показываем его сразу, а свежие
  // данные догонят через долю секунды. Нет - притушиваем панель, чтобы
  // было видно, что нажатие принято, и ждём сервер.
  var hit = svgCache[Q()];
  if (hit) {
    applySvg(hit.svg, ++reqSeq);
    // Картинка могла пролежать долго - пусть остаётся притушенной, пока
    // не придёт свежая: старое значение не должно выглядеть текущим.
    if (Date.now() - hit.at > EVERY * 3) host.classList.add('wait');
  } else {
    host.classList.add('wait');
  }
  refresh(true);
  restartPoll();
}

function Q(){
  var parts = [];
  // кнопки страницы - в шапке картинки (1.44); витрине тем они не нужны
  if (!DEMO) parts.push('nav=' + NAV_S);
  if (COLS) parts.push('cols=' + COLS);
  if (THEME) parts.push('theme=' + THEME);
  if (MODE) parts.push('mode=' + MODE);
  if (oneOpen()) {
    if (OPENED) parts.push('open=' + encodeURIComponent(OPENED));
  } else if (FOLDED.length) {
    parts.push('closed=' + FOLDED.map(encodeURIComponent).join(','));
  }
  return parts.length ? ('?' + parts.join('&')) : '';
}

/* Ссылка «назад» тоже должна нести выбранное число колонок: на широком
   экране незачем терять раскладку из-за перехода на соседнюю панель. */
function fixBack(){
  var b = document.getElementById('back');
  if (!b) return;
  if (BACK_TO) {
    b.href = BACK_TO + '.html' + Q();
    b.textContent = '← ' + decodeURIComponent(BACK_TO);
  } else {
    b.href = './' + Q();
  }
}

/* Выбор колонок свёрнут в одну кнопку «3 ▾»: полный ряд из девяти
   вариантов шириной в треть экрана закрывал шапку и чипы. Нажатие
   раскрывает ряд, выбор или пять секунд без выбора - сворачивают. */
var colsOpen = '', colsTimer = null;   // '' - свёрнуто, 'cols' или 'theme'
function themeName(v){
  for (var i = 0; i < THEMES.length; i++) if (THEMES[i][0] === v) return THEMES[i][1];
  return v;
}
function modeName(v){
  for (var i = 0; i < MODES.length; i++) if (MODES[i][0] === v) return MODES[i][1];
  return v;
}
function drawCols(){
  fixBack();
  var box = document.getElementById('cols'), html = '';
  if (!colsOpen) {
    html = '<b class="cur" data-open="cols">' + (COLS === '' ? 'авто' : COLS)
         + ' кол. ▾</b><b class="cur" data-open="theme">'
         + (THEME ? themeName(THEME) : 'тема') + ' ▾</b>';
    // Вид разделов - только у панели с разделами.
    if (HAS_SECTIONS)
      html += '<b class="cur" data-open="mode">' + (MODE ? modeName(MODE) : 'вид') + ' ▾</b>';
  } else if (colsOpen === 'mode') {
    for (var m = 0; m < MODES.length; m++) {
      html += '<b data-m="' + MODES[m][0] + '"' + (MODES[m][0] === MODE ? ' class="on"' : '')
            + '>' + MODES[m][1] + '</b>';
    }
  } else if (colsOpen === 'cols') {
    var opts = ['', '2', '3', '4', '5', '6', '7', '8', '9'];
    for (var i = 0; i < opts.length; i++) {
      var v = opts[i];
      html += '<b data-v="' + v + '"' + (v === COLS ? ' class="on"' : '') + '>'
            + (v === '' ? 'авто' : v) + '</b>';
    }
  } else {
    for (var k = 0; k < THEMES.length; k++) {
      html += '<b data-t="' + THEMES[k][0] + '"' + (THEMES[k][0] === THEME ? ' class="on"' : '')
            + '>' + THEMES[k][1] + '</b>';
    }
    // Все темы на всех плитках и пультах - страница /themes (с 1.28).
    html += '<b data-go="themes">все темы…</b>';
  }
  box.innerHTML = html;

   работает долгое нажатие. Обратная сторона: браузер не отсеивает за нас
   касания, которые нажатиями не были.

   сдвига не превышен, отмены не было - для плитки это обычное короткое
   нажатие, и выключатель щёлкал. Поэтому помним, когда страница или
   оверлей последний раз прокручивались: прокрутка перед касанием или во
   время него означает, что человек листал, а не нажимал.

   Касание сразу после закрытия оверлея. Окно закрылось, панель тут же
   снова принимает касания - и второе касание, или запоздалые события
   браузера от первого, уходят в плитку под пальцем. Поэтому пока окно

/* Старые браузеры без PointerEvent (Android WebView до Chrome 55). Там
   плитки слушают и касания, и мышь, а браузер после каждого касания
   досылает «мышиные» mousedown/mouseup в ту же точку. Нажатие
   отрабатывало дважды: выключатель щёлкал туда и обратно, окно
   протечки или списка открывалось и тут же закрывалось - запоздалый
   mousedown приходился уже на фон окна. Мышиные события сразу после

   попадаю по заголовку». Отложенная картинка ставится сразу после

/* ---- форма темы в пультах (с 1.35) ----

function hexRgb(h){

function gearD(cx, cy, r, k, edge){
  var tth = 6 * k, pts = [], i;
  function p(rad, a){ pts.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1)); }
  if(edge === 'smooth'){
    var rs = r - tth * 0.2;
    return 'M' + (cx - rs).toFixed(1) + ',' + cy.toFixed(1) + 'a' + rs.toFixed(1) + ',' + rs.toFixed(1) +
           ' 0 1 0 ' + (2 * rs).toFixed(1) + ',0a' + rs.toFixed(1) + ',' + rs.toFixed(1) + ' 0 1 0 ' + (-2 * rs).toFixed(1) + ',0z';

    var ro = r - tth * 0.2, dp = 1.8 * k, n2 = Math.max(36, Math.round(2 * Math.PI * ro / (4.4 * k)));
    for(i = 0; i < 2 * n2; i++) p(ro - (i % 2 ? dp : 0), Math.PI * i / n2);

    + '<radialGradient id="' + id + 'hl"><stop offset=".7" stop-color="' + F.neu + '" stop-opacity=".95"/>'
    + '<stop offset="1" stop-color="' + F.neu + '" stop-opacity="0"/></radialGradient>'
    + '<linearGradient id="' + id + 'gl" x1="0" y1="0" x2="1" y2="1">'

/* Ручка целиком: тени по глубине, тело с краем, слой фаски. */
function knobSVG(id, cx, cy, r, k, face, stroke, F, dy){
  var h = '', o = (dy * 1.3 + 2).toFixed(1), rr = (r * 1.14).toFixed(1);
  if(F.depth === 'neumo'){
    h += '<circle cx="' + (cx - o) + '" cy="' + (cy - o) + '" r="' + rr + '" fill="url(#' + id + 'hl)"/>'
       + '<circle cx="' + (cx + +o) + '" cy="' + (cy + +o) + '" r="' + rr + '" fill="url(#' + id + 'sh)"/>';

  var d = gearD(cx, cy, r, k, F.edge);

  ov.classList.toggle('flat', fm.depth === 'flat');
  ov.classList.toggle('bev-none', fm.bevel === 'none');
  ov.classList.toggle('bev-sharp', fm.bevel === 'sharp');
  if(ov.style.setProperty){
    var nl = hexRgb(fm.neu), nd = hexRgb(fm.shd);
    ov.style.setProperty('--neu-l', 'rgba(' + nl.join(',') + ',.9)');
    ov.style.setProperty('--neu-d', 'rgba(' + nd.join(',') + ',.75)');
    ov.style.setProperty('--ovbg', PAGE_BG[rootTheme()] || '#101012');
  }
  // у стекла (1.40) под окном - те же обои, что под панелью
  ov.style.background = PAGE_WALL[rootTheme()] || PAGE_BG[rootTheme()] || '#101012';
  // Прежний заголовок-строка (.ttl) - та же шапка, что у пультов: «назад»
  // слева, название рядом. Так выход во всех окнах один и тот же (1.35).
  nodes = nodes.map(function(n){
    return n.classList && n.classList.contains('ttl') ? padHead(n.textContent) : n; });
  ov.classList.toggle('hashead', nodes.some(function(n){
    return n.classList && n.classList.contains('phead'); }));
  // Своя кнопка «назад» есть у пульта телевизора; остальным окнам без
  // шапки - круглая «назад» слева сверху, там же, где в шапке (с 1.35).
  ov.classList.toggle('ownback', nodes.some(function(n){
    return n.classList && n.classList.contains('tvx'); }));
  while(ov.children.length>1) ov.removeChild(ov.lastChild);
  nodes.forEach(function(n){ ov.appendChild(n); });
  ov.classList.add('open'); paused=true;
  hintsUnderInfo();
  if(!ovHist && !STILL && window.history && history.pushState){
    try { history.pushState({ov: 1}, ''); ovHist = true; } catch(e) {}
  }
  // Фон окна закрывает только касание, начатое на нём уже после открытия.
  ovDownBg = false;
  // Нажатие по плитке, которое открыло окно, своё отработало: его таймер
  // долгого нажатия не должен сработать уже поверх окна.
  if(press){ clearTimeout(press.timer); press = null; }
  host.classList.add('shield');
  document.documentElement.classList.add('ovlock');
}
function el(tag, cls, text){ var e=document.createElement(tag);
  if(cls) e.className=cls; if(text) e.textContent=text; return e; }

/* Переключатель для пульта. Возвращает объект с текущим состоянием, чтобы
   ползунки знали, надо ли сперва включить прибор. */
/* Ряд «метка − число +».
   Короткое нажатие меняет на шаг, удержание разгоняется: первые полсекунды
   по одному, дальше быстрее. Отправка отложена на 300 мс после последнего
   нажатия - иначе на каждый процент уходила бы своя команда, и прибор
   дёргался бы за пальцем, как штора при перетаскивании. */
function stepRow(label, opts){
  var row = el('div', 'step');
  var lab = el('span', 'lab', label);
  var minus = el('button'), num = el('span', 'num'), plus = el('button');
  minus.textContent = '−'; plus.textContent = '+';
  // Кнопки рядом, а не по краям числа: большой палец дотягивается до обеих
  // не переставляя руку, и подкрутить на пару процентов можно одной рукой.
  var keys = el('div', 'keys');
  keys.appendChild(minus); keys.appendChild(plus);
  row.appendChild(lab); row.appendChild(num); row.appendChild(keys);

  function paint(){ num.textContent = opts.read() + (opts.unit || ''); }
  paint();
  opts.paint = paint;
  stepKeys(minus, plus, opts);
  row.repaint = paint;
  row.el = row;
  return row;
}


/* Кнопки шага − / +: короткое нажатие - шаг, удержание разгоняется.
   Отправка отложена на 300 мс после последнего нажатия. Общая для ряда
   «метка − число +» и для кнопок вокруг шара и ручки (1.23). */
function stepKeys(minus, plus, opts){
  var lo = opts.min === undefined ? 0 : opts.min;
  var hi = opts.max === undefined ? 100 : opts.max;
  var timer = null, hold = null, pending = null;
  function flush(){
    pending = null;
    Promise.resolve(opts.send()).catch(function(e){
      flash('Не удалось: ' + e.message);
    });
  }
  function bump(d){
    var v = Math.max(lo, Math.min(hi, opts.read() + d));
    if(v === opts.read()) return;
    opts.write(v);
    if(opts.paint) opts.paint();
    if(pending) clearTimeout(pending);
    pending = setTimeout(flush, opts.delay || 300);
  }
  function press(d, elm){
    return function(ev){
      ev.preventDefault();
      elm.classList.add('down');
      bump(d);
      var fast = 0;
      hold = setTimeout(function(){
        timer = setInterval(function(){
          fast += 1;
          bump(d * (fast > 8 ? 5 : 1));
        }, 110);
      }, 500);
    };
  }
  function release(){
    if(hold) clearTimeout(hold);
    if(timer) clearInterval(timer);
    hold = timer = null;
    minus.classList.remove('down'); plus.classList.remove('down');
  }
  var st = opts.step || 1;
  ['mousedown','touchstart'].forEach(function(e){
    minus.addEventListener(e, press(-st, minus), {passive:false});
    plus.addEventListener(e, press(st, plus), {passive:false});
  });
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(e){
    minus.addEventListener(e, release);
    plus.addEventListener(e, release);
  });
}

/* Шапка пульта (1.23), как у кондиционера: «назад» слева, название и
   состояние посередине, питание справа. Крестик окна при ней не нужен. */
var HICON = {
  back:  '<path d="M15 5l-7 7 7 7"/>',
  power: '<path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>',
  info:  '<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6v.1"/>'
};
/* Кнопка «i» (с 1.35): пояснения на весь экран не на виду, а по нажатию.
   Выбор помнится до перезагрузки страницы. */
var INFO_OPEN = false;
function infoBtn(onToggle){
  var b = hbtn('hinfo' + (INFO_OPEN ? ' on' : ''), hsvg(HICON.info));
  b.onclick = function(){
    INFO_OPEN = !INFO_OPEN; b.classList.toggle('on', INFO_OPEN); onToggle(INFO_OPEN);

/* Подсказки пультов («Крутите шар…») - под «i» в шапке. Окно без шапки
   показывает их, как раньше. */
function hintsUnderInfo(){
  var head = ov.querySelector('.phead');

function hbtn(cls, html, fn){

}
function hsvg(path){ return '<svg viewBox="0 0 24 24">' + path + '</svg>'; }
function padHead(title, power){
  var h = el('div', 'phead');
  h.appendChild(hbtn('', hsvg(HICON.back), function(){ closeOv(); }));
  var nm = el('div', 'phname');
  nm.appendChild(el('div', 'phttl', title || ''));
  var sub = el('div', 'phsub');
  nm.appendChild(sub);
  h.appendChild(nm);
  h.appendChild(power || hbtn('ghost'));

  return h;

function powerRow(node, round){
  var st = {on: node.getAttribute('data-state') === '1'};
  // round - круглая кнопка для шапки пульта (1.23), иначе прежняя плашка
  var row = round ? hbtn('hpw', hsvg(HICON.power)) : el('div', 'pw');
  var led = el('span', 'led'), label = el('span');
  if(!round){ row.appendChild(led); row.appendChild(label); }
  function paint(){
    row.classList.toggle('on', st.on);
    if(!round) label.textContent = st.on ? 'Включено' : 'Выключено';
    if(st.onPaint) st.onPaint();
  }
  paint();
  row.onclick = function(){
    var topic = node.getAttribute('data-topic');
    if(!topic) return;
    var next = !st.on;
    pub(topic, next ? node.getAttribute('data-on') : node.getAttribute('data-off'))
      .then(function(){ st.on = next; paint(); })
      .catch(function(e){ flash('Не удалось: ' + e.message); });
  };
  st.el = row;
  // включить прибор, если крутят яркость у выключенного
  st.ensureOn = function(){
    var topic = node.getAttribute('data-topic');
    if(st.on || !topic) return Promise.resolve();
    return pub(topic, node.getAttribute('data-on')).then(function(){
      st.on = true; paint();
    });
  };
  return st;
}

/* ---------- график на весь экран ---------- */
/* График по нажатию на чип строки состояния.
   Плитки под ним нет, поэтому картинку собирает отдельный маршрут
   /chart.svg по имени канала. Диапазон переключается кнопками: смотреть
   движение за трое суток и за полчаса нужно по-разному. */
function chartOv(node){
  var channel = node.getAttribute('data-chart');
  var title = node.getAttribute('data-chart-title') || '';
  var unit = node.getAttribute('data-unit') || '';
  var range = '12h';

  var card = el('div','card'); card.textContent = '…';
  var row = el('div','crow');
  var head = padHead(title, infoBtn(function(){ load(); }));

  function url(){
    var w = Math.min(Math.round(window.innerWidth * 0.90), 1400);
    var h = Math.min(Math.round(window.innerHeight * 0.55), 800);
    return 'chart.svg?channel=' + encodeURIComponent(channel) +
           '&range=' + range + '&w=' + w + '&h=' + h +
           '&unit=' + encodeURIComponent(unit) +
           '&title=' + encodeURIComponent(title) + themeQ() + (INFO_OPEN ? '&info=1' : '') +
           '&t=' + Date.now();
  }
  function load(){
    fetch(url(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(svg){
        if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
        card.innerHTML = svg;
      })
      .catch(function(e){ card.textContent = 'Не удалось: ' + e.message; });
  }
  var buttons = {};
  ['30m','6h','12h','3d'].forEach(function(r){
    var b = el('span','cbtn', r);
    b.onclick = function(){
      range = r;
      for(var k in buttons){ buttons[k].className = 'cbtn'; }
      b.className = 'cbtn on';
      load();
    };
    if(r === range) b.className = 'cbtn on';
    buttons[r] = b;
    row.appendChild(b);
  });

  openOv([head, card, row]);
  if(!ov.offsetHeight){ closeOv(); window.open(url(), '_blank'); return; }
  load();
}

function expand(node){
  // Фанкойл (с 1.42): короткое нажатие открывает тот же пульт, что и долгое.
  if(node.getAttribute('data-kind') === 'fancoil' && node.getAttribute('data-look') !== 'classic')
    return padFancoil(node);
  var i = node.getAttribute('data-i');
  // 40 px - поля самого оверлея (18 с каждой стороны) плюс запас на
  // полосу прокрутки. Раньше просили 90% ширины и получали заметные
  // пустые поля по бокам вдобавок к рамке карточки.
  var w = Math.min(Math.max(window.innerWidth - 40, 280), 1600);
  var h = Math.min(Math.round(window.innerHeight * 0.62), 900);
  // Шапка - как у пультов (с 1.35): «назад» слева, у графика справа «i»
  // с зонами и пояснениями. Подсказка «нажмите вне карточки» больше не нужна.
  h = Math.min(Math.round(window.innerHeight * 0.62) - 20, 900);
  var chart = node.getAttribute('data-kind') === 'chart';
  function url(){
    return 'tile/' + encodeURIComponent(NAME) + '/' + i + '.svg?w=' + w + '&h=' + h + themeQ() +
           (chart && INFO_OPEN ? '&info=1' : '');
  }
  var card = el('div','card wide');
  card.textContent = '…';
  var head = padHead(node.getAttribute('data-title') || '', chart ? infoBtn(function(){ load(); }) : null);
  // Плитка, у которой короткое нажатие раскрывает картинку, а пульт висит
  // на долгом: органы управления идут прямо сюда, под карточку. Иначе
  // раскрытый фанкойл - красивая картинка, которой нельзя управлять.
  var parts = [head, card];
  if(node.getAttribute('data-pad') === 'ac') parts = parts.concat(acControls(node));
  openOv(parts);
  // если оверлей по какой-то причине не показался, откроем картинку отдельно
  if(!ov.offsetHeight){ closeOv(); window.open(url(), '_blank'); return; }
  function load(){
    fetch(url(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(svg){
        if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
        card.innerHTML = svg;
      })
      .catch(function(e){
        card.textContent = 'Не удалось: ' + e.message;
        flash('Полный экран: ' + e.message);
      });
  }
  load();
}

/* ---------- пульт ленты: X - температура, Y - яркость ---------- */
/* ---------- пульт ленты: шар (с 1.18) ----------
   Шар светится цветом ленты и покрыт сотами. Провести вверх-вниз - шар
   поворачивается, яркость меняется; влево-вправо - теплота. Толчок -
   катится по инерции и замедляется, на краю шкалы упирается. Команда
   уходит, когда шар остановился. Ниже - шаг числом и питание, как было. */
var SPH = null;
function sphereGeo(F){
  if (SPH && SPH.F === F) return SPH;
  var p = (1 + Math.sqrt(5)) / 2;
  var I = [[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],[0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],[p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]];
  var T = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
           [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  function nrm(v){ var n = Math.hypot(v[0], v[1], v[2]); return [v[0]/n, v[1]/n, v[2]/n]; }
  var V = [], key = {}, tris = [];
  function vid(v){ v = nrm(v); var k = v.map(function(x){ return x.toFixed(5); }).join(','); if (key[k] === undefined){ key[k] = V.length; V.push(v); } return key[k]; }
  T.forEach(function(t){
    var A = I[t[0]], B = I[t[1]], C = I[t[2]], g = [], i, j;
    for (i = 0; i <= F; i++){ g.push([]); for (j = 0; j <= F - i; j++)
      g[i].push(vid([0,1,2].map(function(k){ return A[k] + (B[k]-A[k])*i/F + (C[k]-A[k])*j/F; }))); }
    for (i = 0; i < F; i++) for (j = 0; j < F - i; j++){
      tris.push([g[i][j], g[i+1][j], g[i][j+1]]);
      if (j < F - i - 1) tris.push([g[i+1][j], g[i+1][j+1], g[i][j+1]]);
    }
  });
  var C = tris.map(function(t){ return nrm([0,1,2].map(function(k){ return V[t[0]][k] + V[t[1]][k] + V[t[2]][k]; })); });
  var adj = V.map(function(){ return []; });
  tris.forEach(function(t, k){ t.forEach(function(v){ adj[v].push(k); }); });
  var cells = V.map(function(d, vi){
    var u = Math.abs(d[0]) < .9 ? [1,0,0] : [0,1,0];
    var e1 = nrm([d[1]*u[2]-d[2]*u[1], d[2]*u[0]-d[0]*u[2], d[0]*u[1]-d[1]*u[0]]);
    var e2 = [d[1]*e1[2]-d[2]*e1[1], d[2]*e1[0]-d[0]*e1[2], d[0]*e1[1]-d[1]*e1[0]];
    function a(k){ var c = C[k]; return Math.atan2(c[0]*e2[0]+c[1]*e2[1]+c[2]*e2[2], c[0]*e1[0]+c[1]*e1[1]+c[2]*e1[2]); }
    return { c: vi, ring: adj[vi].slice().sort(function(x, y){ return a(x) - a(y); }) };
  });
  SPH = { F: F, V: V, C: C, cells: cells };
  return SPH;
}

function padSphere(node){
  var PITCH = 2.6, YAW = 3.2;     // те же, что в skeuo.py
  var x = parseFloat(node.getAttribute('data-dot-x') || '0.5');        // 0 холодный - 1 тёплый
  var lvl = 1 - parseFloat(node.getAttribute('data-dot-y') || '0.5');  // яркость
  var hasTemp = !!node.getAttribute('data-temp');
  var on = node.getAttribute('data-state') === '1';
  var rot = { x: (x - .5) * YAW, y: -(lvl - .5) * PITCH };
  function hex(c){ c = (c || '#888888').replace('#', ''); return [0, 2, 4].map(function(i){ return parseInt(c.substr(i, 2), 16); }); }
  var COLD = hex(node.getAttribute('data-cold') || '#56AAFF'), WARM = hex(node.getAttribute('data-warm') || '#FF9337');
  var MID = [236, 230, 220], PAL = ovPal(), FM = FORM();
  // Тень шара и «стекло» выключенного: в светлой теме - светло-серые,
  // тёмный шар на светлом поле выглядел дырой.
  var DARK = PAL.lt ? [92, 94, 102] : [20, 21, 24], BASE = PAL.lt ? [206, 207, 212] : [46, 47, 52];
  function mix(a, b, f){ return a.map(function(v, i){ return v + (b[i] - v) * f; }); }
  function css(a, al){ return 'rgba(' + a.map(Math.round).join(',') + ',' + (al === undefined ? 1 : al) + ')'; }
  function hue(t){ return t < .5 ? mix(COLD, MID, t * 2) : mix(MID, WARM, (t - .5) * 2); }

  /* С 1.23: шапка как у кондиционера (назад, название, питание), кнопки
     − / + вокруг шара вместо подписей: вверх-вниз - яркость, влево-вправо
     - теплота, как и сам жест. Проценты - строкой под шаром. */
  var side = Math.round(Math.min(window.innerWidth * 0.94, window.innerHeight * 0.56, 460));
  var box = el('div', 'stagebox');
  box.style.width = side + 'px'; box.style.height = side + 'px';
  var stage = el('div'); stage.id = 'sphstage';
  stage.style.width = side + 'px'; stage.style.height = side + 'px';
  var cv = document.createElement('canvas'); stage.appendChild(cv);
  box.appendChild(stage);
  var hint = el('div', 'hint', 'Крутите шар: вверх-вниз — яркость, влево-вправо — теплота');
  var power = powerRow(node, true);
  var head = padHead(node.getAttribute('data-title') || 'Подсветка', power.el);
  var vals = el('div', 'vals'), vB = el('div'), vT = el('div');
  vals.appendChild(vB); if (hasTemp) vals.appendChild(vT);
  function paintVals(){
    vB.innerHTML = '<small>яркость</small>' + Math.round(lvl * 100) + ' %';
    if (hasTemp) vT.innerHTML = '<small>теплота</small>' + Math.round(x * 100) + ' %';
    head.sub.textContent = power.on ? 'Включено' : 'Выключено';
  }
  power.onPaint = paintVals;
  // Кнопки на окружности за шкалами: те же r и R, что в draw().
  var GR = side * .27, GRR = GR + Math.max(11, GR * .12), GB = GRR + 31;
  function ringBtn(cls, deg, text){
    var b = hbtn('at' + (cls ? ' ' + cls : ''), '', null);
    b.textContent = text;
    var a = deg * Math.PI / 180;
    b.style.left = (side / 2 + GB * Math.cos(a)).toFixed(1) + 'px';
    b.style.top = (side / 2 + GB * Math.sin(a)).toFixed(1) + 'px';
    box.appendChild(b); return b;
  }
  var bPlus = ringBtn('', 270, '+'), bMinus = ringBtn('', 90, '−');
  stepKeys(bMinus, bPlus, {
    read:  function(){ return Math.round(lvl * 100); },
    write: function(v){ touched = true; rot.y -= (v / 100 - lvl) * PITCH; lvl = v / 100; draw(); },
    send:  function(){ return send(); },
    paint: paintVals
  });
  if (hasTemp){
    var tMinus = ringBtn('cold', 150, '−'), tPlus = ringBtn('warm', 30, '+');
    stepKeys(tMinus, tPlus, {
      read:  function(){ return Math.round(x * 100); },
      write: function(v){ touched = true; rot.x += (v / 100 - x) * YAW; x = v / 100; draw(); },
      send:  function(){ return send(); },
      paint: paintVals
    });
  }
  paintVals();
  openOv([head, box, vals, hint]);

  function draw(){
    var dpr = window.devicePixelRatio || 1, W = side, H = side;
    if (cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    var g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    var cx = W / 2, cy = H / 2, r = W * .27, lit = power.on || touched;
    /* Выключенный шар не серый: в нём видно, каким цветом лента
       загорится, - бледно, без свечения. */
    var lv = lit ? lvl : 0, h = hue(x);
    var c = lit ? mix(PAL.lt ? BASE : DARK, h, .18 + .82 * lvl) : mix(BASE, h, PAL.lt ? .6 : .4);
    if (lit){
      var hr = Math.min(r * (1.45 + .5 * lv), W / 2 * .98);
      var halo = g.createRadialGradient(cx, cy, r * .7, cx, cy, hr);
      halo.addColorStop(0, css(h, .5 * lv)); halo.addColorStop(1, css(h, 0));
      g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, hr, 0, 7); g.fill();
    }
    /* Тень - мягкое пятно под шаром, а не сдвинутый вниз диск: тот
       выглядывал из-под шара резким серпом. */
    var shR = r * 1.16;
    if (FM.depth === 'neumo'){
      // неоморфизм: светлая тень сверху-слева, тёмная снизу-справа (1.35)
      var o = r * .09;
      [[-o, FM.neu, .9], [o, FM.shd, .75]].forEach(function(q){
        var gr = g.createRadialGradient(cx + q[0], cy + q[0], r * .82, cx + q[0], cy + q[0], shR);
        var c0 = hexRgb(q[1]);
        gr.addColorStop(0, 'rgba(' + c0.join(',') + ',' + q[2] + ')'); gr.addColorStop(1, 'rgba(' + c0.join(',') + ',0)');
        g.fillStyle = gr; g.beginPath(); g.arc(cx + q[0], cy + q[0], shR, 0, 7); g.fill();
      });
    } else if (FM.depth !== 'flat'){
      var sh = g.createRadialGradient(cx, cy + r * .07, r * .82, cx, cy + r * .07, shR);
      sh.addColorStop(0, PAL.lt ? 'rgba(0,0,0,.16)' : 'rgba(0,0,0,.45)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = sh; g.beginPath(); g.arc(cx, cy + r * .07, shR, 0, 7); g.fill();

    body.addColorStop(0, css(mix(c, [255,255,255], lit ? .25 * lv : (PAL.lt ? .45 : .18))));
    body.addColorStop(.6, css(mix(c, DARK, .25)));
    body.addColorStop(1, css(mix(c, DARK, PAL.lt ? .6 : .78)));
    g.fillStyle = body; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    // соты
    var G = sphereGeo(9), cyw = Math.cos(rot.x), syw = Math.sin(rot.x), cp = Math.cos(rot.y), sp = Math.sin(rot.y);
    function P(v){ var X = v[0]*cyw + v[2]*syw, Z = -v[0]*syw + v[2]*cyw; return [X, v[1]*cp - Z*sp, v[1]*sp + Z*cp]; }
    var pc = G.C.map(P), pv = G.V.map(P), path = new Path2D();
    G.cells.forEach(function(cell){
      if (pv[cell.c][2] < .03) return;
      for (var k = 0; k < cell.ring.length; k++) if (pc[cell.ring[k]][2] < 0) return;
      cell.ring.forEach(function(i, k){ var q = pc[i]; if (k) path.lineTo(cx + q[0]*r, cy - q[1]*r); else path.moveTo(cx + q[0]*r, cy - q[1]*r); });
      path.closePath();
    });
    g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.clip();
    g.lineJoin = 'round'; g.lineWidth = Math.max(.6, r / 160);
    g.strokeStyle = css(mix(c, DARK, .5), lit ? .45 : .3); g.stroke(path);
    var rim = g.createRadialGradient(cx, cy, r * .55, cx, cy, r);
    rim.addColorStop(0, css(DARK, 0)); rim.addColorStop(1, css(DARK, PAL.lt ? .35 : .55));
    g.fillStyle = rim; g.fillRect(cx - r, cy - r, 2 * r, 2 * r); g.restore();
    var spc = g.createRadialGradient(cx - r * .36, cy - r * .42, 0, cx - r * .36, cy - r * .42, r * .42);
    spc.addColorStop(0, 'rgba(255,255,255,' + (lit ? .55 : (PAL.lt ? .6 : .25)) + ')'); spc.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = spc; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    g.strokeStyle = PAL.lt ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.14)'; g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
    // шкалы: слева яркость, снизу теплота
    var R = r + Math.max(11, r * .12), sw = Math.max(3, r * .035), B0 = 165, B1 = 255, T0 = 140, T1 = 40;
    function rad(d){ return d * Math.PI / 180; }

    g.strokeStyle = PAL.track; g.beginPath(); g.arc(cx, cy, R, rad(B0), rad(B1)); g.stroke();
    g.strokeStyle = lit ? PAL.acc : PAL.offKnob; g.beginPath(); g.arc(cx, cy, R, rad(B0), rad(B0 + (B1 - B0) * lvl)); g.stroke();
    for (var i = 0; i < 22; i++){
      var f = i / 21, a = rad(T0 - (T0 - T1) * f);

      g.beginPath(); g.arc(cx + R * Math.cos(a), cy + R * Math.sin(a), sw * .7, 0, 7); g.fill();
    }
    [T0 - (T0 - T1) * x, B0 + (B1 - B0) * lvl].forEach(function(d){
      var a = rad(d);
      g.fillStyle = lit ? PAL.knob : PAL.offKnob; g.strokeStyle = PAL.knobEdge; g.lineWidth = 2;
      g.beginPath(); g.arc(cx + R * Math.cos(a), cy + R * Math.sin(a), sw * 1.7, 0, 7); g.fill(); g.stroke();
    });
  }

  var timer = null;
  function send(){
    var bmax = parseFloat(node.getAttribute('data-bright-max') || '100');
    var jobs = [pub(node.getAttribute('data-bright'), Math.round(lvl * bmax))];
    var tTopic = node.getAttribute('data-temp');
    if (tTopic){
      var unit = node.getAttribute('data-temp-unit');
      var tmax = parseFloat(node.getAttribute('data-temp-max') || '100');
      var lo = parseFloat(node.getAttribute('data-temp-lo') || '2700');
      var hi = parseFloat(node.getAttribute('data-temp-hi') || '6500');
      jobs.push(pub(tTopic, unit === 'percent' ? Math.round((1 - x) * tmax) : Math.round(hi - x * (hi - lo))));
    }
    return power.ensureOn()
      .then(function(){ return Promise.all(jobs); })
      .then(function(){ draw(); })
      .catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  function later(){ clearTimeout(timer); timer = setTimeout(send, 250); }

  function clamp(v){ return Math.max(0, Math.min(1, v)); }
  function move(ax, ay){
    var nx = clamp(x + (hasTemp ? ax / YAW : 0)), nl = clamp(lvl - ay / PITCH);
    rot.x += (nx - x) * YAW; rot.y -= (nl - lvl) * PITCH;
    x = nx; lvl = nl;
    draw(); paintVals();
  }
  var anim = null, vel = { x: 0, y: 0 }, last = null, touched = false;
  // крутят выключенную - на шаре сразу видно, каким будет свет
  function begin(ev){
    touched = true;
    cancelAnimationFrame(anim); clearTimeout(timer);
    var p = evPoint(ev); last = { x: p.clientX, y: p.clientY, t: Date.now() }; vel = { x: 0, y: 0 };

      else { anim = null; later(); }

  power.el.addEventListener('click', function(){ touched = false; setTimeout(draw, 500); });
  draw();
  drag(stage, at, done, begin);
}

function padXY(node){
  if (node.getAttribute('data-look') !== 'classic') return padSphere(node);
  var pad = el('div'); pad.id='pad';
  var side = Math.round(Math.min(window.innerWidth*0.78, window.innerHeight*0.6));
  pad.style.width = side + 'px'; pad.style.height = side + 'px';
  var grad = el('div','grad'), dim = el('div','dim'), dot = el('div','dot');
  grad.style.background = 'linear-gradient(to right,' +
      node.getAttribute('data-cold') + ',' + node.getAttribute('data-warm') + ')';
  pad.appendChild(grad); pad.appendChild(dim); pad.appendChild(dot);
  var title = el('div','ttl', node.getAttribute('data-title') || 'Подсветка');
  var hint = el('div','hint','Слева холодный, справа тёплый · вверх ярче'
                             + ' · стрелками по проценту');
  var power = powerRow(node);
  var x = parseFloat(node.getAttribute('data-dot-x')||'0.5');
  var y = parseFloat(node.getAttribute('data-dot-y')||'0.5');
  function place(){ dot.style.left=(x*100)+'%'; dot.style.top=(y*100)+'%';
    dot.style.background = 'transparent'; }
  place();

  var rows = [];
  var bright = stepRow('Яркость', {
    unit: ' %',
    read:  function(){ return Math.round((1-y)*100); },
    write: function(v){ y = 1 - v/100; place(); },
    send:  function(){ return send(); }
  });
  rows.push(bright);
  // Ось цветовой температуры шагается в процентах, как и яркость: у ленты
  // это доля от холодного к тёплому, а не кельвины прибора. Считать шаг в
  // кельвинах пришлось бы по-разному для percent и kelvin, и на плитке всё
  // равно показана доля.
  var warm = null;
  if(node.getAttribute('data-temp')){
    warm = stepRow('Тёплый', {
      unit: ' %',
      read:  function(){ return Math.round(x*100); },
      write: function(v){ x = v/100; place(); },
      send:  function(){ return send(); }
    });
    rows.push(warm);
  }

  openOv([title, pad].concat(rows, [power.el, hint]));

  function at(ev){
    var r = pad.getBoundingClientRect();
    var p = evPoint(ev);
    x = Math.max(0, Math.min(1, (p.clientX-r.left)/r.width));
    y = Math.max(0, Math.min(1, (p.clientY-r.top)/r.height));
    place();
    bright.repaint();
    if(warm) warm.repaint();
  }
  function send(){
    var bmax = parseFloat(node.getAttribute('data-bright-max')||'100');
    var bright = Math.round((1-y)*bmax);
    var jobs = [pub(node.getAttribute('data-bright'), bright)];
    var tTopic = node.getAttribute('data-temp');
    if(tTopic){
      var unit = node.getAttribute('data-temp-unit');
      var tmax = parseFloat(node.getAttribute('data-temp-max')||'100');
      var lo = parseFloat(node.getAttribute('data-temp-lo')||'2700');
      var hi = parseFloat(node.getAttribute('data-temp-hi')||'6500');
      // слева холодный: x=0 -> hi кельвинов
      var value = (unit === 'percent') ? Math.round((1-x)*tmax)
                                       : Math.round(hi - x*(hi-lo));
      jobs.push(pub(tTopic, value));
    }
    // если лента выключена, сперва включаем - иначе крутить бесполезно
    return power.ensureOn()
      .then(function(){ return Promise.all(jobs); })
      .catch(function(e){ flash('Не удалось: '+e.message); });
  }

}

/* ---------- пульт кондиционера ----------
   Колесо сверху: шкала едет под неподвижной меткой по центру, как в
   приложении. Тянешь влево - значения растут. Ниже режимы, питание и
   скорость вентилятора. */
function padAC(node){
  // С 1.15 у кондиционера колесо как на плитке; у фанкойла с 1.42 - его
  // пульт крупно (ползунок, решётка, клавиши). look: classic - прежние.
  if(node.getAttribute('data-look') !== 'classic'){
    if(node.getAttribute('data-kind') === 'ac') return padDisk(node);
    if(node.getAttribute('data-kind') === 'fancoil') return padFancoil(node);
  }
  return padArc(node);
}

/* ---------- пульт фанкойла на весь экран (с 1.42) ----------
   Картинку рисует сервер (плитка view=pad): шапка, режимы, ползунок,
   решётка, табло, клавиши. Пульт двигает колпачок и сам рисует цифры
   табло, пока ползунок тянут; нажатия - по data-z: back, power, mode, key. */
var SEG7 = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd',
            '6':'afgedc','7':'abc','8':'abcdefg','9':'abcfgd','-':'g'};
function sevenSegSvg(text, x, y, w, h, t, gap){
  var hh = h / 2, k = t / 2, out = '';
  function sk(p){ return (p[0] + (y + h - p[1]) * 0.1).toFixed(1) + ',' + p[1].toFixed(1); }
  function hs(cx, cy){ return [[cx - w/2 + k, cy], [cx - w/2 + t, cy - k], [cx + w/2 - t, cy - k],
                               [cx + w/2 - k, cy], [cx + w/2 - t, cy + k], [cx - w/2 + t, cy + k]]; }
  function vs(cx, cy){ return [[cx, cy - hh/2 + k], [cx + k, cy - hh/2 + t], [cx + k, cy + hh/2 - t],
                               [cx, cy + hh/2 - k], [cx - k, cy + hh/2 - t], [cx - k, cy - hh/2 + t]]; }
  for(var i = 0; i < text.length; i++){
    var ch = text.charAt(i);
    if(ch === '.'){
      out += '<circle cx="' + (x - gap / 2 + 1).toFixed(1) + '" cy="' + (y + h).toFixed(1) + '" r="' + (t * .62).toFixed(1) + '" class="fcp-ink"/>';
      x += 5; continue;
    }
    var cx = x + w / 2, sh = {a: hs(cx, y), g: hs(cx, y + hh), d: hs(cx, y + h),
      f: vs(x, y + hh / 2), b: vs(x + w, y + hh / 2), e: vs(x, y + hh * 1.5), c: vs(x + w, y + hh * 1.5)};
    'abcdefg'.split('').forEach(function(n){
      out += '<polygon points="' + sh[n].map(sk).join(' ') + '" class="' + ((SEG7[ch] || '').indexOf(n) >= 0 ? 'fcp-ink' : 'fcp-ghost') + '"/>';
    });
    x += w + gap;
  }
  return out;
}
function padFancoil(node){
  var wrap = el('div', 'acscreen');
  wrap.textContent = '…';
  openOv([wrap]);
  ov.classList.add('full');
  var reloadT = null, busy = false, wired = false, G = null, D = null, gest = null;
  var PADMAX = 722;
  function size(){
    var w = Math.max(240, Math.min(Math.round(window.innerWidth), PADMAX));
    var h = Math.max(200, Math.min(Math.round(window.innerHeight), PADMAX));
    var boxed = w < window.innerWidth - 1 || h < window.innerHeight - 1;
    wrap.classList.toggle('boxed', boxed);
    wrap.style.width = boxed ? w + 'px' : '';
    wrap.style.height = boxed ? h + 'px' : '';
    return [w, h];
  }
  function url(){
    var sz = size();
    return 'tile/' + encodeURIComponent(NAME) + '/' + node.getAttribute('data-i')
         + '.svg?w=' + sz[0] + '&h=' + sz[1] + '&view=pad' + themeQ();
  }
  function load(){
    if(busy){ schedule(800); return; }
    fetch(url() + '&t=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(svg){
        if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
        if(busy){ schedule(800); return; }
        wrap.innerHTML = svg;
        var root = wrap.querySelector('svg');
        if(root){ root.setAttribute('width', '100%'); root.setAttribute('height', '100%'); }
        wire();
      })
      .catch(function(e){ if(!G) wrap.textContent = 'Не удалось: ' + e.message; });
  }
  function schedule(ms){ clearTimeout(reloadT); reloadT = setTimeout(load, ms || 1500); }
  var onResize = function(){ schedule(250); };
  window.addEventListener('resize', onResize);
  ovCleanup = function(){ window.removeEventListener('resize', onResize); clearTimeout(reloadT); ov.classList.remove('full'); };
  load();

  function num(a){ return parseFloat(G.getAttribute('data-' + a)); }
  function wire(){
    G = wrap.querySelector('[data-fcpad]');
    if(!G) return;
    D = {top: num('top'), bot: num('bot'), smin: num('smin'), smax: num('smax'), lo: num('lo'), hi: num('hi'),
         step: num('step') || 0.5, cur: num('cur'), cap: num('cap'), t: num('target'),
         seg: (G.getAttribute('data-seg') || '').split(',').map(parseFloat), on: G.getAttribute('data-on') === '1'};
    if(!wired){ drag(wrap, move, done, begin); wired = true; }
  }
  function local(ev){
    var pt = evPoint(ev), m = G && G.getScreenCTM();
    if(!m) return {x: 0, y: 0};
    var sp = G.ownerSVGElement.createSVGPoint();
    sp.x = pt.clientX; sp.y = pt.clientY;
    return sp.matrixTransform(m.inverse());
  }
  function closest(n, sel){
    while(n && n.nodeType === 1){ if(n.matches ? n.matches(sel) : n.msMatchesSelector(sel)) return n; n = n.parentNode; }
    return null;
  }
  function fy(t){ t = Math.max(D.smin, Math.min(D.smax, t)); return D.bot - (t - D.smin) * (D.bot - D.top) / ((D.smax - D.smin) || 1); }
  function lcdText(t){ return isNaN(t) ? '--.-' : (t >= 99.95 ? String(Math.round(t)) : (Math.round(t * 2) / 2).toFixed(1)); }
  function show(t){
    var y = fy(t), capg = G.querySelector('.fcp-capg');
    if(capg) capg.setAttribute('transform', 'translate(0 ' + (y - D.cap).toFixed(1) + ')');
    var fill = G.querySelector('.fcp-fill');
    if(fill && !isNaN(D.cur)){
      fill.setAttribute('y', Math.min(D.cur, y).toFixed(1));
      fill.setAttribute('height', Math.abs(D.cur - y).toFixed(1));
    }
    var lg = G.querySelector('.fcp-lcdbox .fcp-lcdg');
    if(lg && D.seg.length === 6){
      var old = lg.querySelectorAll('polygon, circle');
      for(var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
      var tmp = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      tmp.innerHTML = sevenSegSvg(lcdText(t), D.seg[0], D.seg[1], D.seg[2], D.seg[3], D.seg[4], D.seg[5]);
      while(tmp.firstChild) lg.insertBefore(tmp.firstChild, lg.firstChild);
    }
  }
  function valueAt(y){
    var t = D.smin + (D.bot - y) * (D.smax - D.smin) / ((D.bot - D.top) || 1);
    t = Math.max(D.lo, Math.min(D.hi, t));
    return Math.round(t / D.step) * D.step;
  }
  function fail(e){ flash('Не удалось: ' + e.message); }
  function begin(e){
    if(!G) return;
    busy = true;
    var p = local(e), z = closest(e.target, '[data-z]');
    gest = {zone: z ? z.getAttribute('data-z') : '', el: z, y0: p.y, moved: false, t: D.t};
  }
  function move(e){
    if(!gest || !G) return;
    var p = local(e);
    if(Math.abs(p.y - gest.y0) > 4) gest.moved = true;
    if(gest.zone === 'slider' && gest.moved){ gest.t = valueAt(p.y); show(gest.t); }
  }
  function done(){
    busy = false;
    var g = gest; gest = null;
    if(!g || !G) return;
    var power = node.getAttribute('data-topic');
    if(g.zone === 'slider'){
      if(!g.moved){ g.t = valueAt(g.y0); show(g.t); }
      var tt = node.getAttribute('data-ac-target');
      if(tt && !isNaN(g.t) && g.t !== D.t){ D.t = g.t; pub(tt, g.t).catch(fail); }
      schedule(1500); return;
    }
    if(g.moved) return;
    if(g.zone === 'back'){ closeOv(); return; }
    if(g.zone === 'power'){
      if(power) pub(power, D.on ? node.getAttribute('data-off') : node.getAttribute('data-on')).catch(fail);
      schedule(700); return;
    }
    if(g.zone === 'mode'){
      var mt = node.getAttribute('data-ac-mode'), jobs = [];
      if(!D.on && power) jobs.push(pub(power, node.getAttribute('data-on')));
      if(mt) jobs.push(pub(mt, g.el.getAttribute('data-v')));
      Promise.all(jobs).catch(fail); schedule(700); return;
    }
    if(g.zone === 'key'){
      var v = g.el.getAttribute('data-v'), ft = node.getAttribute('data-ac-fan'), js = [];
      if(v === 'off'){ if(power && D.on) js.push(pub(power, node.getAttribute('data-off'))); }
      else {
        if(!D.on && power) js.push(pub(power, node.getAttribute('data-on')));
        if(ft) js.push(pub(ft, v));
      }
      Promise.all(js).catch(fail); schedule(700); return;
    }
  }
}

/* ---------- пульт кондиционера на весь экран (с 1.16) ----------
   Картинку рисует сервер - плитка в виде pad во весь размер окна, своя
   раскладка для телефона стоя, на боку и квадратной панели. Пульт только
   разбирает жесты. Что под пальцем, решает точка касания (data-z):
   колесо крутит уставку, кольца вентилятора - скорость, малые колёса -
   жалюзи, «A» в их центре - качание. Шкала при повороте не
   перерисовывается: крутится её группа, пропеллер вертит CSS. */
function padDisk(node){
  var wrap = el('div', 'acscreen');
  wrap.textContent = '…';
  openOv([wrap]);
  ov.classList.add('full');
  var stepV = parseFloat(node.getAttribute('data-ac-step') || '1') || 1;
  var reloadT = null, busy = false, wired = false;
  var G = null, D = null, pos = 0, temp = 0, gest = null;

  /* На ноутбуке пульт во весь экран выглядел плакатом. С 1.23 он не
     больше плитки 4×4 (722 px): на телефоне и планшете на стене это всё
     равно весь экран, на большом мониторе - карточка по центру. */
  var PADMAX = 722;
  function size(){
    var w = Math.max(240, Math.min(Math.round(window.innerWidth), PADMAX));
    var h = Math.max(200, Math.min(Math.round(window.innerHeight), PADMAX));
    var boxed = w < window.innerWidth - 1 || h < window.innerHeight - 1;
    wrap.classList.toggle('boxed', boxed);
    wrap.style.width = boxed ? w + 'px' : '';
    wrap.style.height = boxed ? h + 'px' : '';
    return [w, h];
  }
  function url(){
    var sz = size(), w = sz[0], h = sz[1];
    return 'tile/' + encodeURIComponent(NAME) + '/' + node.getAttribute('data-i')
         + '.svg?w=' + w + '&h=' + h + '&view=pad' + themeQ();
  }
  function load(){
    if(busy){ schedule(800); return; }
    fetch(url() + '&t=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(svg){
        if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
        if(busy){ schedule(800); return; }
        wrap.innerHTML = svg;
        var root = wrap.querySelector('svg');
        if(root){ root.setAttribute('width', '100%'); root.setAttribute('height', '100%'); }
        wire();
      })
      .catch(function(e){ if(!G) wrap.textContent = 'Не удалось: ' + e.message; });
  }
  function schedule(ms){ clearTimeout(reloadT); reloadT = setTimeout(load, ms || 1500); }
  var onResize = function(){ schedule(250); };
  window.addEventListener('resize', onResize);
  ovCleanup = function(){
    window.removeEventListener('resize', onResize);
    clearTimeout(reloadT);
    ov.classList.remove('full');
  };
  load();

  function num(g, a){ return parseFloat(g.getAttribute('data-' + a)); }
  function wire(){
    G = wrap.querySelector('.acs');
    if(!G) return;
    D = {cx: num(G,'cx'), cy: num(G,'cy'), r: num(G,'r'), rr: num(G,'rr'), dpd: num(G,'dpd'),
         asp: num(G,'asp'), base: num(G,'val'), lo: num(G,'lo'), hi: num(G,'hi'), cur: num(G,'cur'),
         labr: num(G,'labr'), w: num(G,'w'), h: num(G,'h'), fs: num(G,'fs') || 1,
         on: G.getAttribute('data-on') === '1', notarget: G.getAttribute('data-notarget') === '1',
         box: (G.getAttribute('data-box') || '0,0,0,0').split(',').map(parseFloat),
         // колесо линиями (с 1.39): подпись уставки не прячется, а выделяется;
         // кружки вентилятора и жалюзи открывают шторки
         arc: G.getAttribute('data-arc') === '1', wl: num(G,'wl') || num(G,'w')};
    pos = temp = D.base;
    if(!wired){ drag(wrap, move, done, begin); wired = true; }
  }
  function local(ev){
    var pt = evPoint(ev), m = G && G.getScreenCTM();
    if(!m) return {x: 0, y: 0};
    var sp = G.ownerSVGElement.createSVGPoint();
    sp.x = pt.clientX; sp.y = pt.clientY;
    return sp.matrixTransform(m.inverse());
  }
  function pol(r, a){ a = a * Math.PI / 180; return [D.cx + r * Math.cos(a), D.cy + r * Math.sin(a)]; }
  function setCls(n, base, hid){ n.setAttribute('class', base + (hid ? ' acs-hid' : '')); }
  function closest(n, sel){
    while(n && n.nodeType === 1){ if(n.matches ? n.matches(sel) : n.msMatchesSelector(sel)) return n; n = n.parentNode; }
    return null;
  }

  /* ---- колесо уставки ---- */
  function draw(){
    var rot = -(pos - D.base) * D.dpd;
    // шкала и резкая тень зубцов под ней крутятся вместе
    var sc = G.querySelectorAll('.acs-scale');
    for(var si = 0; si < sc.length; si++)
      sc[si].setAttribute('transform', 'rotate(' + rot.toFixed(3) + ' ' + D.cx + ' ' + D.cy + ')');
    var b = D.box, m = 1 * D.fs, i;   // как label_hidden в ac_disk.py
    var labs = G.querySelectorAll('.acs-lab');
    for(i = 0; i < labs.length; i++){
      var t = parseFloat(labs[i].getAttribute('data-t'));
      var p = pol(D.labr, D.asp + (t - pos) * D.dpd);
      if(D.arc){
        setCls(labs[i], 'acs-lab' + (Math.abs(t - temp) < 0.01 && !D.notarget ? ' sel' : ''),
               !(p[0] > 9 && p[0] < D.wl - 9 && p[1] > 9 && p[1] < D.h - 9));
        continue;
      }
      setCls(labs[i], 'acs-lab', Math.abs(t - temp) < 0.01
             || (p[0] > b[0] - m && p[0] < b[2] + m && p[1] > b[1] - m && p[1] < b[3] + m)
             || !(p[0] > 9 && p[0] < D.w - 9 && p[1] > 9 && p[1] < D.h - 9));
    }
    var tks = G.querySelectorAll('.acs-tk');
    for(i = 0; i < tks.length; i++){
      var tt = parseFloat(tks[i].getAttribute('data-t'));
      setCls(tks[i], 'acs-tk', (!D.arc && Math.abs(tt - temp) < 0.01) || tt < D.lo || tt > D.hi);
    }
    // отрезок «сейчас - уставка»; у колеса линиями их три (ореол и линия)
    var segs = G.querySelectorAll('.acs-seg');
    var show = D.on && !D.notarget && !isNaN(D.cur) && Math.abs(D.cur - temp) > 0.05, sd = '';
    if(show){
      var a0 = D.asp + (D.cur - pos) * D.dpd, p0 = pol(D.rr, a0), p1 = pol(D.rr, D.asp);
      sd = 'M ' + p0[0].toFixed(1) + ',' + p0[1].toFixed(1) + ' A ' + D.rr + ',' + D.rr
         + ' 0 0 ' + (D.asp > a0 ? 1 : 0) + ' ' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1);
    }
    for(i = 0; i < segs.length; i++){
      if(show) segs[i].setAttribute('d', sd);
      setCls(segs[i], 'acs-seg', !show);
    }
    var v = G.querySelector('.acs-v');
    if(v) v.textContent = stepV < 1 && Math.abs(temp - Math.round(temp)) > 0.01 ? temp.toFixed(1) : String(Math.round(temp));
  }
  function angle(p){ return Math.atan2(p.y - D.cy, p.x - D.cx) * 180 / Math.PI; }
  function sendTarget(){
    var t = node.getAttribute('data-ac-target');
    if(t) pub(t, temp).catch(function(e){ flash('Не удалось: ' + e.message); });
    schedule(1500);
  }
  function animateTo(t){
    var from = pos, t0 = Date.now(), dur = 260;
    temp = t;
    (function stepA(){
      var k = Math.min(1, (Date.now() - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      pos = from + (t - from) * e; draw();
      if(k < 1) (window.requestAnimationFrame || setTimeout)(stepA, 16);
      else { pos = t; draw(); sendTarget(); }
    })();
  }

  /* ---- вентилятор ---- */
  var FANS = ['low', 'medium', 'high'];
  function fanRing(f, p){
    var d = Math.sqrt(Math.pow(p.x - num(f,'fx'), 2) + Math.pow(p.y - num(f,'fy'), 2));
    var fr = num(f,'fr'), rg = num(f,'rg');
    if(d < fr * 1.1) return 0;
    return Math.max(1, Math.min(3, Math.round((d - fr) / rg)));
  }
  function showFan(f, ring){
    var rings = f.querySelectorAll('[data-ring]');
    for(var i = 0; i < rings.length; i++){
      var k = parseInt(rings[i].getAttribute('data-ring'), 10);
      rings[i].setAttribute('class', 'acs-ring in' + (ring && k <= ring ? ' on' : '') + (!ring ? ' auto' : ''));
      rings[i].setAttribute('stroke-width', f.getAttribute(k === ring ? 'data-swon' : 'data-sw'));
    }
  }
  function setFan(f, ring){
    var topic = node.getAttribute('data-ac-fan'), q = node.getAttribute('data-ac-quiet');
    var state = f.getAttribute('data-state');
    var jobs = [];
    if(ring){
      showFan(f, ring);
      if(topic) jobs.push(pub(topic, FANS[ring - 1]));
      if(state === 'quiet' && q) jobs.push(pub(q, '0'));
      f.setAttribute('data-state', String(ring));
    } else {
      // по центру: авто -> тихо -> авто; со скорости - сразу авто
      showFan(f, 0);
