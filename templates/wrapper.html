<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Запуск без рамки браузера после «Добавить на главный экран».
     mobile-web-app-capable понимают Android-браузеры, apple-* - iOS. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F0F11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>__NAME__</title>
<style>
 /* Страница обычная и прокручиваемая. Раньше тут была раскладка «под киоск»:
    flex по центру, height:100%, overflow:hidden. На телефоне панель влезала
    по высоте и всё выглядело нормально, а на ноутбуке широкий и низкий экран
    ужимал SVG до нуля - плитки просто исчезали. И прокрутки не было вовсе. */
 html,body{margin:0;background:#0F0F11;
           -webkit-tap-highlight-color:transparent;
           font:15px -apple-system,'Segoe UI',Inter,system-ui,sans-serif}
 body{padding:10px;box-sizing:border-box;min-height:100vh}
 #host{color:#fff;margin:0 auto;max-width:1400px}
 /* размер задаётся ШИРИНОЙ: высота подстроится по пропорции сама */
 #host svg{display:block;width:100%;height:auto}
 /* Длинное нажатие в мобильных браузерах выделяет текст и показывает
    системное меню - на пультах это мешало. Запрещаем на всей панели. */
 #host,#ov{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
           user-select:none;-webkit-touch-callout:none}
 [data-topic],[data-expand],[data-pad],[data-href],[data-chart],[data-section]{cursor:pointer}
 [data-topic].busy,[data-pad].busy{opacity:.45}
 /* выбор числа колонок: значение запоминается и переносится между панелями */
 /* назад к списку панелей: маленькая, полупрозрачная, всегда на месте */
 #back{position:fixed;top:8px;left:8px;z-index:15;text-decoration:none;
       background:rgba(28,28,32,.72);border-radius:12px;color:#fff;
       padding:7px 12px;font-size:13px;opacity:.35}
 #back:hover,#back.touched{opacity:1}
 #cols{position:fixed;top:8px;right:8px;z-index:15;
       background:rgba(28,28,32,.72);border-radius:12px;padding:3px;
       font-size:13px;line-height:1;opacity:.35}
 #cols:hover,#cols.touched{opacity:1}
 #cols b{display:inline-block;padding:6px 9px;border-radius:9px;color:#fff;
         cursor:pointer;font-weight:600}
 #cols b.on{background:#E09B2D;color:#1B1B1F}
 #err{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
      background:#C4553B;color:#fff;padding:7px 14px;border-radius:9px;
      font-size:13px;display:none;z-index:30}
 /* Порт 8080 - вход без пароля. Пока панель открыта через него, об этом
    должно быть видно: предупреждение в документации читают один раз, а
    плашку - каждый день, пока не уберёшь причину. */
 #warn8080{position:fixed;left:0;right:0;top:0;z-index:40;display:none;
           background:#8A5A1E;color:#FFE6BF;text-align:center;
           padding:6px 10px;font-size:13px;line-height:1.35}
 #warn8080 b{color:#fff}
 #warn8080 a{color:#FFE6BF;text-decoration:underline}
 body.warned{padding-top:38px}
 body.warned #back,body.warned #cols{top:42px}
 /* оверлей: тот же язык, что и у плиток - тёмный фон, скруглённая карточка */
 /* inset и min() - свежий синтаксис, старые десктопные браузеры его не знают
    и оверлей получался нулевого размера: на телефоне работало, на ноутбуке нет.
    Пишем по-старому. */
 /* Класс видимости зовётся open, а не on. С on оверлей становился
    предком вставленного SVG и подхватывал правило .on .icon, написанное
    для значка включённого прибора: значок плитки, раскрытой на весь
    экран, окрашивался в оранжевый цвет активного устройства. */
 #ov{position:fixed;top:0;left:0;right:0;bottom:0;
     background:rgba(10,10,12,.86);display:none;z-index:2147483000;
     align-items:center;justify-content:center;flex-direction:column;
     padding:18px;box-sizing:border-box;overflow:auto}
 /* именно auto по бокам: раньше тут было "7px 0", и это правило перебивало
    margin:0 auto у самих пультов - они прижимались к левому краю */
 #ov.open > *{margin:7px auto}
 #ov.open{display:block;text-align:center}
 #ov .card{background:#F1F1F3;border-radius:22px;padding:14px;max-width:100%;
           display:inline-block;box-sizing:border-box;position:relative;z-index:1}
 #ov svg{display:block;max-width:100%;height:auto}
 #ov .ttl{color:#fff;font-size:17px;font-weight:600}
 /* Камера во весь экран. Ширину задаём в процентах окна, высоту отдаём
    пропорции: кадр 16:9, и фиксированная высота его бы обрезала. */
 #ov .cam{display:block;width:100%;height:auto;border-radius:12px;
          background:#17171A;min-height:120px}
 #ov .camwrap{padding:8px}
 #ov .hint{color:rgba(255,255,255,.55);font-size:13px;text-align:center}
 /* переключатель в пульте: без него подвинуть яркость у выключенной лампы
    можно, а увидеть результат - нет */
 #ov .pw{display:inline-flex;align-items:center;padding:10px 18px;
         border-radius:14px;border:2px solid rgba(255,255,255,.3);
         color:#fff;font-size:15px;font-weight:600;cursor:pointer;user-select:none}
 #ov .pw.on{border-color:#E09B2D;color:#E09B2D}
 #ov .pw .led{width:12px;height:12px;border-radius:50%;margin-right:10px;
              background:rgba(255,255,255,.35)}
 #ov .pw.on .led{background:#E09B2D}
 #ov .close{position:fixed;top:16px;right:18px;color:#fff;font-size:30px;
            line-height:1;opacity:.7;cursor:pointer}
 /* пульт ленты: поле «холодный-тёплый» по X, яркость по Y */
 /* размер задаётся из скрипта: min() поддерживают не везде */
 #pad{position:relative;border-radius:20px;touch-action:none;
      overflow:hidden;margin:0 auto}
 #pad .grad{position:absolute;top:0;left:0;right:0;bottom:0}
 #pad .dim{position:absolute;top:0;left:0;right:0;bottom:0;
           background:linear-gradient(to bottom,rgba(10,10,12,0),rgba(10,10,12,.86))}
 #pad .dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;
           border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
 /* пульт диммера: линейный, заполнение снизу */
 #lvl{position:relative;border-radius:20px;touch-action:none;overflow:hidden;
      background:#2C2C31;margin:0 auto}
 #lvl .fill{position:absolute;left:0;right:0;bottom:0;background:#E0A050;opacity:.75}
 #lvl .val{position:absolute;left:0;right:0;bottom:14px;text-align:center;
           color:#fff;font-size:26px;font-weight:600}
 /* Шаг числом. Двумя процентами на ночь пальцем по полю не попасть: один
    процент это пара пикселей. Стрелки закрывают ровно этот случай, а
    крупное неяркое число отвечает на вопрос «сколько сейчас», не
    перетягивая внимание с самого поля. */
 #ov .step{display:flex;align-items:center;justify-content:center;gap:14px;
           margin:7px auto}
 #ov .step .lab{color:rgba(255,255,255,.55);font-size:13px;min-width:64px;
                text-align:right}
 #ov .step .num{color:rgba(255,255,255,.78);font-size:24px;font-weight:600;
                min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
 #ov .step .keys{display:flex;gap:8px}
 #ov .step button{width:46px;height:46px;border:0;border-radius:23px;
                  background:rgba(255,255,255,.13);color:#fff;font-size:24px;
                  line-height:46px;padding:0;cursor:pointer;touch-action:manipulation}
 #ov .step button:active{background:rgba(255,255,255,.26)}
 /* пульт шторы: сверху лежит прозрачный слой для жеста, под ним - та же
    картинка плитки, что и на панели, только крупно */
 /* inline-block: обёртка должна быть ровно по картинке, иначе центр жеста
    окажется в центре экрана, а не в центре окна со шторой */
 #crtwrap{position:relative;display:inline-block;margin:0 auto}
 /* z-index больше, чем у .card (там стоит 1): иначе картинка лежит поверх
    прозрачного слоя и забирает касания себе - жест просто не доходит */
 #crtview{position:absolute;left:0;right:0;top:0;bottom:0;touch-action:none;
          cursor:ew-resize;z-index:3}
 #crtview .mark{position:absolute;top:0;bottom:0;width:2px;display:none;
                background:rgba(255,255,255,.9);
                box-shadow:0 0 12px rgba(0,0,0,.7)}
 #crtview .read{position:absolute;left:0;right:0;top:42%;display:none;
                text-align:center;color:#fff;font-size:42px;font-weight:600;
                text-shadow:0 2px 12px rgba(0,0,0,.8)}
 #ov .crow{display:block;margin:10px auto 0;text-align:center}
 #ov .cbtn{display:inline-block;margin:4px;padding:10px 18px;border-radius:12px;
           border:2px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);
           font-size:15px;font-weight:600;cursor:pointer}
 #ov .cbtn.stop{border-color:#C4553B;color:#FFD8CE}
 #ov .cbtn.on{border-color:#E09B2D;color:#FFD9A0}
 #tdial{margin:0 auto;touch-action:none;user-select:none}
 #tdial .tbig{fill:#fff;font-size:54px;font-weight:600;letter-spacing:-1px}
 #tdial .tsub{fill:rgba(255,255,255,.55);font-size:16px;font-weight:500}
 #tdial .tmode{fill:rgba(255,255,255,.65);font-size:17px;font-weight:600}
 /* пульт кондиционера */
 #wheel{margin:0 auto;user-select:none;touch-action:none}
 #ov .wbig{color:#fff;font-size:64px;font-weight:300;line-height:1;
           letter-spacing:-2px;margin:4px 0 0}
 #ov .wbig .wdeg{font-size:22px;font-weight:500;vertical-align:super;
                 margin-left:4px;letter-spacing:0}
 #ov .acrow{display:block;margin:8px auto;max-width:460px}
 /* Пульт телевизора. Кнопки круглые и крупные: пультом пользуются
    пальцем, и промах дороже места на экране. Цвета и размеры заданы
    здесь явно - классы оверлея рассчитаны на тёмный фон, и заголовок
    на белой карточке получался белым по белому. */
 #ov .tvhead{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
 #ov .tvname{flex:1;min-width:0}
 #ov .tvttl{color:#1C1C1E;font-size:20px;font-weight:600;line-height:1.2}
 #ov .tvsub{color:#8E8E93;font-size:13px;margin-top:2px}
 #ov .tvrow{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px 0}
 /* flex:0 0 66px и box-sizing обязательны: без них кнопка в шапке
    растягивалась соседом и круг превращался в овал. */
 #ov .tvc{flex:0 0 66px;width:66px;height:66px;min-width:66px;min-height:66px;
       box-sizing:border-box;padding:0;border-radius:50%;background:#F2F2F7;
       border:1px solid #DCDCE1;display:flex;align-items:center;justify-content:center;
       font-size:14px;color:#1C1C1E;cursor:pointer;user-select:none;
       touch-action:manipulation;overflow:hidden}
 #ov .tvc.big{flex:0 0 88px;width:88px;height:88px;min-width:88px;min-height:88px}
 #ov .tvc:active{background:#E4E4EA}
 #ov .tvc.ok{background:#E08A2D;border-color:#E08A2D;color:#fff;
       font-size:18px;font-weight:600}
 #ov .tvc.pw{background:#D9433C;border-color:#D9433C}
 #ov .tvc.hole{background:none;border:none;pointer-events:none}
 #ov .tvc svg{width:26px;height:26px;fill:none;stroke:#1C1C1E;stroke-width:2.4;
       stroke-linecap:round;stroke-linejoin:round}
 #ov .tvc.pw svg{stroke:#fff}
 #ov .tvc.fill svg{fill:#1C1C1E;stroke:none}
 #ov .tvapps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
 #ov .tvapp{height:52px;border-radius:16px;background:#F2F2F7;border:1px solid #DCDCE1;
       display:flex;align-items:center;justify-content:center;font-size:14px;
       color:#1C1C1E;cursor:pointer;text-align:center;padding:0 6px;
       user-select:none;touch-action:manipulation}
 #ov .tvapp.now{background:#FDF3E6;border-color:#E08A2D;border-width:2px}
 #ov .tvvol{flex:1;height:66px;border-radius:22px;background:#F2F2F7;
       border:1px solid #DCDCE1;display:flex;align-items:center;justify-content:center;
       font-size:17px;font-weight:600;color:#1C1C1E;cursor:pointer;
       user-select:none;touch-action:manipulation}
 #ov .tvdead{opacity:.35;pointer-events:none}
 #ov .acbtn{display:inline-block;margin:4px;padding:9px 14px;border-radius:12px;
            border:2px solid rgba(255,255,255,.22);color:rgba(255,255,255,.8);
            font-size:14px;font-weight:600;cursor:pointer}
 #ov .acbtn.on{border-color:#8E6BC4;color:#fff;background:rgba(142,107,196,.22)}
</style></head><body>
<a id="back" href="./">← Панели</a>
<div id="cols"></div>
<div id="host">загрузка…</div>
<div id="err"></div>
<div id="warn8080"></div>
<div id="ov"><span class="close" onclick="closeOv()">&times;</span></div>

<script>
var NAME = __NAME_JS__, EVERY = __EVERY__000;

/* Запасной вход на 8080 не закрыт паролем: кто попал в домашнюю сеть, тот
   управляет светом и шторами. Годится, чтобы попробовать, но не как
   постоянный режим - поэтому и написано «тестовый». */
(function(){
  if (location.port !== '8080') return;
  var w = document.getElementById('warn8080');
  if (!w) return;
  w.innerHTML = '<b>Тестовый режим:</b> открыто через порт 8080, без пароля. ' +
                'Постоянный адрес — <a href="/panel/' + NAME + '.html">/panel/</a>';
  w.style.display = 'block';
  document.body.className += ' warned';
})();

/* Число колонок.
   Берём из адреса, иначе из памяти браузера, иначе оставляем как в конфиге.
   Запоминаем, чтобы при переходе на другую панель раскладка не сбрасывалась:
   у горизонтальных экранов это каждый раз раздражало. */
var STORE = 'wb-panel-cols';
function readCols(){
  var m = location.search.match(/[?&]cols=(\d+)/);
  if (m) return m[1];
  try { return localStorage.getItem(STORE) || ''; } catch(e) { return ''; }
}
var COLS = readCols();

/* Кнопка «назад». Если пришли с другой панели по плитке-ссылке, вернуться
   логичнее туда, а не в общий список: человек проваливался в комнату,
   а не начинал обход заново. Имя панели передаётся параметром from.

   Запоминаем в переменной, а не только в href: fixBack() перебивает адрес
   кнопки, когда меняется число колонок, - и без этого возврат молча
   превращался в переход к списку панелей. */
var BACK_TO = (function(){
  var m = location.search.match(/[?&]from=([\w.-]+)/);
  return m ? m[1] : '';
})();
function saveCols(v){
  COLS = v;
  try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch(e) {}
}
/* Свёрнутые разделы. Список свой на каждом устройстве: на планшете в
   коридоре и на телефоне нужны разные комнаты. Хранится рядом с числом
   колонок и уезжает на сервер параметром - панель цельная картинка, и
   спрятать плитки на стороне браузера нельзя, останутся дыры. */
var FOLD_KEY = 'wb-panel-fold:' + NAME;
var FOLDED = (function(){
  try { return JSON.parse(localStorage.getItem(FOLD_KEY) || '[]') || []; }
  catch(e) { return []; }
})();
var OPENED = (function(){
  try { return localStorage.getItem(FOLD_KEY + ':open') || ''; }
  catch(e) { return ''; }
})();
var ACCORDION = false;   // узнаём из разметки: сервер помечает такие панели

function saveFold(){
  try {
    localStorage.setItem(FOLD_KEY, JSON.stringify(FOLDED));
    localStorage.setItem(FOLD_KEY + ':open', OPENED);
  } catch(e) {}
}

function toggleSection(node){
  var key = node.getAttribute('data-section');
  if (!key) return;
  if (ACCORDION) {
    // В гармошке раскрыт ровно один раздел. Нажатие на свёрнутый
    // раскрывает его, на раскрытый - сворачивает всё: список одних
    // заголовков это самый быстрый способ дойти до нужной комнаты.
    // Сервер понимает "-" как «свёрнуты все».
    OPENED = node.getAttribute('data-folded') === '1' ? key : '-';
  } else {
    var i = FOLDED.indexOf(key);
    if (i < 0) FOLDED.push(key); else FOLDED.splice(i, 1);
  }
  saveFold();
  refresh(true);
}

function Q(){
  var parts = [];
  if (COLS) parts.push('cols=' + COLS);
  if (ACCORDION) {
    if (OPENED) parts.push('open=' + encodeURIComponent(OPENED));
  } else if (FOLDED.length) {
    parts.push('closed=' + FOLDED.map(encodeURIComponent).join(','));
  }
  return parts.length ? ('?' + parts.join('&')) : '';
}

/* Ссылка «назад» тоже должна нести выбранное число колонок: на широком
   экране незачем терять раскладку из-за перехода на соседнюю панель. */
function fixBack(){
  var b = document.getElementById('back');
  if (!b) return;
  if (BACK_TO) {
    b.href = BACK_TO + '.html' + Q();
    b.textContent = '\u2190 ' + decodeURIComponent(BACK_TO);
  } else {
    b.href = './' + Q();
  }
}

function drawCols(){
  fixBack();
  var box = document.getElementById('cols'), html = '';
  var opts = ['', '2', '3', '4', '5', '6', '7', '8', '9'];
  for (var i = 0; i < opts.length; i++) {
    var v = opts[i];
    html += '<b data-v="' + v + '"' + (v === COLS ? ' class="on"' : '') + '>'
          + (v === '' ? 'авто' : v) + '</b>';
  }
  box.innerHTML = html;
  var btns = box.getElementsByTagName('b');
  for (var j = 0; j < btns.length; j++) {
    btns[j].onclick = function(){
      saveCols(this.getAttribute('data-v'));
      drawCols();
      refresh();
    };
  }
  box.className = 'touched';
  setTimeout(function(){ box.className = ''; }, 1800);
}
var INTERACTIVE = __INTERACTIVE__;
var host = document.getElementById('host'), err = document.getElementById('err');
var ov = document.getElementById('ov');
var paused = false, press = null;

/* Координаты события.
   ВАЖНО про touchend: у него список touches ПУСТОЙ - палец уже оторван.
   Пустой TouchList при этом истинный, поэтому наивная проверка
   "ev.touches ? ev.touches[0] : ev" давала undefined и падала на .clientX.
   Из-за этого ползунки двигались, а значение не отправлялось: исключение
   происходило ровно в момент отпускания, до вызова pub(). */
function evPoint(ev){
  if(ev.touches && ev.touches.length) return ev.touches[0];
  if(ev.changedTouches && ev.changedTouches.length) return ev.changedTouches[0];
  return ev;
}

function flash(t){ err.textContent=t; err.style.display='block';
  setTimeout(function(){ err.style.display='none'; }, 2600); }

function pub(topic, value){
  return fetch('api/publish', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({topic:topic, value:String(value)})
  }).then(function(r){
    if(!r.ok) return r.json().then(function(j){ throw new Error(j.error||r.status); });
  });
}

/* ---------- оверлей ---------- */
/* Пульты, которым нужно следить за состоянием, оставляют здесь функцию
   уборки: при закрытии окна её надо позвать, иначе таймер продолжит
   тикать в пустоту. */
var ovCleanup = null;
function closeOv(){ ov.classList.remove('open'); paused=false;
  if(ovCleanup){ ovCleanup(); ovCleanup = null; }
  var k=ov.querySelector('.card,#pad,#lvl,#crtwrap,.ttl,.hint');
  while(ov.children.length>1) ov.removeChild(ov.lastChild); refresh(); }
ov.addEventListener('click', function(e){ if(e.target===ov) closeOv(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeOv(); });

function openOv(nodes){ 
  while(ov.children.length>1) ov.removeChild(ov.lastChild);
  nodes.forEach(function(n){ ov.appendChild(n); });
  ov.classList.add('open'); paused=true;
}
function el(tag, cls, text){ var e=document.createElement(tag);
  if(cls) e.className=cls; if(text) e.textContent=text; return e; }

/* Переключатель для пульта. Возвращает объект с текущим состоянием, чтобы
   ползунки знали, надо ли сперва включить прибор. */
/* Ряд «метка − число +».
   Короткое нажатие меняет на шаг, удержание разгоняется: первые полсекунды
   по одному, дальше быстрее. Отправка отложена на 300 мс после последнего
   нажатия - иначе на каждый процент уходила бы своя команда, и прибор
   дёргался бы за пальцем, как штора при перетаскивании. */
function stepRow(label, opts){
  var row = el('div', 'step');
  var lab = el('span', 'lab', label);
  var minus = el('button'), num = el('span', 'num'), plus = el('button');
  minus.textContent = '\u2212'; plus.textContent = '+';
  // Кнопки рядом, а не по краям числа: большой палец дотягивается до обеих
  // не переставляя руку, и подкрутить на пару процентов можно одной рукой.
  var keys = el('div', 'keys');
  keys.appendChild(minus); keys.appendChild(plus);
  row.appendChild(lab); row.appendChild(num); row.appendChild(keys);

  var lo = opts.min === undefined ? 0 : opts.min;
  var hi = opts.max === undefined ? 100 : opts.max;
  var timer = null, hold = null, pending = null;

  function paint(){ num.textContent = opts.read() + (opts.unit || ''); }
  paint();

  function flush(){
    pending = null;
    Promise.resolve(opts.send()).catch(function(e){
      flash('Не удалось: ' + e.message);
    });
  }
  function bump(d){
    var v = Math.max(lo, Math.min(hi, opts.read() + d));
    if(v === opts.read()) return;
    opts.write(v);
    paint();
    if(pending) clearTimeout(pending);
    pending = setTimeout(flush, 300);
  }
  function press(d){
    return function(ev){
      ev.preventDefault();
      bump(d);
      var fast = 0;
      hold = setTimeout(function(){
        timer = setInterval(function(){
          fast += 1;
          bump(d * (fast > 8 ? 5 : 1));
        }, 110);
      }, 500);
    };
  }
  function release(){
    if(hold) clearTimeout(hold);
    if(timer) clearInterval(timer);
    hold = timer = null;
  }
  ['mousedown','touchstart'].forEach(function(e){
    minus.addEventListener(e, press(-(opts.step || 1)), {passive:false});
    plus.addEventListener(e, press(opts.step || 1), {passive:false});
  });
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(e){
    minus.addEventListener(e, release);
    plus.addEventListener(e, release);
  });
  row.repaint = paint;
  row.el = row;
  return row;
}


function powerRow(node){
  var st = {on: node.getAttribute('data-state') === '1'};
  var row = el('div', 'pw');
  var led = el('span', 'led'), label = el('span');
  row.appendChild(led); row.appendChild(label);
  function paint(){
    row.classList.toggle('on', st.on);
    label.textContent = st.on ? 'Включено' : 'Выключено';
  }
  paint();
  row.onclick = function(){
    var topic = node.getAttribute('data-topic');
    if(!topic) return;
    var next = !st.on;
    pub(topic, next ? node.getAttribute('data-on') : node.getAttribute('data-off'))
      .then(function(){ st.on = next; paint(); })
      .catch(function(e){ flash('Не удалось: ' + e.message); });
  };
  st.el = row;
  // включить прибор, если крутят яркость у выключенного
  st.ensureOn = function(){
    var topic = node.getAttribute('data-topic');
    if(st.on || !topic) return Promise.resolve();
    return pub(topic, node.getAttribute('data-on')).then(function(){
      st.on = true; paint();
    });
  };
  return st;
}

/* ---------- график на весь экран ---------- */
/* График по нажатию на чип строки состояния.
   Плитки под ним нет, поэтому картинку собирает отдельный маршрут
   /chart.svg по имени канала. Диапазон переключается кнопками: смотреть
   движение за трое суток и за полчаса нужно по-разному. */
function chartOv(node){
  var channel = node.getAttribute('data-chart');
  var title = node.getAttribute('data-chart-title') || '';
  var unit = node.getAttribute('data-unit') || '';
  var range = '12h';

  var card = el('div','card'); card.textContent = '…';
  var row = el('div','crow');
  var hint = el('div','hint','Нажмите вне карточки, чтобы закрыть');

  function url(){
    var w = Math.min(Math.round(window.innerWidth * 0.90), 1400);
    var h = Math.min(Math.round(window.innerHeight * 0.55), 800);
    return 'chart.svg?channel=' + encodeURIComponent(channel) +
           '&range=' + range + '&w=' + w + '&h=' + h +
           '&unit=' + encodeURIComponent(unit) +
           '&title=' + encodeURIComponent(title) + '&t=' + Date.now();
  }
  function load(){
    fetch(url(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(svg){
        if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
        card.innerHTML = svg;
      })
      .catch(function(e){ card.textContent = 'Не удалось: ' + e.message; });
  }
  var buttons = {};
  ['30m','6h','12h','3d'].forEach(function(r){
    var b = el('span','cbtn', r);
    b.onclick = function(){
      range = r;
      for(var k in buttons){ buttons[k].className = 'cbtn'; }
      b.className = 'cbtn on';
      load();
    };
    if(r === range) b.className = 'cbtn on';
    buttons[r] = b;
    row.appendChild(b);
  });

  openOv([card, row, hint]);
  if(!ov.offsetHeight){ closeOv(); window.open(url(), '_blank'); return; }
  load();
}

function expand(node){
  var i = node.getAttribute('data-i');
  var w = Math.min(Math.round(window.innerWidth * 0.90), 1400);
  var h = Math.min(Math.round(window.innerHeight * 0.62), 900);
  var url = 'tile/' + encodeURIComponent(NAME) + '/' + i + '.svg?w=' + w + '&h=' + h;
  var card = el('div','card');
  card.textContent = '…';
  var hint = el('div','hint','Нажмите вне карточки, чтобы закрыть');
  openOv([card, hint]);
  // если оверлей по какой-то причине не показался, откроем картинку отдельно
  if(!ov.offsetHeight){ closeOv(); window.open(url, '_blank'); return; }
  fetch(url, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(svg){
      if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
      card.innerHTML = svg;
    })
    .catch(function(e){
      card.textContent = 'Не удалось: ' + e.message;
      flash('Полный экран: ' + e.message);
    });
}

/* ---------- пульт ленты: X - температура, Y - яркость ---------- */
function padXY(node){
  var pad = el('div'); pad.id='pad';
  var side = Math.round(Math.min(window.innerWidth*0.78, window.innerHeight*0.6));
  pad.style.width = side + 'px'; pad.style.height = side + 'px';
  var grad = el('div','grad'), dim = el('div','dim'), dot = el('div','dot');
  grad.style.background = 'linear-gradient(to right,' +
      node.getAttribute('data-cold') + ',' + node.getAttribute('data-warm') + ')';
  pad.appendChild(grad); pad.appendChild(dim); pad.appendChild(dot);
  var title = el('div','ttl', node.getAttribute('data-title') || 'Подсветка');
  var hint = el('div','hint','Слева холодный, справа тёплый · вверх ярче'
                             + ' · стрелками по проценту');
  var power = powerRow(node);
  var x = parseFloat(node.getAttribute('data-dot-x')||'0.5');
  var y = parseFloat(node.getAttribute('data-dot-y')||'0.5');
  function place(){ dot.style.left=(x*100)+'%'; dot.style.top=(y*100)+'%';
    dot.style.background = 'transparent'; }
  place();

  var rows = [];
  var bright = stepRow('Яркость', {
    unit: ' %',
    read:  function(){ return Math.round((1-y)*100); },
    write: function(v){ y = 1 - v/100; place(); },
    send:  function(){ return send(); }
  });
  rows.push(bright);
  // Ось цветовой температуры шагается в процентах, как и яркость: у ленты
  // это доля от холодного к тёплому, а не кельвины прибора. Считать шаг в
  // кельвинах пришлось бы по-разному для percent и kelvin, и на плитке всё
  // равно показана доля.
  var warm = null;
  if(node.getAttribute('data-temp')){
    warm = stepRow('Тёплый', {
      unit: ' %',
      read:  function(){ return Math.round(x*100); },
      write: function(v){ x = v/100; place(); },
      send:  function(){ return send(); }
    });
    rows.push(warm);
  }

  openOv([title, pad].concat(rows, [power.el, hint]));

  function at(ev){
    var r = pad.getBoundingClientRect();
    var p = evPoint(ev);
    x = Math.max(0, Math.min(1, (p.clientX-r.left)/r.width));
    y = Math.max(0, Math.min(1, (p.clientY-r.top)/r.height));
    place();
    bright.repaint();
    if(warm) warm.repaint();
  }
  function send(){
    var bmax = parseFloat(node.getAttribute('data-bright-max')||'100');
    var bright = Math.round((1-y)*bmax);
    var jobs = [pub(node.getAttribute('data-bright'), bright)];
    var tTopic = node.getAttribute('data-temp');
    if(tTopic){
      var unit = node.getAttribute('data-temp-unit');
      var tmax = parseFloat(node.getAttribute('data-temp-max')||'100');
      var lo = parseFloat(node.getAttribute('data-temp-lo')||'2700');
      var hi = parseFloat(node.getAttribute('data-temp-hi')||'6500');
      // слева холодный: x=0 -> hi кельвинов
      var value = (unit === 'percent') ? Math.round((1-x)*tmax)
                                       : Math.round(hi - x*(hi-lo));
      jobs.push(pub(tTopic, value));
    }
    // если лента выключена, сперва включаем - иначе крутить бесполезно
    return power.ensureOn()
      .then(function(){ return Promise.all(jobs); })
      .catch(function(e){ flash('Не удалось: '+e.message); });
  }
  drag(pad, at, send);
}

/* ---------- пульт кондиционера ----------
   Колесо сверху: шкала едет под неподвижной меткой по центру, как в
   приложении. Тянешь влево - значения растут. Ниже режимы, питание и
   скорость вентилятора. */
function padAC(node){
  var lo = parseFloat(node.getAttribute('data-ac-lo')||'16');
  var hi = parseFloat(node.getAttribute('data-ac-hi')||'30');
  var step = parseFloat(node.getAttribute('data-ac-step')||'1');
  // pos - непрерывное положение шкалы, temp - значение, которое отправим.
  // Раньше шкала перерисовывалась от округлённого значения, из-за чего
  // засечки всегда попадали в те же места и колесо казалось неподвижным.
  var temp = parseFloat(node.getAttribute('data-ac-now'));
  if(isNaN(temp)) temp = Math.round((lo+hi)/2);
  var pos = temp;

  var title = el('div','ttl', node.getAttribute('data-title') || 'Кондиционер');
  var cur = node.getAttribute('data-ac-cur');
  // Крупно сверху - ФАКТИЧЕСКАЯ температура: уставку и так видно на шкале,
  // дублировать её незачем.
  var big = el('div','wbig');
  big.innerHTML = (cur || '--').replace('°','') + '<span class="wdeg">°C</span>';
  var sub = el('div','hint','в комнате · уставку задайте колесом');

  var W = Math.min(window.innerWidth - 30, 470), H = 190;
  var wrap = el('div'); wrap.id = 'wheel';
  wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
  wrap.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">'
    + '<path class="warc2" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>'
    + '<path class="wnotch" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/>'
    + '<g class="wticks"></g>'
    + '<path class="warc" fill="none" stroke="#B08BE8" stroke-width="3"/>'
    + '</svg>';
  // ВАЖНО: узлы ещё не в документе, поэтому ищем внутри wrap.
  // Через document.getElementById здесь приходит null, и пульт падал молча.
  var gTicks = wrap.querySelector('.wticks');
  var pArc   = wrap.querySelector('.warc');
  var pArc2  = wrap.querySelector('.warc2');
  var pNotch = wrap.querySelector('.wnotch');

  /* Дуга «улыбкой»: центр окружности НАД картинкой, поэтому середина шкалы
     внизу, а края поднимаются - как в приложении. Раньше центр был снизу и
     дуга выгибалась в другую сторону. */
  var PXDEG = W / 5, R = W * 1.7, CX = W / 2, BOTTOM = H - 34, CY = BOTTOM - R;
  function pt(delta, radius){
    var a = (delta * PXDEG) / R;
    var r = radius === undefined ? R : radius;
    return [CX + r * Math.sin(a), CY + r * Math.cos(a), a];
  }
  function arcPath(radius, half){
    var p0 = pt(-half, radius), p1 = pt(half, radius);
    return 'M ' + p0[0].toFixed(1) + ',' + p0[1].toFixed(1)
         + ' A ' + radius.toFixed(0) + ',' + radius.toFixed(0)
         + ' 0 0 0 ' + p1[0].toFixed(1) + ',' + p1[1].toFixed(1);
  }
  function draw(){
    var s = '', v, from = Math.ceil((pos - 3.2) * 5) / 5;
    for(v = from; v <= pos + 3.2; v += 0.2){
      if(v < lo - 0.001 || v > hi + 0.001) continue;
      var p = pt(v - pos), whole = Math.abs(v - Math.round(v)) < 0.05;
      var len = whole ? 12 : 7;
      // засечки смотрят наружу от центра окружности, то есть вниз
      var x2 = p[0] + Math.sin(p[2]) * len, y2 = p[1] + Math.cos(p[2]) * len;
      s += '<line x1="' + p[0].toFixed(1) + '" y1="' + p[1].toFixed(1)
         + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1)
         + '" stroke="#fff" stroke-width="' + (whole ? 1.7 : 1)
         + '" opacity="' + (whole ? .7 : .3) + '"/>';
      if(whole){
        // подписи с внутренней стороны дуги, то есть выше неё
        var lx = p[0] - Math.sin(p[2]) * 20, ly = p[1] - Math.cos(p[2]) * 20;
        var near = Math.abs(v - temp) < 0.05;
        s += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1)
           + '" text-anchor="middle" font-size="' + (near ? 19 : 16)
           + '" fill="rgba(255,255,255,' + (near ? .92 : .45) + ')">'
           + Math.round(v) + '°</text>';
      }
    }
    gTicks.innerHTML = s;
    pArc.setAttribute('d', arcPath(R, 3.2));
    pArc2.setAttribute('d', arcPath(R - 74, 2.6));
    var n = pt(0, R - 74);
    pNotch.setAttribute('d', 'M ' + (n[0] - 8) + ',' + (n[1] - 9)
                           + ' L ' + n[0] + ',' + (n[1] + 1)
                           + ' L ' + (n[0] + 8) + ',' + (n[1] - 9));
  }
  draw();

  var startX = null, startPos = pos;
  function begin(ev){
    startX = evPoint(ev).clientX; startPos = pos;
  }
  function at(ev){
    if(startX === null) begin(ev);
    pos = startPos - (evPoint(ev).clientX - startX) / PXDEG;  // влево - теплее
    pos = Math.max(lo, Math.min(hi, pos));
    temp = Math.max(lo, Math.min(hi, Math.round(pos / step) * step));
    draw();
  }
  function send(){
    startX = null;
    pos = temp;                       // защёлкиваем шкалу на выбранном делении
    draw();
    var t = node.getAttribute('data-ac-target');
    if(t) pub(t, temp).catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  drag(wrap, at, send, begin);

  function chooser(list, attr, nowValue){
    var row = el('div','acrow');
    list.forEach(function(item){
      var b = el('div', 'acbtn' + (item[0] === nowValue ? ' on' : ''), item[1]);
      b.onclick = function(){
        var topic = node.getAttribute(attr);
        if(!topic) return;
        pub(topic, item[0]).then(function(){
          var all = row.querySelectorAll('.acbtn');
          for(var i = 0; i < all.length; i++) all[i].classList.remove('on');
          b.classList.add('on');
        }).catch(function(e){ flash('Не удалось: ' + e.message); });
      };
      row.appendChild(b);
    });
    return row;
  }

  var modes = chooser([['cool','Охлаждение'],['heat','Нагрев'],['dry','Осушение'],
                       ['fan_only','Вентиляция'],['auto','Авто']],
                      'data-ac-mode', node.getAttribute('data-ac-mode-now'));
  var fans = chooser([['low','1'],['medium','2'],['high','3'],['auto','Авто']],
                     'data-ac-fan', node.getAttribute('data-ac-fan-now'));
  var power = powerRow(node);
  var parts = [title, big, wrap, sub, modes,
               el('div','hint','Скорость вентилятора'), fans];
  if(node.getAttribute('data-ac-swing')){
    parts.push(el('div','hint','Лопасти вертикальные'));
    parts.push(chooser([['auto','Авто'],['off','Выкл'],['upper','Верх'],
                        ['position_2','2'],['position_3','3'],['position_4','4'],
                        ['bottom','Низ']],
                       'data-ac-swing', node.getAttribute('data-ac-swing-now')));
  }
  if(node.getAttribute('data-ac-swing-h')){
    parts.push(el('div','hint','Лопасти горизонтальные'));
    // кнопки идут слева направо, как реальные положения: 4·5·1·6·7
    parts.push(chooser([['auto','Авто'],['position_4','◀◀'],['position_5','◀'],
                        ['position_1','●'],['position_6','▶'],['position_7','▶▶']],
                       'data-ac-swing-h', node.getAttribute('data-ac-swing-h-now')));
  }
  parts.push(power.el);
  openOv(parts);
}

/* ---------- пульт диммера: линейный ---------- */
function padLevel(node){
  var box = el('div'); box.id='lvl';
  box.style.width = Math.round(Math.min(window.innerWidth*0.5, 220)) + 'px';
  box.style.height = Math.round(Math.min(window.innerHeight*0.5, 380)) + 'px';
  var fill = el('div','fill'), val = el('div','val');
  box.appendChild(fill); box.appendChild(val);
  var title = el('div','ttl', node.getAttribute('data-title') || 'Яркость');
  var hint = el('div','hint','Ведите вверх или вниз · стрелками по проценту');
  var power = powerRow(node);
  var lvl = parseFloat(node.getAttribute('data-level')||'0');
  function place(){ fill.style.height=(lvl*100)+'%'; val.textContent=Math.round(lvl*100)+' %'; }
  place();

  function send(){
    var bmax = parseFloat(node.getAttribute('data-bright-max')||'100');
    return power.ensureOn()
      .then(function(){ return pub(node.getAttribute('data-bright'), Math.round(lvl*bmax)); })
      .catch(function(e){ flash('Не удалось: '+e.message); });
  }

  var step = stepRow('Яркость', {
    unit: ' %',
    read:  function(){ return Math.round(lvl*100); },
    write: function(v){ lvl = v/100; place(); },
    send:  send
  });

  openOv([title, box, step, power.el, hint]);
  function at(ev){
    var r = box.getBoundingClientRect();
    var p = evPoint(ev);
    lvl = Math.max(0, Math.min(1, 1-(p.clientY-r.top)/r.height));
    place(); step.repaint();
  }
  drag(box, at, send);
}

/* Пульт шторы.
   Полоса задаёт положение, кнопки под ней - «закрыть / стоп / открыть».
   Пока палец ведёт, показываем то, что он выбрал; отпустил - отправляем
   одно значение. Промежуточные значения слать нельзя: у привода каждая
   команда это новая цель, и он дёргался бы за пальцем. */
function padCurtain(node){
  /* Раскрытая штора - это та же плитка, только крупно: рисует её сервер тем
     же макросом, что и на панели. Своей вёрстки тут нет намеренно, иначе
     пришлось бы поддерживать два разных изображения одной вещи.
     Поверх картинки лежит прозрачный слой: ведём правую створку от центра
     к правому краю, как саму штору руками. */
  var i = node.getAttribute('data-i');
  var w = Math.min(Math.round(window.innerWidth * 0.90), 1400);
  var h = Math.min(Math.round(window.innerHeight * 0.62), 900);
  var url = 'tile/' + encodeURIComponent(NAME) + '/' + i + '.svg?w=' + w + '&h=' + h;

  var card = el('div','card'); card.textContent = '…';
  var wrap = el('div'); wrap.id = 'crtwrap';
  var view = el('div'); view.id = 'crtview';
  var mark = el('div','mark');            // куда поедет
  var read = el('div','read');            // проценты крупно
  view.appendChild(mark); view.appendChild(read);
  wrap.appendChild(card); wrap.appendChild(view);

  var title = el('div','ttl', node.getAttribute('data-title') || 'Штора');
  var hint  = el('div','hint','Ведите правую створку от центра к краю');
  var pos   = parseFloat(node.getAttribute('data-pos')||'0');
  var shown = pos;

  function paint(){
    // 0 - створка у центра (закрыто), 1 - у правого края (открыто)
    var svg = card.querySelector('svg');
    if(svg){
      var rs = svg.getBoundingClientRect(), rv = view.getBoundingClientRect();
      var left = rs.left - rv.left, mid = left + rs.width/2;
      mark.style.left = Math.round(mid + shown*rs.width/2) + 'px';
    } else {
      mark.style.left = (50 + shown*50) + '%';
    }
    read.textContent = Math.round(shown*100) + ' %';
    mark.style.display = read.style.display = dragging ? 'block' : 'none';
  }
  var dragging = false;

  function load(){
    fetch(url + '&t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(svg){
        if(svg.indexOf('<svg') < 0) throw new Error('пустой ответ');
        card.innerHTML = svg;
      })
      .catch(function(e){ card.textContent = 'Не удалось: ' + e.message; });
  }
  load();

  var row = el('div','crow');
  function button(text, cls, fn){
    var b = el('span','cbtn'+(cls?' '+cls:''), text);
    b.onclick = fn; row.appendChild(b); return b;
  }
  function send(value){
    pub(node.getAttribute('data-topic'), value)
      .then(function(){
        setTimeout(load, 700); setTimeout(load, 2500); setTimeout(load, 6000);
        setTimeout(refresh, 800);
      })
      .catch(function(e){ flash('Не удалось: '+e.message); });
  }
  button('Закрыть', '', function(){ send(node.getAttribute('data-off')); });
  /* Стоп есть не у всех приводов: у HomeKit-совместимых это отдельная
     характеристика, и топик задаётся в конфиге явно. Нет топика - нет кнопки:
     рисовать неработающую хуже, чем не рисовать вовсе. */
  var stopTopic = node.getAttribute('data-stop');
  if(stopTopic){
    button('Стоп', 'stop', function(){
      pub(stopTopic, node.getAttribute('data-stop-value') || '2')
        .then(function(){ setTimeout(load, 700); setTimeout(load, 2000); })
        .catch(function(e){ flash('Не удалось: '+e.message); });
    });
  }
  button('Открыть', '', function(){ send(node.getAttribute('data-on')); });

  openOv([title, wrap, row, hint]);
  if(!ov.offsetHeight){ closeOv(); window.open(url, '_blank'); return; }

  function at(ev){
    // Считаем от самого рисунка: у карточки есть поля, и если брать её
    // границы, центр окна и центр жеста разъезжаются на ширину поля.
    var box = card.querySelector('svg') || view;
    var r = box.getBoundingClientRect();
    var p = evPoint(ev);
    // центр картинки = створки сомкнуты, правый край = открыто настежь
    shown = Math.max(0, Math.min(1, (p.clientX - (r.left + r.width/2)) / (r.width/2)));
    paint();
  }
  function begin(ev){ dragging = true; at(ev); }
  function done(){
    dragging = false; paint();
    pos = shown;
    // Промежуточные значения не шлём: для привода каждое - новая цель,
    // и он дёргался бы за пальцем.
    send(Math.round(shown*100));
  }
  drag(view, at, done, begin);
}

/* Перетаскивание: pointer-события есть не везде, поэтому с запасным
   вариантом на мышь и касания. */
function drag(node, move, done, begin){
  var active = false;
  function start(e){
    active = true;
    try { if(e.pointerId != null && node.setPointerCapture) node.setPointerCapture(e.pointerId); }
    catch(_) {}
    if(begin) begin(e); else move(e);
    if(e.preventDefault) e.preventDefault();
  }
  function go(e){ if(active){ move(e); if(e.preventDefault) e.preventDefault(); } }
  function end(e){
    if(!active) return;
    active = false;
    // move() может споткнуться на кривом событии - но отправить значение
    // мы обязаны в любом случае, иначе жест пропадает впустую
    try { move(e); } catch(_) {}
    done();
  }
  /* Отмена жеста - это НЕ движение. Раньше здесь вызывался move() с событием
     pointercancel, у которого координат нет, и значение прыгало в край.
     Браузер шлёт отмену, стоит пальцу чуть сместиться по вертикали. */
  function cancel(){ if(!active) return; active = false; done(); }
  if(window.PointerEvent){
    node.addEventListener('pointerdown', start);
    node.addEventListener('pointermove', go);
    node.addEventListener('pointerup', end);
    node.addEventListener('pointercancel', cancel);
  } else {
    node.addEventListener('mousedown', start);
    document.addEventListener('mousemove', go);
    document.addEventListener('mouseup', end);
    node.addEventListener('touchstart', start);
    node.addEventListener('touchmove', go);
    node.addEventListener('touchend', end);
    node.addEventListener('touchcancel', cancel);
  }
}

/* ---------- нажатия по плиткам ---------- */
function toggle(node){
  var value = node.getAttribute('data-state')==='1'
            ? node.getAttribute('data-off') : node.getAttribute('data-on');
  // У сцены состояния нет: правило сбрасывает канал раньше, чем панель
  // перерисуется, и подтвердить нажатие обновлением не получится. Поэтому
  // подсвечиваем сами - иначе кнопка кажется мёртвой и её жмут дважды.
  var scene = node.getAttribute('data-kind') === 'scene';
  node.classList.add('busy');
  pub(node.getAttribute('data-topic'), value).then(function(){
    if(scene){
      node.classList.remove('busy');
      node.classList.add('fired');
      setTimeout(function(){ node.classList.remove('fired'); }, 700);
    }
    setTimeout(refresh, 400); setTimeout(refresh, 1200);
  }).catch(function(e){ flash('Не удалось: '+e.message); node.classList.remove('busy'); });
}

function bind(){
  // Заголовки разделов работают и без interactive: сворачивание ничего
  // не включает и не выключает, это способ смотреть.
  var folds = host.querySelectorAll('[data-section]');
  for (var f = 0; f < folds.length; f++) {
    folds[f].onclick = function(){ toggleSection(this); };
  }
  ACCORDION = host.querySelector('[data-accordion="1"]') !== null;

  if(!INTERACTIVE) return;
  var nodes = host.querySelectorAll('[data-topic],[data-expand],[data-pad],[data-href],[data-chart]');
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if(n.getAttribute('data-expand')){ n.onclick=function(){ expand(this); }; continue; }
    // Чип строки состояния: короткое нажатие открывает график канала.
    // Долгого жеста у него нет - переключать нечего.
    if(n.getAttribute('data-chart')){ n.onclick=function(){ chartOv(this); }; continue; }
    // короткое нажатие переключает, долгое открывает пульт
    // Короткое нажатие переключает, долгое открывает пульт.
    // Раньше случайные включения ловились из-за двух вещей: жест не
    // отменялся при сдвиге пальца (прокрутка засчитывалась как нажатие) и
    // порог был коротковат. Теперь следим за смещением и держим 600 мс.
    var down = function(e){
      var self = this, p = evPoint(e);
      // Зоны плюс/минус - прозрачные прямоугольники внутри плитки.
      // Запоминаем, по какой попали: к моменту отпускания цель может
      // смениться, если палец сдвинулся.
      var zone = e.target && e.target.getAttribute
                 ? e.target.getAttribute('data-zone') : null;
      press = {node:self, long:false, zone:zone, x:p.clientX, y:p.clientY, moved:false,
        timer:setTimeout(function(){
          if(press && !press.moved){ press.long = true; openPad(self); }
        }, 600)};
    };
    var moved = function(e){
      if(!press) return;
      var p = evPoint(e);
      if(Math.abs(p.clientX - press.x) > 12 || Math.abs(p.clientY - press.y) > 12){
        press.moved = true;
        clearTimeout(press.timer);
      }
    };
    var up = function(){
      if(!press) return;
      clearTimeout(press.timer);
      var href = this.getAttribute('data-href');
      if(!press.long && !press.moved){
        if(href) { location.href = href + Q(); }
        else if(press.zone) stepTarget(this, press.zone);
        // Термостат: по краям плитки шаг уставки, в центре - открыть пульт.
        // Режим короткое нажатие не трогает: случайно выключить отопление
        // касанием экрана нельзя, для этого есть кнопка на пульте.
        else if(this.getAttribute('data-pad') === 'thermostat') openPad(this);
        // Камера: короткое нажатие открывает поток. Долгое ждать незачем -
        // переключать у неё нечего, и держать палец шесть десятых секунды
        // ради единственного действия было бы издевательством.
        else if(this.getAttribute('data-pad') === 'camera') openPad(this);
        // Телевизор: нажатие открывает пульт и ничего не переключает.
        // Случайное касание не должно выключать телевизор посреди фильма,
        // поэтому питание живёт только внутри пульта.
        else if(this.getAttribute('data-pad') === 'tv') openPad(this);
        else if(this.getAttribute('data-topic')) toggle(this);
      }
      press = null;
    };
    var cancel = function(){ if(press){ clearTimeout(press.timer); press=null; } };
    if(window.PointerEvent){
      n.onpointerdown = down; n.onpointermove = moved;
      n.onpointerup = up; n.onpointercancel = cancel;
    } else {
      n.onmousedown = down; n.onmousemove = moved;
      n.onmouseup = up; n.onmouseleave = cancel;
      n.ontouchstart = down; n.ontouchmove = moved;
      n.ontouchend = up; n.ontouchcancel = cancel;
    }
    // долгое нажатие не должно выделять текст и звать меню браузера
    n.oncontextmenu = function(e){ if(e.preventDefault) e.preventDefault(); return false; };
  }
}
/* Шаг уставки. Значения считает сервер и кладёт в data-up и data-down:
   браузер не должен знать ни шага привода, ни его пределов. После записи
   ждём подтверждения от прибора - следующий шаг возьмётся уже из него. */
function stepTarget(node, zone){
  var value = node.getAttribute(zone === 'up' ? 'data-up' : 'data-down');
  if(value === null) return;
  node.classList.add('busy');
  pub(node.getAttribute('data-topic'), value)
    .then(function(){ setTimeout(refresh, 500); setTimeout(refresh, 2000); })
    .catch(function(e){ flash('Не удалось: ' + e.message); })
    .then(function(){ node.classList.remove('busy'); });
}

/* Переключение режима: греет или выключен.
   Отдельной функцией, потому что зовётся из двух мест - с плитки коротким
   нажатием по центру и с пульта кнопкой. */
function toggleMode(node, after){
  var topic = node.getAttribute('data-mode-topic');
  if(!topic){ flash('Режим не настроен: нет command_topic_mode'); return; }
  var on = node.getAttribute('data-enabled') === '1';
  var value = node.getAttribute(on ? 'data-mode-off' : 'data-mode-on');
  node.setAttribute('data-enabled', on ? '0' : '1');
  pub(topic, value)
    .then(function(){
      setTimeout(function(){ refresh(true); }, 500);
      if(after) setTimeout(after, 700);
    })
    .catch(function(e){
      node.setAttribute('data-enabled', on ? '1' : '0');
      flash('Не удалось: ' + e.message);
    });
}

/* Пульт термостата.
   Повторяет плитку: та же дуга, две риски, число в центре, режим снизу.
   Рисуется здесь, а не запрашивается картинкой у сервера, - дуга должна
   отзываться на палец сразу, без похода по сети.

   Заливка идёт ОТ риски текущей температуры ДО уставки: это ровно тот
   разрыв, который прибору предстоит закрыть. Вверх - оранжевая, вниз -
   синяя: одинаковая дуга не должна означать разные вещи. */
function padThermostat(node){
  var lo = parseFloat(node.getAttribute('data-scale-min') || '14');
  var hi = parseFloat(node.getAttribute('data-scale-max') || '30');
  var step = parseFloat(node.getAttribute('data-step') || '0.5');
  var tlo = parseFloat(node.getAttribute('data-min') || '10');
  var thi = parseFloat(node.getAttribute('data-max') || '38');
  var digits = (step % 1 === 0) ? 0 : 1;
  var value = parseFloat(node.getAttribute('data-target') || '20');
  var current = parseFloat(node.getAttribute('data-current') || 'NaN');
  var live = node.getAttribute('data-live') === '1';
  var timer = null, dragging = false;

  var S = Math.min(window.innerWidth - 40, Math.round(window.innerHeight * 0.62), 460);
  var wrap = el('div'); wrap.id = 'tdial';
  wrap.style.width = S + 'px'; wrap.style.height = S + 'px';
  wrap.innerHTML =
      '<svg viewBox="0 0 ' + S + ' ' + S + '" width="' + S + '" height="' + S + '">'
    + '<path class="tarc-bg" fill="none" stroke-linecap="round"/>'
    + '<path class="tarc" fill="none" stroke-linecap="round"/>'
    + '<line class="tcur" stroke-linecap="round"/>'
    + '<circle class="tcurdot" r="3.4"/>'
    + '<line class="ttgt" stroke-linecap="round"/>'
    + '<circle class="tknob"/>'
    + '<text class="tbig" text-anchor="middle"></text>'
    + '<text class="tsub" text-anchor="middle"></text>'
    + '<text class="tmode" text-anchor="middle"></text>'
    + '</svg>';
  var pBg = wrap.querySelector('.tarc-bg'), pArc = wrap.querySelector('.tarc');
  var lCur = wrap.querySelector('.tcur'), dCur = wrap.querySelector('.tcurdot');
  var lTgt = wrap.querySelector('.ttgt'), cKnob = wrap.querySelector('.tknob');
  var tBig = wrap.querySelector('.tbig'), tSub = wrap.querySelector('.tsub');
  var tMode = wrap.querySelector('.tmode');

  var START = parseFloat(node.getAttribute('data-dial-start') || '148');
  var SWEEP = parseFloat(node.getAttribute('data-dial-sweep') || '244');
  // Те же пропорции, что в build_dial: центр опущен, радиус от меньшей стороны
  var CX = S / 2, CY = S * 0.55, R = S * 0.36;
  var W = Math.max(8, Math.round(S * 0.042));

  function pt(deg, radius){
    var a = deg * Math.PI / 180;
    return [CX + radius * Math.cos(a), CY + radius * Math.sin(a)];
  }
  function arc(fromDeg, toDeg, radius){
    if(Math.abs(toDeg - fromDeg) < 0.3) return '';
    var a = pt(fromDeg, radius), b = pt(toDeg, radius);
    var large = Math.abs(toDeg - fromDeg) > 180 ? 1 : 0;
    var sweepFlag = toDeg > fromDeg ? 1 : 0;
    return 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) +
           'A' + radius + ' ' + radius + ' 0 ' + large + ' ' + sweepFlag + ' ' +
           b[0].toFixed(1) + ' ' + b[1].toFixed(1);
  }
  function degOf(v){
    var f = (v - lo) / (hi - lo);
    return START + Math.max(0, Math.min(1, f)) * SWEEP;
  }
  function mark(line, dot, v, inner, outer){
    var a = pt(degOf(v), R * inner), b = pt(degOf(v), R * outer);
    line.setAttribute('x1', a[0].toFixed(1)); line.setAttribute('y1', a[1].toFixed(1));
    line.setAttribute('x2', b[0].toFixed(1)); line.setAttribute('y2', b[1].toFixed(1));
    if(dot){ dot.setAttribute('cx', b[0].toFixed(1)); dot.setAttribute('cy', b[1].toFixed(1)); }
  }
  function paint(){
    var cool = !isNaN(current) && value < current;
    var color = cool ? '#3B8FD4' : '#FFAE28';

    pBg.setAttribute('d', arc(START, START + SWEEP, R));
    pBg.setAttribute('stroke', 'rgba(255,255,255,.14)');
    pBg.setAttribute('stroke-width', W);

    // от текущей до уставки, а не от начала шкалы
    var from = isNaN(current) ? START : degOf(current);
    var to = degOf(value);
    pArc.setAttribute('d', arc(Math.min(from, to), Math.max(from, to), R));
    pArc.setAttribute('stroke', color);
    pArc.setAttribute('stroke-width', W);
    pArc.setAttribute('opacity', live ? '.95' : '.55');

    if(!isNaN(current)){
      mark(lCur, dCur, current, 0.86, 1.20);
      lCur.setAttribute('stroke', 'rgba(255,255,255,.70)');
      lCur.setAttribute('stroke-width', Math.max(2, W * 0.34));
      dCur.setAttribute('fill', 'rgba(255,255,255,.70)');
    }
    mark(lTgt, null, value, 0.80, 1.20);
    lTgt.setAttribute('stroke', color);
    lTgt.setAttribute('stroke-width', Math.max(3, W * 0.46));
    var k = pt(degOf(value), R * 1.20);
    cKnob.setAttribute('cx', k[0].toFixed(1));
    cKnob.setAttribute('cy', k[1].toFixed(1));
    cKnob.setAttribute('r', Math.max(7, W * 0.62));
    cKnob.setAttribute('fill', color);

    tBig.setAttribute('x', CX); tBig.setAttribute('y', CY + S * 0.035);
    tBig.textContent = value.toFixed(digits) + '\u00b0';
    tSub.setAttribute('x', CX); tSub.setAttribute('y', CY + S * 0.105);
    tSub.textContent = isNaN(current) ? '' : ('сейчас ' + current.toFixed(1) + '\u00b0');
    tMode.setAttribute('x', CX); tMode.setAttribute('y', S - S * 0.03);
    tMode.textContent = node.getAttribute('data-status') || '';
  }
  /* Отправляем последнее значение, а не каждое движение пальца: головка
     иначе выстроит десяток команд в очередь. */
  function send(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      // Пока сценарий переваривает команду, серверная уставка ещё старая.
      // Держим свою цифру три секунды, дальше верим прибору.
      quietUntil = Date.now() + 3000;
      pub(node.getAttribute('data-topic'), value.toFixed(digits))
        .then(function(){ node.setAttribute('data-target', value.toFixed(digits));
                          setTimeout(function(){ refresh(true); }, 400);
                          setTimeout(function(){ refresh(true); sync(); }, 1500); })
        .catch(function(e){ flash('Не удалось: ' + e.message); });
    }, 350);
  }
  function shift(delta){
    value = Math.max(tlo, Math.min(thi, value + delta));
    paint(); send();
  }

  var row = el('div','crow');
  function button(text, cls, fn){
    var b = el('span','cbtn' + (cls ? ' ' + cls : ''), text);
    b.onclick = fn; row.appendChild(b); return b;
  }
  button('\u2212', '', function(){ shift(-step); });
  button('+', '', function(){ shift(step); });

  var power = null;
  if(node.getAttribute('data-mode-topic')){
    var label = function(){
      return node.getAttribute('data-enabled') === '1' ? 'Выключить' : 'Включить';
    };
    power = button(label(), node.getAttribute('data-enabled') === '1' ? 'on' : '', function(){
      toggleMode(node, function(){
        // Дальше состояние подтянет sync(): режим меняет прибор, и его
        // ответ может прийти позже нашего предположения.
        power.textContent = label();
        power.className = 'cbtn' + (node.getAttribute('data-enabled') === '1' ? ' on' : '');
        paint();
      });
    });
  }

  /* refresh() заменяет разметку панели целиком, и ссылка на плитку
     становится битой: обновления состояния до пульта не доходят вовсе.
     Поэтому после каждой перерисовки ищем плитку заново по её номеру и
     перечитываем то, что мог поменять сам прибор или сценарий. */
  var idx = node.getAttribute('data-i');
  var quietUntil = 0;
  function sync(){
    var fresh = host.querySelector('[data-pad="thermostat"][data-i="' + idx + '"]');
    if(!fresh) return;
    node = fresh;
    var c = parseFloat(node.getAttribute('data-current') || 'NaN');
    if(!isNaN(c)) current = c;
    live = node.getAttribute('data-live') === '1';
    // Уставку с сервера подхватываем, только если сами недавно не писали:
    // сценарий отвечает не мгновенно, и своё же значение перетёрло бы
    // цифру обратно на старую.
    if(Date.now() > quietUntil && !dragging){
      var t = parseFloat(node.getAttribute('data-target') || 'NaN');
      if(!isNaN(t)) value = t;
    }
    if(power){
      power.textContent = node.getAttribute('data-enabled') === '1' ? 'Выключить' : 'Включить';
      power.className = 'cbtn' + (node.getAttribute('data-enabled') === '1' ? ' on' : '');
    }
    paint();
  }
  var ticker = setInterval(function(){
    // Сначала просим свежую панель, потом читаем из неё: пока оверлей
    // открыт, само по себе обновление не сработает.
    refresh(true);
    sync();
  }, 1200);

  paint();
  openOv([wrap, row]);
  ovCleanup = function(){ clearInterval(ticker); };

  function at(ev){
    var r = wrap.getBoundingClientRect();
    var p = evPoint(ev);
    var cx = r.left + r.width * 0.5, cy = r.top + r.height * 0.55;
    var deg = Math.atan2(p.clientY - cy, p.clientX - cx) * 180 / Math.PI;
    var rel = deg - START;
    while(rel < 0) rel += 360;
    while(rel > 360) rel -= 360;
    if(rel > SWEEP){
      // Палец в нижнем разрыве дуги: прижимаем к ближнему концу, иначе
      // уставка прыгает с максимума на минимум.
      rel = (rel - SWEEP < 360 - rel) ? SWEEP : 0;
    }
    var raw = lo + (hi - lo) * (rel / SWEEP);
    value = Math.max(tlo, Math.min(thi, Math.round(raw / step) * step));
    paint();
  }
  function begin(ev){ dragging = true; at(ev); }
  function done(){ dragging = false; send(); }
  drag(wrap, at, done, begin);
}

/* ---------- камера ----------
   Поток MJPEG живёт в обычном <img>: браузер сам разбирает multipart и
   перерисовывает кадр за кадром. Никакого проигрывателя не нужно.

   Две тонкости, из-за которых тут больше кода, чем ожидаешь.

   Первая: сервер закрывает соединение через data-cam-life миллисекунд -
   иначе забытое окно держит поток waitress до тайм-аута TCP. Когда
   соединение закрылось, <img> не сообщает об этом ничем: он просто
   застывает на последнем кадре. Поэтому переподключаемся по таймеру
   сами, чуть раньше срока.

   Вторая: поток может не пойти вовсе - MJPEG выключен на камере,
   слотов не осталось, прошивка отвечает иначе. Тогда переходим на
   снимки: то же окно, та же картинка, просто дёргается. Показать
   человеку живой кадр важнее, чем настоять на способе. */
function padCamera(node){
  var stream = node.getAttribute('data-cam-live') === '1'
             ? node.getAttribute('data-cam') : '';
  var poll   = node.getAttribute('data-cam-poll');
  var life   = parseInt(node.getAttribute('data-cam-life') || '0', 10);
  var title  = (node.getAttribute('data-title') || '').replace(/\n/g, ' ');

  var card = el('div','card camwrap');
  var img  = document.createElement('img');
  img.className = 'cam';
  img.alt = '';
  card.appendChild(img);
  var ttl  = el('div','ttl', title);
  var hint = el('div','hint','Нажмите вне карточки, чтобы закрыть');

  var alive = true, polling = false, timer = null, revive = null;

  function shot(){
    if(!alive) return;
    /* live=1 просит сервер не кешировать: на плитке кадр держится
       десять секунд намеренно, а здесь нужен свежий. */
    img.src = poll + '?live=1&t=' + Date.now();
  }
  function toPolling(){
    if(polling || !alive) return;
    polling = true;
    if(revive){ clearTimeout(revive); revive = null; }
    shot();
    timer = setInterval(shot, 700);
  }
  function connect(){
    if(!alive) return;
    img.src = stream + '?t=' + Date.now();
    if(life > 2000){
      revive = setTimeout(connect, life - 1500);
    }
  }

  /* Ошибка загрузки означает разное: у потока - что он не пошёл, у
     снимка - что камера прямо сейчас не ответила. В первом случае
     переключаемся, во втором просто ждём следующего кадра. */
  img.onerror = function(){
    if(!polling) toPolling();
  };

  openOv([ttl, card, hint]);
  if(!ov.offsetHeight){ closeOv(); window.open(poll, '_blank'); return; }

  /* Пока панель обновляется в фоне, кадр камеры тянуть незачем: он и
     так перед глазами. Останавливаем на время просмотра. */
  ovCleanup = function(){
    alive = false;
    if(timer) clearInterval(timer);
    if(revive) clearTimeout(revive);
    /* Пустой src обрывает соединение с сервером немедленно. Без этого
       браузер держит его открытым ещё какое-то время, а на той стороне
       занят поток. */
    img.onerror = null;
    img.src = '';
  };

  if(stream) connect(); else toPolling();
}

/* ---------- пульт телевизора ---------- */
/* Кнопки не знают ни про Samsung, ни про коды клавиш: всё это живёт в
   мосте wb-tv. Пульт публикует единицу в контрол и на этом заканчивает
   свою работу - потому же он одинаково подойдёт телевизору другой марки.

   Значки рисуются встроенным SVG, а не символами юникода: «⏻» и эмодзи
   приглушения есть не во всех шрифтах, и на ноутбуке кнопка оказывалась
   пустой. */
var TVI = {
  power: '<path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>',
  up:    '<path d="M6 15l6-6 6 6"/>',
  down:  '<path d="M6 9l6 6 6-6"/>',
  left:  '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  play:  '<path d="M8 5l11 7-11 7z"/>',
  pause: '<path d="M9 5v14M15 5v14"/>',
  rew:   '<path d="M11 6l-7 6 7 6z"/><path d="M20 6l-7 6 7 6z"/>',
  fwd:   '<path d="M13 6l7 6-7 6z"/><path d="M4 6l7 6-7 6z"/>',
  mute:  '<path d="M11 5L7 9H4v6h3l4 4z"/><path d="M16 9l5 6M21 9l-5 6"/>',
  input: '<path d="M4 6h16v10H4z"/><path d="M9 20h6"/>'
};

function padTV(node){
  var base = node.getAttribute('data-tv-base');
  if(!base) return;
  var link = node.getAttribute('data-tv-link') === '1';
  var on = node.getAttribute('data-tv-on') === '1';

  function press(control){
    pub(base + control + '/on', 1)
      .catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  /* Питание - переключатель, а не кнопка: единица означает «включить», и
     нажатие на включённом телевизоре не выключало его, а подтверждало
     текущее состояние. Шлём противоположное значение и запоминаем его,
     чтобы второе нажатие подряд сработало до обновления панели. */
  function pressPower(){
    var want = on ? 0 : 1;
    pub(base + 'power/on', want).then(function(){
      on = !on;
      sub.textContent = on ? 'Включается…' : 'Выключается…';
      setTimeout(refresh, 800); setTimeout(refresh, 3000);
    }).catch(function(e){ flash('Не удалось: ' + e.message); });
  }
  /* Кнопка. icon - ключ из TVI, иначе показывается текст.
     needs === false у питания: включение идёт через Wake-on-LAN, канал
     управления ему не нужен, и на выключенном телевизоре это
     единственная кнопка, ради которой пульт открывают. */
  function btn(cls, label, control, icon, needs){
    var b = el('div', cls);
    if(icon) b.innerHTML = '<svg viewBox="0 0 24 24">' + TVI[icon] + '</svg>';
    else b.textContent = label;
    if(needs === false || link){
      b.onclick = control === 'power'
                ? pressPower
                : function(){ press(control); };
    } else b.classList.add('tvdead');
    return b;
  }
  function row(items){
    var r = el('div','tvrow');
    items.forEach(function(n){ r.appendChild(n); });
    return r;
  }
  function hole(){ return el('div','tvc hole'); }

  var card = el('div','card');

  /* шапка: название, состояние, вход и питание */
  var head = el('div','tvhead');
  var name = el('div','tvname');
  name.appendChild(el('div','tvttl', node.getAttribute('data-tv-title') || 'Телевизор'));
  var app = node.getAttribute('data-tv-app') || '';
  var sub = el('div','tvsub',
      (node.getAttribute('data-tv-state') || '')
      + (app ? ' · ' + app : '')
      + (link ? '' : ' · доступно только включение'));
  name.appendChild(sub);
  head.appendChild(name);
  head.appendChild(btn('tvc', 'Вход', 'source', 'input'));
  head.appendChild(btn('tvc pw', '', 'power', 'power', false));
  card.appendChild(head);

  /* приложения: по три в ряд, активное подсвечено по current_app */
  var appsRaw = node.getAttribute('data-tv-apps') || '';
  if(appsRaw){
    var grid = el('div','tvapps');
    appsRaw.split(';').forEach(function(item){
      var parts = item.split('|');
      if(!parts[0]) return;
      var title = parts[1] || parts[0];
      var b = el('div','tvapp' + (title === app ? ' now' : ''), title);
      if(link) b.onclick = (function(c){ return function(){ press(c); }; })(parts[0]);
      else b.classList.add('tvdead');
      grid.appendChild(b);
    });
    card.appendChild(grid);
  }

  /* крестовина: OK крупнее стрелок, «Назад» и «Меню» у нижних углов */
  card.appendChild(row([hole(), btn('tvc','','up','up'), hole()]));
  card.appendChild(row([btn('tvc','','left','left'),
                        btn('tvc big ok','OK','ok'),
                        btn('tvc','','right','right')]));
  card.appendChild(row([btn('tvc','Назад','back'),
                        btn('tvc','','down','down'),
                        btn('tvc','Меню','home')]));

  /* медиа: перемотка в обе стороны */
  card.appendChild(row([btn('tvc','','rewind','rew'),
                        btn('tvc fill','','play','play'),
                        btn('tvc','','pause','pause'),
                        btn('tvc','','forward','fwd')]));

  /* громкость: широкая пара, приглушение между */
  var vd = el('div','tvvol','VOL −'), vu = el('div','tvvol','VOL +');
  if(link){
    vd.onclick = function(){ press('vol_down'); };
    vu.onclick = function(){ press('vol_up'); };
  } else { vd.classList.add('tvdead'); vu.classList.add('tvdead'); }
  card.appendChild(row([vd, btn('tvc','','mute','mute'), vu]));

  /* Пока пульт открыт, автообновление панели стоит - иначе разметка
     менялась бы под пальцем. Но статус нужен именно сейчас, когда пульт
     перед глазами, поэтому опрашиваем сами, чаще и не трогая страницу.
     Таймер снимается через ovCleanup: иначе он тикал бы в пустоту. */
  function sync(){
    var q = Q();
    fetch(NAME + '.svg' + q + (q ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(text){
        if(!text) return;
        var doc = new DOMParser().parseFromString(text, 'image/svg+xml');
        var g = doc.querySelector('[data-tv-base="' + base + '"]');
        if(!g) return;
        on = g.getAttribute('data-tv-on') === '1';
        var st = g.getAttribute('data-tv-state') || '';
        var now = g.getAttribute('data-tv-app') || '';
        var live = g.getAttribute('data-tv-link') === '1';
        sub.textContent = st + (now ? ' · ' + now : '')
                        + (live ? '' : ' · доступно только включение');
        // Подсветка активного приложения: телевизор могли переключить и
        // обычным пультом, поэтому идём от того, что сообщил мост.
        var chips = card.querySelectorAll('.tvapp');
        for(var i = 0; i < chips.length; i++){
          chips[i].classList.toggle('now', chips[i].textContent === now);
        }
      })
      .catch(function(){});
  }
  var timer = setInterval(sync, 2000);
  ovCleanup = function(){ clearInterval(timer); };

  openOv([card]);
}

function openPad(node){
  var pad = node.getAttribute('data-pad');
  if(pad==='xy') padXY(node);
  else if(pad==='thermostat') padThermostat(node);
  else if(pad==='level') padLevel(node);
  else if(pad==='curtain') padCurtain(node);
  else if(pad==='ac') padAC(node);
  else if(pad==='camera') padCamera(node);
  else if(pad==='tv') padTV(node);
}

/* ---------- обновление ---------- */
/* force нужен пультам: пока открыт оверлей, автообновление стоит - иначе
   разметка меняется под пальцем. Но пульт термостата сам следит за
   состоянием и переспрашивает панель осознанно, поэтому ему разрешено. */
function refresh(force){
  if(paused && !force) return;
  var q = Q();
  fetch(NAME + '.svg' + q + (q ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(svg){
      if(svg.indexOf('<svg')<0) throw new Error('пустой ответ');
      host.innerHTML = svg; bind(); err.style.display='none';
    })
    .catch(function(e){
      if(host.querySelector('svg')) return;
      host.textContent = 'Не удалось загрузить панель: ' + e.message;
    });
}
/* Экран не должен гаснуть.
   Сперва пробуем штатный способ, он есть в свежих браузерах. Если его нет -
   заводим беззвучное зацикленное видео: пока что-то воспроизводится, Android
   держит экран включённым. Приём старый, работает и на Android 5. */
var wakeLock = null;
function keepAwake(){
  if (navigator.wakeLock && navigator.wakeLock.request) {
    navigator.wakeLock.request('screen').then(function(l){
      wakeLock = l;
      l.addEventListener('release', function(){ wakeLock = null; });
    }).catch(function(){ videoAwake(); });
  } else {
    videoAwake();
  }
}
function videoAwake(){
  if (document.getElementById('nosleep')) return;
  var v = document.createElement('video');
  v.id = 'nosleep';
  v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
  v.setAttribute('loop', ''); v.muted = true; v.loop = true;
  v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
  // односекундный чёрный кадр, меньше килобайта
  v.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAr1tZGF0AAACrgYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0OCByMjY0MyA1YzY1NzA0IC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxNSAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbAAAAAFliIQA';
  document.body.appendChild(v);
  var p = v.play();
  if (p && p.catch) p.catch(function(){ /* нужен жест пользователя */ });
  // если браузер потребовал жест - запустим при первом касании
  document.addEventListener('touchstart', function once(){
    v.play(); document.removeEventListener('touchstart', once);
  });
}
keepAwake();
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && !wakeLock) keepAwake();
});

/* Полный экран по двойному касанию - на случай, если страница открыта
   обычной вкладкой, а не с главного экрана. */
document.addEventListener('dblclick', function(){
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen ||
           el.webkitRequestFullScreen || el.mozRequestFullScreen;
  if (fn) fn.call(el);
});

drawCols();
refresh();
setInterval(refresh, EVERY);
</script></body></html>
