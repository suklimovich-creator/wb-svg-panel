      temp_min: 2700
      temp_max: 6500
      color: terracotta
    - type: dimmer
      title: Споты
      channel: dm/K1
      channel_brightness: dm/Channel 1
      w: 0.5
      h: 1
      color: lilac
    - type: today
      list: shopping
      w: 2
      h: 2
      color: sand
lists:
  shopping:
    title: Покупки
water:
  modules:
    mwac:
      alarm: mw/Leakage Mode
      reset: mw/Leakage Mode Reset
  valves:
    cold:
      title: Холодная
      channel: mw/Output K1
      water: cold
      module: mwac
    hot:
      title: Горячая
      channel: mw/Output K2
      water: hot
      module: mwac
  sensors:
    bath:
      title: Ванная
      channel: mw/Input F1
      closes:
      - cold
      - hot
      module: mwac
    kitchen:
      title: Кухня
      channel: mw/Input F3
      closes:
      - cold
      - hot
      module: mwac
calendars:
  family:
    title: Семья
    ical: https://example.invalid/x.ics
    color: '#3B8FD4'
