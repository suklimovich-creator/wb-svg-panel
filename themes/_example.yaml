# Пример своей темы wb-svg-panel (с 1.25).
#
# Свои темы лежат здесь, в папке themes/ рядом с config.yaml, по файлу на
# тему. Панель видит все *.yaml сама и перечитывает их на ходу - ничего
# прописывать и перезапускать не нужно. Файлы, имя которых начинается с
# «_», - заготовки: их панель не читает. Чтобы попробовать эту тему,
# скопируйте файл под другим именем:
#
#     cp themes/_example.yaml themes/forest.yaml
#
# и выберите «лес» в меню темы на панели или задайте theme: forest в
# config.yaml (у панели, в theme_auto - так же, как встроенные).
#
# Тема наследует встроенную (extends) и задаёт только то, что меняет.
# Список всех переменных с пояснениями - на странице /docs, раздел
# «Свои темы». Что не так с файлом, покажет /check.

name: forest          # латиницей: так тему зовут в config.yaml и в адресе
title: "лес"          # так она называется в меню
extends: autumn       # что не задано - как у осени: светлая, тёмная карточка

# Свойства тоже можно поменять, иначе - как у extends:
# mode: light          # light | dark - от неё пульты и подписи графиков
# on_style: card       # rim - рамка у включённой, card - тёмная карточка
# inv_kinds: []        # типы плиток, у которых карточка тёмная всегда
# sheen: false         # отсвет из угла плитки
# shadow: {amb: 0.16, key: 0.09}   # тени плиток; null - без теней

vars:
  bg-top: "#E5E9E1"           # фон страницы сверху
  bg-bottom: "#D7DED2"        # фон страницы снизу и поля вокруг панели
  tile: "#FBFCF8"             # плитка
  shadow: "#2A3A2C"           # цвет теней
  ink: "#1E2620"              # текст
  ink-dim: "#6B786D"          # приглушённый текст
  stroke: "#3C4A40"           # значки
  active: "#4E8A5A"           # акцент: дуги, ручки, включённое
  active-soft: "#DCEBDD"      # подложка включённого чипа
  active-soft-edge: "rgba(78,138,90,.35)"
  active-ink: "#2F6B3B"       # значок включённого чипа
  cool: "#4F7C8A"             # холод: охлаждение, «не греет»
  inv-tile: "#2F4A36"         # тёмная карточка включённой плитки
  inv-ink: "#F1F5EC"          # текст на ней
  inv-dim: "rgba(241,245,236,.75)"
  inv-stroke: "#CFE3C8"       # значки на ней
  inv-accent: "#B5D98A"       # акцент на ней
  section: "#FBFCF8"          # заголовок раздела
  ac-disk: "#2F4A36"          # колесо кондиционера
  ac-ink: "#F1F5EC"
  ac-dim: "rgba(241,245,236,.72)"
  ac-pill: "#EEF2EA"          # кнопки и клавиши
  ac-pill-on: "#2F4A36"
  ac-pill-ink: "#F1F5EC"
