# Пример своей темы wb-svg-panel: «лес».
#
# Свои темы лежат здесь, в папке themes/ рядом с config.yaml, по файлу на
# тему. Панель видит все *.yaml сама и перечитывает их на ходу - ничего
# прописывать и перезапускать не нужно. Файлы, имя которых начинается с
# «_», - заготовки: их панель не читает. Чтобы попробовать эту тему,
# скопируйте файл под другим именем:
#
#     cp themes/_example.yaml themes/forest.yaml
#
# и выберите «лес» в меню темы на панели или задайте theme: forest в
# config.yaml (у панели, в theme_auto - так же, как встроенные).
#
# Достаточно основных цветов (с 1.26): остальные - приглушённый текст,
# значки, кромка, чипы, кнопки, колесо кондиционера, тёмная карточка -
# панель рассчитает сама. Любой из них можно задать и руками - тогда
# берётся заданный. Список всех переменных - /docs, «Свои темы». Что не
# так с файлом, покажет /check.

name: forest          # латиницей: так тему зовут в config.yaml и в адресе
title: "лес"          # так она называется в меню
extends: autumn       # что не задано - как у осени: белые плитки с тенью

# Свойства - иначе как у extends:
mode: light           # light | dark - от неё пульты и подписи графиков
on_style: rim         # rim - у включённой рамка, card - тёмная карточка
# inv_kinds: []       # типы плиток, у которых карточка тёмная всегда
# sheen: false        # отсвет из угла плитки
# depth: soft         # форма: soft - мягкая тень, flat - плоско, neumo - неоморфизм
# shadow: {amb: 0.16, key: 0.09}   # тени плиток; null - без теней

# Цвета графиков (с 1.27): на величину и палитра для остальных линий.
# Цвет серии в config.yaml сильнее; две линии одного графика не сливаются.
chart:
  temperature: "#C8692E"
  humidity: "#4F7C8A"
  co2: "#3F6E4A"
  # voc, pressure, power - как у осени
  palette: ["#C8692E", "#4F7C8A", "#9A8F7A", "#3F6E4A", "#7A5E85"]

vars:
  # основные цвета
  bg: "#D7DED2"        # фон страницы и поля вокруг панели
  tile: "#FBFCF8"      # плитка
  ink: "#1E2620"       # текст
  accent: "#3F6E4A"    # рамка включённого, дуги, ручки
  cool: "#4F7C8A"      # холод: охлаждение, «не греет»
  heat: "#C8692E"      # тепло: нагрев
  shadow: "#2A3A2C"    # тени
  # card: "#2F4A36"    # тёмная карточка - если on_style: card

  # толщина рамки включённой плитки (у осени её нет: там карточка)
  active-w: "3"
