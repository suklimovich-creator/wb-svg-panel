# Встроенная тема wb-svg-panel: осень.
# светлые темы с тёмной карточкой
# Устроены одинаково: светлый фон, светлые карточки с тенью, а
# включённая плитка - тёмная карточка со светлым текстом (класс inv).
# Цвета каждой темы взяты одним набором, как на палитре: фон, карточка,
# тёмная карточка, чернила и два акцента - для светлой карточки и для
# тёмной. Подбирались по контрасту: акцент на тёмной карточке светлее
# того, что на светлой.
# осень: белые карточки на тёплом сером, коньячный и охра
#
# Значения - CSS-переменные плиток (без «--»). Тема наследует всё,
# чего не задала, у темы из extends.
name: autumn
title: "осень"
extends: light
mode: light   # light | dark: от неё пульты, подписи графиков
on_style: card   # rim - рамка у включённой; card - тёмная карточка
inv_kinds: []   # типы плиток, у которых карточка тёмная всегда
sheen: false   # отсвет из угла плитки (тёмные темы)
shadow: {amb: 0.16, key: 0.09}   # тени плиток: рассеянная и ключевая
# Графики: тёплые и землистые, под белую плитку.
chart:
  temperature: "#D2691E"
  humidity: "#3E7A8C"
  co2: "#5E8A45"
  voc: "#8A65A8"
  pressure: "#857565"
  power: "#B03A2A"
  palette: ["#D2691E", "#3E7A8C", "#A0896A", "#5E8A45", "#8A65A8", "#B03A2A"]
vars:
  bg-top: "#E2DED7"
  bg-bottom: "#D8D3CA"
  tile: "#FFFFFF"
  edge: "rgba(70,45,20,.06)"
  edge-w: "1"
  active: "#D2691E"
  active-w: "0"
  active-soft: "#F7E3C2"
  active-soft-edge: "rgba(210,105,30,.35)"
  active-ink: "#9A4A12"
  ink: "#1F1B17"
  ink-dim: "#8A8177"
  ink-faint: "rgba(31,27,23,.30)"
  stroke: "#4A423A"
  window: "#CFC7BC"
  fabric: "#F6F1EA"
  drape: "#A39484"   # штора нового вида - приглушённая
  sash: "#F7F4EF"   # переплёт окна
  shadow: "#4A3420"
  cool: "#4F7C8A"
  inv-tile: "#8A4A20"
  inv-ink: "#FFF4E4"
  inv-dim: "rgba(255,244,228,.80)"
  inv-stroke: "#F3D59B"
  inv-accent: "#F2B54E"
  section: "#FFFFFF"
  section-op: ".75"
  ac-disk: "#8A4A20"
  ac-ink: "#FFF4E4"
  ac-dim: "rgba(255,244,228,.72)"
  ac-pill: "#F1ECE5"
  ac-pill-on: "#8A4A20"
  ac-pill-ink: "#FFF4E4"
  # механика фанкойла и кружков кондиционера (1.37): колодец, клавиша,
  # фаска, утопленная клавиша, погашенный светодиод, стекло табло
  well: "#E0DFDF"
  key-hi: "#FFFFFF"
  key-lo: "#F4F4F3"
  key-side: "#D2D1D1"
  key-in-a: "#DBDBDA"
  key-in-b: "#EFEFEF"
  led-off: "#B7B6B5"
  lcd: "#FFFFFF"
