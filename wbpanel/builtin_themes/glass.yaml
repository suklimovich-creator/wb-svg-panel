# Встроенная тема wb-svg-panel: стекло (с 1.40).
#
# Плитки - стекло поверх обоев: под плиткой видны приглушённые пятна
# цвета, по краю тонкий блик, сверху экрана - мягкий отсвет. Обои стоят
# на месте, плитки едут над ними при прокрутке. Включённое не обводится
# рамкой, а светится изнутри стекла.
#
# Задано немногое - остальное рассчитывается из основных цветов, как у
# своих тем (derive: true).
name: glass
title: "стекло"
extends: graphite
derive: true
mode: dark   # light | dark: от неё пульты, подписи графиков
on_style: rim   # включённое - свечение внутри стекла (depth: glass)
inv_kinds: []
sheen: false   # отсвет даёт само стекло
shadow: null   # тень под прозрачной плиткой легла бы внутрь неё
depth: glass   # форма: стекло поверх обоев
vars:
  bg-top: "#1B1D2C"
  bg-bottom: "#11121B"
  tile: "#25273A"   # непрозрачный цвет того же стекла - для пультов и подложек
  edge: "rgba(255,255,255,.10)"
  edge-w: "1"
  active: "#E9A866"
  active-w: "1.5"
  ink: "#F2F2F6"
  ink-dim: "rgba(255,255,255,.62)"
  ink-faint: "rgba(255,255,255,.30)"
  stroke: "#C9CAD4"
  section: "rgba(255,255,255,.06)"
  section-op: "1"
  cool: "#7FB8E6"
  ac-seg-heat: "#EE9A55"
  # стекло: налёт сверху и снизу, блик края, тень края, отсвет, свечение включённой
  glass-tint: "rgba(255,255,255,.075)"
  glass-tint2: "rgba(255,255,255,.025)"
  glass-hi: "rgba(255,255,255,.55)"
  glass-lo: "rgba(255,255,255,.10)"
  glare: "rgba(255,255,255,.09)"
  glass-on: "rgba(233,168,102,.38)"
  # обои: тёплая лампа, бирюза окна, фиолетовые сумерки, пыльная роза - приглушённые
  wall-1: "rgba(176,118,70,.50)"
  wall-2: "rgba(58,116,112,.45)"
  wall-3: "rgba(88,76,146,.45)"
  wall-4: "rgba(134,80,100,.35)"
