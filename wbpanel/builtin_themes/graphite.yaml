# Встроенная тема wb-svg-panel: графит.
# графит: тёмная тема построже
# Поверх тёмной: почти чёрный фон, плитки угольные с тонким контуром,
# у каждой мягкий отсвет из левого верхнего угла, у включённой - тёплый
# янтарный. Рамка включённой тоньше: о состоянии говорит отсвет.
#
# Значения - CSS-переменные плиток (без «--»). Тема наследует всё,
# чего не задала, у темы из extends.
name: graphite
title: "графит"
extends: dark
mode: dark   # light | dark: от неё пульты, подписи графиков
on_style: rim   # rim - рамка у включённой; card - тёмная карточка
inv_kinds: []   # типы плиток, у которых карточка тёмная всегда
sheen: true   # отсвет из угла плитки (тёмные темы)
shadow: null   # тени плиток не рисуются
# Роли настенного экрана (esp32-panel 0.12+): графит - его родная тема,
# цвета ровно как в прошивке без сервера. Остальное считается из vars.
# Раздел не наследуется: тема на основе графита пересчитает роли сама.
screen:
  panel.background: "#0E0F13"
  panel.surface: "#181A21"
  panel.surface_active: "#23262F"
  panel.line: "#2A2D36"
  tile.highlight: "#26272B"
  tile.border: "#303135"
  tile.active_background: "#24211D"
  tile.active_highlight: "#4D3B22"
  text.on_accent: "#17130D"
  state.inactive: "#9A9BA0"
  state.cool: "#6CC4FF"
  control.track: "#3A3B40"
  control.surface: "#27282C"
  control.button: "#35363B"
  control.pressed: "#4A4B50"
  control.well: "#111214"
  pad.background: "#111214"
  pad.sheet: "#26272A"
  chart.grid: "#4A4B50"
  # Кривые - как экран рисовал их до тем (цвета, что сервер слал в color).
  chart.series1: "#E08A2D"
  chart.series2: "#3B93C4"
  chart.series3: "#4E9A6B"
  chart.temperature: "#E08A2D"
  chart.humidity: "#3B93C4"
  chart.co2: "#4E9A6B"
  chart.voc: "#8E6BC4"
  chart.pressure: "#7A7F8C"
  chart.power: "#C4553B"
  curtain.sash: "#111214"
  thermostat.heating: "#FF9A3D"
  thermostat.cooling: "#3B8FD4"
vars:
  bg-top: "#151618"
  bg-bottom: "#0B0C0D"
  tile: "#1C1D20"
  edge: "rgba(255,255,255,.07)"
  edge-w: "1"
  active: "#F2A23A"
  active-w: "2"
  active-soft: "#34281A"
  active-soft-edge: "rgba(242,162,58,.30)"
  active-ink: "#F6B455"
  ink: "#F2F2F4"
  ink-dim: "rgba(255,255,255,.50)"
  ink-faint: "rgba(255,255,255,.26)"
  stroke: "#B8B9BF"
  window: "#2F353D"
  fabric: "#6E6A60"
  drape: "#403F3B"   # штора нового вида - приглушённая
  sash: "#111214"   # переплёт окна
  sheen: "rgba(255,255,255,.075)"
  sheen-on: "rgba(242,162,58,.34)"
  section: "#232427"
  section-op: "1"
  ac-disk: "#F2A23A"
  ac-ink: "#17130D"
  ac-dim: "rgba(23,19,13,.62)"
  ac-pill: "#27282C"
  ac-pill-on: "#F2A23A"
  ac-pill-ink: "#17130D"
  # механика фанкойла и кружков кондиционера (1.37): колодец, клавиша,
  # фаска, утопленная клавиша, погашенный светодиод, стекло табло
  well: "#101113"
  key-hi: "#404144"
  key-lo: "#2A2B2D"
  key-side: "#0F1012"
  key-in-a: "#191A1C"
  key-in-b: "#27282B"
  led-off: "#0D0D0E"
  lcd: "#111113"
