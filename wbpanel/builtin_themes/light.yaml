# Встроенная тема wb-svg-panel: светлая.
# Основа: от неё наследуют остальные темы.
#
# Значения - CSS-переменные плиток (без «--»). Тема наследует всё,
# чего не задала, у темы из extends.
name: light
title: "светлая"
extends: null
mode: light   # light | dark: от неё пульты, подписи графиков
on_style: rim   # rim - рамка у включённой; card - тёмная карточка
inv_kinds: []   # типы плиток, у которых карточка тёмная всегда
sheen: false   # отсвет из угла плитки (тёмные темы)
shadow: {amb: 0.13, key: 0.08}   # тени плиток: рассеянная и ключевая
depth: soft   # форма: soft - мягкая тень, flat - плоско, neumo - неоморфизм
edge: teeth   # край ручек и колёс: teeth - зубцы, smooth - гладкий, knurl - насечка
bevel: round   # фаска ручек и клавиш: round - мягкая, none - плоская, sharp - острая
radius: 24   # скругление углов плитки, px: 0-40
page: null   # поле страницы: light | dark, null - как у плиток (mode)
# Цвета графиков: у величины свой цвет, остальные линии - по порядку из
# palette. Цвет, заданный у серии в config.yaml, сильнее темы.
chart:
  temperature: "#E08A2D"
  humidity: "#3B93C4"
  co2: "#4E9A6B"
  voc: "#8E6BC4"
  pressure: "#7A7F8C"
  power: "#C4553B"
  palette: ["#E08A2D", "#3B93C4", "#8E8E93", "#4E9A6B", "#8E6BC4", "#C4553B"]
vars:
  # Подписи на поле страницы (с 1.43): заголовок, часы, разделы. Обычно
  # как на плитках; у тёмного нуара поле тёмное, а плитки светлые.
  page-ink: "var(--ink)"
  page-dim: "var(--ink-dim)"
  page-faint: "var(--ink-faint)"
  # Цвета карточек для color: у плитки (с 1.43)
  card-sage: "#DCE6D2"
  card-mustard: "#F2E3B6"
  card-terracotta: "#F3D5C5"
  card-sky: "#D6E5F2"
  card-lilac: "#E4DBEF"
  card-sand: "#EDE4D3"
  bg-top: "#F1F1F3"
  bg-bottom: "#E6E6E9"
  tile: "#D9D9DC"   # сама плитка
  edge: "rgba(60,60,67,.20)"
  edge-w: "1.5"
  active: "#E09B2D"   # рамка включённого устройства
  active-w: "3.5"
  # Чип строки состояния: мягкая версия .plate.on. У включённой плитки
  # активность показана рамкой 3.5 - для чипа высотой 36 это грубо,
  # поэтому здесь заливка и тонкий контур того же семейства.
  # Чернила значка гуще основного активного цвета: тонкие штрихи на
  # светлом фоне выцветают там, где широкая рамка ещё читается.
  active-soft: "#EBD9B4"
  active-soft-edge: "rgba(184,121,26,.35)"
  active-ink: "#A96A0F"
  ink: "#3A3A3E"
  ink-dim: "#8A8A90"
  ink-faint: "rgba(60,60,67,.34)"
  stroke: "#6E6E75"   # иконки
  window: "#B4BCC7"   # «улица» за шторой
  fabric: "#F0ECE5"   # ткань
  drape: "#9E978C"   # штора нового вида - приглушённая
  sash: "#F4F2EE"   # переплёт окна
  # Подложка включённой плитки. В светлой и тёмной та же, что у
  # выключенной - там о включении говорит рамка; ретро и мягкая
  # подкрашивают саму плитку.
  tile-on: "var(--tile)"
  shadow: "#34343C"
  # Светлая тень неоморфизма (depth: neumo); в остальных темах не видна.
  neu-light: "#FFFFFF"
  # Охлаждение - на дуге термостата и в режимах.
  cool: "#3B8FD4"
  # Тёмная карточка (класс inv). В темах без неё класс не ставится,
  # значения здесь - чтобы плоская подстановка не оставила пустот.
  inv-tile: "var(--tile)"
  inv-ink: "var(--ink)"
  inv-dim: "var(--ink-dim)"
  inv-stroke: "var(--stroke)"
  inv-accent: "var(--active)"
  chip-on-ink: "var(--ink)"
  section: "var(--tile)"
  section-op: ".35"
  # Колесо кондиционера: залитый диск, его чернила, полоски-таблетки
  # и яркий отрезок «сейчас - уставка» снаружи обода. Отрезок лежит на
  # плитке, а не на диске, поэтому цвета подобраны под подложку.
  ac-disk: "#2F2F34"
  ac-ink: "#F4F4F6"
  ac-dim: "rgba(244,244,246,.62)"
  ac-off: "#C8C8CC"
  ac-off-ink: "#3A3A3E"
  ac-off-dim: "#6E6E75"
  ac-pill: "#CACACE"
  ac-pill-on: "#2F2F34"
  ac-pill-ink: "#F4F4F6"
  ac-seg-cool: "#2D86D6"
  ac-seg-heat: "#E0661A"
  # механика фанкойла и кружков кондиционера (1.37): колодец, клавиша,
  # фаска, утопленная клавиша, погашенный светодиод, стекло табло
  well: "#C3C3C6"
  key-hi: "#F0F0F1"
  key-lo: "#D1D1D4"
  key-side: "#B9B9BC"
  key-in-a: "#C0C0C3"
  key-in-b: "#CECED1"
  led-off: "#A6A6A9"
  lcd: "#EAEAEC"
