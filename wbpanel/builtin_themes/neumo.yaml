# Встроенная тема wb-svg-panel: неоморфизм (с 1.32).
#
# Плитки из того же материала, что и фон: их отделяют не рамка и не
# цвет, а свет - светлая тень сверху-слева и тёмная снизу-справа, как у
# выдавленной в пластике кнопки. Включённая плитка утоплена. Клавиши,
# ручки и колёса - так же, двумя тенями.
#
# Задано немногое - остальное рассчитывается из основных цветов, как у
# своих тем (derive: true).
name: neumo
title: "неоморфизм"
extends: light
derive: true
mode: light   # light | dark: от неё пульты, подписи графиков
on_style: rim   # рамка у включённой - тонкая, главное - что она утоплена
inv_kinds: []
sheen: false
# В неоморфизме amb - сила тёмной тени, key - светлой.
shadow: {amb: 0.75, key: 1.0}
depth: neumo
vars:
  bg-top: "#E8ECF2"
  bg-bottom: "#E3E7EE"
  tile: "#E3E7EE"   # тот же материал, что и фон
  tile-on: "#E3E7EE"
  edge: "rgba(255,255,255,0)"
  edge-w: "0"
  active: "#E0902B"
  active-w: "1.5"
  ink: "#2E3440"
  cool: "#3B86C8"
  ac-seg-heat: "#DD6A22"
  shadow: "#A6B2C5"   # тёмная тень - не серая, а холодная, в тон фону
  neu-light: "#FFFFFF"
