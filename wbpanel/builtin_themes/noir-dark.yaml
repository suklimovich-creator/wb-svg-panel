# Встроенная тема wb-svg-panel: тёмный нуар (с 1.43).
# Нуар на тёмном поле: графитовый фон, бежевые карточки, чёрная
# включённая. Плитки - как у нуара (mode: light: тени, подписи графиков,
# шар света - светлые), поле страницы, шапка и окна - тёмные (page: dark).
#
# Значения - CSS-переменные плиток (без «--»). Тема наследует всё,
# чего не задала, у темы из extends.
name: noir-dark
title: "тёмный нуар"
extends: noir
mode: light   # плитки светлые
page: dark    # поле, шапка и окна - тёмные
# Тени на тёмном поле почти не видны - гуще и чёрные.
shadow: {amb: 0.42, key: 0.30}
vars:
  bg-top: "#1D1C1A"
  bg-bottom: "#121110"
  page-ink: "#EDE6DA"
  page-dim: "rgba(237,230,218,.62)"
  page-faint: "rgba(237,230,218,.40)"
  page-accent: "#CDB898"   # акцент окон и пультов на тёмном поле
  tile: "#E4DCCE"
  edge: "rgba(0,0,0,.30)"
  shadow: "#000000"
  section: "#262421"
  section-op: "1"
  # стекло табло и фон окон - светлее карточки, как у нуара
  lcd: "#F1EDE6"
